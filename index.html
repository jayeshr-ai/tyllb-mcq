"e":"This positivist theory, an outgrowth of dualism, holds that rules of international law become part of municipal law only when transformed by an act of the State (statute or other adoption)."},{"id":"pil-40","t":"Relationship","q":"The doctrine that customary international law is automatically part of English law is known as the doctrine of:","o":["Transformation","Incorporation","Delegation","Harmonisation"],"a":1,"e":"The doctrine of incorporation, traced to Blackstone and applied in Trendtex Trading Corp. v. Central Bank of Nigeria (1977), treats customary international law as part of the law of the land unless inconsistent with statute."},{"id":"pil-41","t":"Relationship","q":"In Mortensen v. Peters (1906), the Scottish court held that:","o":["International law prevails over a statute","A clear Act of Parliament prevails over a rule of international law","Custom cannot be applied","The ICJ has jurisdiction"],"a":1,"e":"Mortensen v. Peters (1906): a Danish captain was convicted under a Scottish statute for trawling in the Moray Firth beyond the three-mile limit; the court held that a clear statute binds the court even if it conflicts with international law."},{"id":"pil-42","t":"Relationship","q":"In the UK, a treaty which affects private rights or requires a change in the law:","o":["Applies automatically","Requires an Act of Parliament to have domestic effect","Needs the consent of the House of Lords only","Is void"],"a":1,"e":"Treaty-making is a prerogative of the Crown, but a treaty that changes domestic law or affects private rights needs enabling legislation by Parliament."},{"id":"pil-43","t":"Relationship","q":"Which Article of the Indian Constitution directs the State to foster respect for international law and treaty obligations?","o":["Article 51(c)","Article 73","Article 253","Article 372"],"a":0,"e":"Article 51(c), a Directive Principle, requires the State to foster respect for international law and treaty obligations in the dealings of organised peoples with one another."},{"id":"pil-44","t":"Relationship","q":"Parliament's power to make laws for implementing treaties is under:","o":["Article 51","Article 246","Article 253","Article 300"],"a":2,"e":"Article 253: Parliament has power to make any law for the whole or any part of India for implementing any treaty, agreement or convention, notwithstanding the distribution of legislative powers. Entry 14 of List I covers entering into treaties."},{"id":"pil-45","t":"Relationship","q":"International conventions not inconsistent with fundamental rights can be read into them. Held in:","o":["Vishaka v. State of Rajasthan","Kesavananda Bharati v. State of Kerala","A.K. Gopalan v. State of Madras","Golak Nath v. State of Punjab"],"a":0,"e":"Vishaka v. State of Rajasthan (1997): in the absence of domestic law on sexual harassment at the workplace, the Supreme Court relied on CEDAW to frame guidelines, holding that international conventions consistent with fundamental rights must be read into them to enlarge their meaning."},{"id":"pil-46","t":"Relationship","q":"In Gramophone Co. of India v. Birendra Bahadur Pandey (1984), the Supreme Court held that:","o":["International law never applies in India","Rules of international law are incorporated into national law unless they conflict with an Act of Parliament","Treaties are supreme over the Constitution","Only the President can apply international law"],"a":1,"e":"Gramophone Co. (1984): the comity of nations requires that rules of international law be accommodated in municipal law even without express legislative sanction, provided they do not run into conflict with Acts of Parliament."},{"id":"pil-47","t":"Relationship","q":"Cession of Indian territory to a foreign State requires a constitutional amendment. Held in:","o":["In re Berubari Union","Vishaka v. State of Rajasthan","Gramophone Co. v. Birendra Bahadur Pandey","Jolly George Varghese v. Bank of Cochin"],"a":0,"e":"In re Berubari Union (1960): the Supreme Court advised that transfer of Berubari to Pakistan under the Nehru-Noon Agreement required an amendment under Article 368 (which led to the Constitution (Ninth Amendment) Act, 1960)."},{"id":"pil-48","t":"Relationship","q":"In Jolly George Varghese v. Bank of Cochin (1980), the Supreme Court referred to which international instrument while interpreting S.51 CPC on arrest of judgment-debtors?","o":["CEDAW","International Covenant on Civil and Political Rights (Art. 11)","UN Charter","Geneva Conventions"],"a":1,"e":"Jolly George Varghese (1980): Justice Krishna Iyer read Article 11 of the ICCPR (no imprisonment merely for inability to fulfil a contractual obligation) into S.51 CPC, holding that a judgment-debtor cannot be jailed for mere inability to pay."},{"id":"pil-49","t":"Relationship","q":"In Maganbhai Ishwarbhai Patel v. Union of India (1969), the Supreme Court held that:","o":["Every treaty needs legislation","The executive may implement a treaty (such as the Kutch award) without legislation unless it affects citizens' rights or requires a change of law","Treaties are void without Parliament's approval","The President cannot sign treaties"],"a":1,"e":"Maganbhai (1969): the Rann of Kutch award could be implemented by executive action since it did not involve cession of territory or change in the law; legislation is needed only where a treaty restricts citizens' rights or modifies the law."},{"id":"pil-50","t":"Subjects","q":"The theory that only States are subjects of international law is the:","o":["Fictional theory","Realist theory","Functional theory","Monist theory"],"a":1,"e":"The realist (traditional) theory, associated with Oppenheim's early editions, holds that only States are subjects of international law and individuals are merely objects."},{"id":"pil-51","t":"Subjects","q":"Kelsen's view that individuals alone are the real subjects of international law, since States act through individuals, is called the:","o":["Realist theory","Fictional theory","Functional theory","Positivist theory"],"a":1,"e":"Under the fictional theory, Kelsen argued that the duties and rights of States are ultimately the duties and rights of the individuals who compose them; the State is a legal fiction."},{"id":"pil-52","t":"Subjects","q":"The functional theory of subjects of international law holds that:","o":["Only States are subjects","Only individuals are subjects","States, individuals and international organisations are all subjects","Only the UN is a subject"],"a":2,"e":"The functional (modern) theory accepts that States remain the primary subjects, but international organisations and individuals also possess rights and duties under international law."},{"id":"pil-53","t":"Subjects","q":"That the United Nations possesses international legal personality was held in:","o":["Corfu Channel Case","Reparation for Injuries Advisory Opinion (1949)","Lotus Case","Nottebohm Case"],"a":1,"e":"Reparation for Injuries Suffered in the Service of the United Nations (1949): after the assassination of Count Bernadotte, the ICJ advised that the UN has international personality and can bring a claim against a State, even a non-member, for injury to its agent."},{"id":"pil-54","t":"Subjects","q":"The Nuremberg Tribunal (1946) is significant for establishing that:","o":["Only States can commit crimes","Individuals can be held criminally responsible under international law; crimes are committed by men, not abstract entities","War is lawful","Heads of State are always immune"],"a":1,"e":"The Nuremberg judgment held that crimes against international law are committed by men, not by abstract entities, and only by punishing individuals can its provisions be enforced; official position is no defence."},{"id":"pil-55","t":"Subjects","q":"In the Danzig Railway Officials Case (PCIJ 1928), it was held that:","o":["Treaties can never confer rights on individuals","A treaty may directly create rights and obligations for individuals if the parties so intend","Only States may sue","Danzig was not a State"],"a":1,"e":"The PCIJ advised that an international agreement can create rights for individuals enforceable in municipal courts if that was the intention of the parties, countering the strict view that individuals are mere objects."},{"id":"pil-56","t":"Subjects","q":"Which of the following is NOT ordinarily treated as a subject of international law?","o":["States","International organisations","Private multinational companies","The Holy See"],"a":2,"e":"States, international organisations, individuals (to a limited extent), insurgents and belligerents and the Holy See have international personality; companies ordinarily act through the State of their nationality (Barcelona Traction)."},{"id":"pil-57","t":"State","q":"The essential elements of a State are laid down in:","o":["Vienna Convention, 1969","Montevideo Convention, 1933","UN Charter","Hague Convention, 1907"],"a":1,"e":"Article 1 of the Montevideo Convention on the Rights and Duties of States, 1933: a permanent population, a defined territory, government, and capacity to enter into relations with other States."},{"id":"pil-58","t":"State","q":"Which is NOT an element of statehood under the Montevideo Convention?","o":["Permanent population","Defined territory","Recognition by the United Nations","Capacity to enter into relations with other States"],"a":2,"e":"Article 1 lists four elements; UN membership or recognition is not one of them. Article 3 adds that the political existence of a State is independent of recognition."},{"id":"pil-59","t":"State","q":"\"Sovereignty\" as an attribute of statehood means:","o":["Supreme authority internally and independence externally","Membership of the UN","Possession of nuclear weapons","Recognition by all States"],"a":0,"e":"Sovereignty denotes supreme authority within the territory and independence from the authority of any other State in external relations (Island of Palmas: \"independence in regard to a portion of the globe\")."},{"id":"pil-60","t":"Recognition","q":"Recognition of a State is:","o":["The act by which existing States acknowledge that a new entity possesses the attributes of statehood","A UN resolution","A treaty of alliance","An act of the ICJ"],"a":0,"e":"Recognition is a unilateral political act by which an existing State acknowledges that a community has the qualifications of statehood (or that a regime is the government) and signifies willingness to deal with it."},{"id":"pil-61","t":"Recognition","q":"According to the Constitutive theory of recognition:","o":["Recognition merely declares an existing fact","A State becomes an international person only through recognition","Recognition is irrelevant","Only the UN can recognise"],"a":1,"e":"The constitutive theory (Hegel, Anzilotti, Oppenheim, Holland) holds that recognition creates statehood; an unrecognised entity has no rights or duties under international law. It is criticised because it makes statehood depend on the political will of other States."},{"id":"pil-62","t":"Recognition","q":"The Declaratory theory of recognition is supported by:","o":["Hegel and Anzilotti","Hall, Brierly and Pitt Cobbett","Oppenheim and Holland","Austin"],"a":1,"e":"The declaratory (evidentiary) theory (Hall, Brierly, Fisher, Pitt Cobbett, Wagner) holds that statehood exists as a fact once the Montevideo criteria are met; recognition merely acknowledges it. This view is reflected in Art. 3 of the Montevideo Convention."},{"id":"pil-63","t":"Recognition","q":"Lauterpacht's middle view on recognition is that:","o":["Recognition is purely political","Recognition is constitutive, but States are under a legal duty to recognise an entity that fulfils the conditions of statehood","Recognition is never required","Only de facto recognition exists"],"a":1,"e":"Hersch Lauterpacht accepted the constitutive theory but argued that recognition is not a matter of discretion; once the factual requirements exist, other States are legally bound to recognise."},{"id":"pil-64","t":"Recognition","q":"De facto recognition is:","o":["Final and irrevocable","Provisional and can be withdrawn","Given only by the UN","Not known to international law"],"a":1,"e":"De facto recognition is provisional, given when the new State or government has effective control but its stability or permanence is doubtful. De jure recognition is full and final."},{"id":"pil-65","t":"Recognition","q":"Which of the following is a consequence available only to a de jure recognised government?","o":["Immunity from suit","Right to claim State property situated in the recognising State and to represent the State in succession","Right to sue","Validity of its internal acts"],"a":1,"e":"Only a de jure recognised government can claim the State's property abroad (Haile Selassie v. Cable and Wireless, 1939) and full diplomatic representation; both de facto and de jure governments enjoy immunity and validity of their acts."},{"id":"pil-66","t":"Recognition","q":"The retroactive effect of recognition was upheld in:","o":["Luther v. Sagor","Chorzow Factory Case","Asylum Case","Island of Palmas Case"],"a":0,"e":"Luther v. Sagor (1921): once the Soviet Government was recognised de facto by the UK, its decree nationalising timber was given effect from the date it was made; the Court of Appeal also held that there is no difference between de facto and de jure recognition as to validity of internal acts."},{"id":"pil-67","t":"Recognition","q":"In The Arantzazu Mendi (1939), the House of Lords held that:","o":["Only de jure governments enjoy sovereign immunity","A de facto recognised government (Franco's Nationalists) was entitled to sovereign immunity in respect of a ship it had requisitioned","Spain was not a State","Ships have no nationality"],"a":1,"e":"The Arantzazu Mendi (1939): the Nationalist Government, recognised de facto as governing part of Spain, could not be impleaded in English courts; a de facto government enjoys immunity."},{"id":"pil-68","t":"Recognition","q":"The Stimson Doctrine relates to:","o":["Non-recognition of situations created by illegal use of force","Automatic recognition of governments","State succession","Freedom of the high seas"],"a":0,"e":"The Stimson Doctrine (1932), announced by US Secretary of State Henry Stimson after Japan's occupation of Manchuria (Manchukuo), declares that situations brought about by means contrary to the Kellogg-Briand Pact will not be recognised."},{"id":"pil-69","t":"Recognition","q":"The Estrada Doctrine originated in:","o":["USA","Mexico","Ecuador","Germany"],"a":1,"e":"The Estrada Doctrine (1930), named after Mexican Foreign Minister Genaro Estrada, holds that recognition of governments is an insulting practice; Mexico would merely continue or withdraw its diplomats without pronouncing on the legitimacy of a new government."},{"id":"pil-70","t":"Recognition","q":"The Tobar Doctrine (1907) proposed that:","o":["Governments coming to power by unconstitutional means should not be recognised until constitutionally confirmed","All governments must be recognised","Recognition should be collective","Recognition is irrelevant"],"a":0,"e":"Proposed by Carlos Tobar, Foreign Minister of Ecuador, the doctrine of legitimacy denied recognition to governments established by revolution until approved by the people constitutionally."},{"id":"pil-71","t":"Recognition","q":"Admission of a new State to the United Nations is an example of:","o":["Conditional recognition","Collective recognition","De facto recognition","Recognition of belligerency"],"a":1,"e":"Admission to the UN (Art. 4 of the Charter) is often treated as collective recognition of statehood, though technically it does not bind individual members to recognise the new member bilaterally."},{"id":"pil-72","t":"Recognition","q":"Recognition may be:","o":["Express only","Implied only","Express or implied (e.g., by concluding a bilateral treaty or exchanging diplomatic representatives)","Only through the ICJ"],"a":2,"e":"Recognition may be express (formal declaration or note) or implied from conduct such as entering into a bilateral treaty, establishing diplomatic relations, or receiving consuls with exequatur."},{"id":"pil-73","t":"Recognition","q":"Recognition of \"belligerency\" requires:","o":["A mere riot","An armed conflict of a general character, occupation of a substantial part of territory, conduct of hostilities under a responsible authority and observance of the laws of war","UN approval","A treaty"],"a":1,"e":"Recognition of belligerency grants the insurgents the rights and duties of a belligerent under the laws of war and imposes neutrality on the recognising State. The conditions were applied by Britain when it recognised the Confederacy as a belligerent in 1861."},{"id":"pil-74","t":"Recognition","q":"Withdrawal of recognition is possible in the case of:","o":["De jure recognition only","De facto recognition, where the government fails to establish itself","Neither","Both, freely"],"a":1,"e":"De facto recognition is provisional and may be withdrawn if the recognised authority fails to consolidate; de jure recognition is generally treated as final and irrevocable, though recognition of a government lapses when it is replaced."},{"id":"pil-75","t":"Recognition","q":"Premature recognition of a seceding entity, before the parent State has given up the struggle, is regarded as:","o":["Lawful","An unlawful intervention in the affairs of the parent State","Mandatory","Collective recognition"],"a":1,"e":"Recognising a secessionist entity before it has established effective and stable control amounts to intervention in the internal affairs of the parent State (e.g., France's recognition of the USA in 1778 was treated by Britain as a cause of war)."},{"id":"pil-76","t":"Succession","q":"State succession means:","o":["Change of government","Replacement of one State by another in the responsibility for the international relations of territory","Admission to the UN","Recognition of a State"],"a":1,"e":"Art. 2 of the Vienna Convention on Succession of States in respect of Treaties, 1978 defines succession of States as the replacement of one State by another in the responsibility for the international relations of territory."},{"id":"pil-77","t":"Succession","q":"Which convention deals with succession of States in respect of treaties?","o":["Vienna Convention, 1961","Vienna Convention, 1969","Vienna Convention, 1978","Vienna Convention, 1983"],"a":2,"e":"The Vienna Convention on Succession of States in respect of Treaties was adopted in 1978 (in force 1996); the 1983 Convention deals with State property, archives and debts (not yet in force)."},{"id":"pil-78","t":"Succession","q":"Under the \"clean slate\" doctrine, a newly independent State:","o":["Is bound by all treaties of the predecessor","Is not bound by the predecessor's treaties","Cannot enter into treaties","Loses its territory"],"a":1,"e":"Art. 16 of the 1978 Convention: a newly independent State is not bound to maintain in force any treaty by reason only of the fact that it was in force for the predecessor in respect of the territory (tabula rasa)."},{"id":"pil-79","t":"Succession","q":"Which treaties generally continue to bind the successor State?","o":["Treaties of alliance","Political treaties","Boundary and territorial treaties","Treaties of neutrality"],"a":2,"e":"Dispositive or \"real\" treaties creating boundaries or territorial regimes continue (Arts. 11-12 of the 1978 Convention; principle of uti possidetis), while personal and political treaties lapse."},{"id":"pil-80","t":"Succession","q":"Universal succession occurs when:","o":["Part of the territory is ceded","The predecessor State is completely extinguished, e.g., by absorption, merger or dismemberment","A new government takes over","A State joins the UN"],"a":1,"e":"In universal (total) succession the predecessor State ceases to exist (e.g., merger of the two Germanys in 1990, dissolution of Czechoslovakia in 1993); in partial succession only part of the territory passes."},{"id":"pil-81","t":"Succession","q":"The rule that a successor State is not liable for the torts (delicts) of the predecessor was applied in:","o":["Robert E. Brown Claim (1923) and West Rand Central Gold Mining Co. v. R (1905)","Lotus Case","Corfu Channel Case","Asylum Case"],"a":0,"e":"In West Rand Central Gold Mining Co. v. R (1905), after Britain annexed the Transvaal, the court held the conquering State does not succeed to the obligations of the conquered State. The Robert E. Brown claim (US v. UK, 1923) reached the same result for unliquidated damages."},{"id":"pil-82","t":"Succession","q":"The Tinoco Arbitration (1923) between Great Britain and Costa Rica concerned:","o":["Succession of States","Succession of governments: obligations contracted by a de facto government (Tinoco regime) bound the restored government","Boundary dispute","Recognition of belligerency"],"a":1,"e":"Chief Justice Taft as arbitrator held that the Tinoco regime, having been in effective control, was a government whose contracts bound Costa Rica, even though it had not been recognised by Britain; non-recognition was evidence but not conclusive."},{"id":"pil-83","t":"Succession","q":"On the partition of India in 1947:","o":["Both India and Pakistan applied afresh for UN membership","India continued the membership of British India in the UN while Pakistan applied as a new member","Neither joined the UN","Pakistan was treated as the continuing State"],"a":1,"e":"India was treated as the continuation of the predecessor and retained UN membership; Pakistan was admitted as a new member on 30 September 1947. Similarly, Russia continued the USSR's seat in 1991."},{"id":"pil-84","t":"Territory","q":"Acquisition of terra nullius by effective control is called:","o":["Cession","Occupation","Prescription","Accretion"],"a":1,"e":"Occupation is the acquisition of territory belonging to no State (terra nullius) by taking effective possession with the intention to act as sovereign."},{"id":"pil-85","t":"Territory","q":"Continuous and peaceful display of sovereignty prevails over mere discovery. Held in:","o":["Island of Palmas Case","Corfu Channel Case","Asylum Case","Barcelona Traction Case"],"a":0,"e":"Island of Palmas (Netherlands v. USA, 1928, arbitrator Max Huber): Spain's discovery gave only an inchoate title which could not prevail over the Netherlands' continuous and peaceful display of State authority; title must be maintained by effective occupation."},{"id":"pil-86","t":"Territory","q":"In the Eastern Greenland Case (1933), the PCIJ held in favour of Denmark on the basis of:","o":["Conquest","Peaceful and continuous display of State authority, with very little actual exercise required in thinly populated areas","A treaty with Norway","UN resolution"],"a":1,"e":"Legal Status of Eastern Greenland (Denmark v. Norway, 1933): Denmark's title was upheld on the basis of continued display of authority; the Ihlen Declaration by the Norwegian Foreign Minister was also held binding on Norway."},{"id":"pil-87","t":"Territory","q":"In the Clipperton Island Case (1931), France's title was upheld because:","o":["It had a large population there","Effective occupation of an uninhabited island requires only a minimal display of authority, which France had shown in 1858","Mexico consented","The island was ceded by Spain"],"a":1,"e":"The arbitrator (King of Italy) held that for an uninhabited territory, the taking of possession and proclamation of sovereignty by France in 1858, without subsequent physical presence, was sufficient; Mexico had not shown an earlier title."},{"id":"pil-88","t":"Territory","q":"In the Western Sahara Advisory Opinion (1975), the ICJ held that:","o":["Western Sahara was terra nullius","Territory inhabited by tribes with social and political organisation was not terra nullius at the time of Spanish colonisation","Morocco had full sovereignty","Spain must remain"],"a":1,"e":"The ICJ found that Western Sahara was not terra nullius when colonised by Spain in 1884, as it was inhabited by peoples socially and politically organised, and that neither Morocco nor Mauritania had ties of territorial sovereignty."},{"id":"pil-89","t":"Territory","q":"Acquisition of territory by continuous and undisturbed exercise of sovereignty over the territory of another State for a long period is called:","o":["Occupation","Prescription","Accretion","Cession"],"a":1,"e":"Prescription is the acquisition of title through long-continued, peaceful, public and undisturbed possession of territory that originally belonged to another State, with that State's acquiescence."},{"id":"pil-90","t":"Territory","q":"Addition of new territory through natural causes such as river deposits or emergence of islands is called:","o":["Prescription","Accretion","Cession","Avulsion"],"a":1,"e":"Accretion is the gradual increase of territory by natural processes (alluvium); the Chamizal arbitration (US v. Mexico, 1911) distinguished slow accretion from sudden avulsion."},{"id":"pil-91","t":"Territory","q":"Transfer of territory by one State to another by treaty is called:","o":["Accretion","Cession","Annexation","Occupation"],"a":1,"e":"Cession is the peaceful transfer of sovereignty over territory by agreement, e.g., the purchase of Alaska by the USA from Russia in 1867, or the transfer of French settlements (Pondicherry) to India in 1954-56."},{"id":"pil-92","t":"Territory","q":"Acquisition of territory by conquest is now illegal by virtue of:","o":["Article 2(4) of the UN Charter","Article 38 of the ICJ Statute","Article 51(c) of the Indian Constitution","The Montevideo Convention"],"a":0,"e":"Article 2(4) prohibits the threat or use of force against the territorial integrity of any State; conquest and annexation no longer confer valid title (reaffirmed in the Friendly Relations Declaration, 1970)."},{"id":"pil-93","t":"Territory","q":"The principle of uti possidetis juris, applied in Burkina Faso v. Mali (1986), means that:","o":["Newly independent States inherit the colonial administrative boundaries","Boundaries are redrawn on independence","Conquest confers title","Rivers always form boundaries"],"a":0,"e":"Uti possidetis juris freezes the territorial title at the moment of independence, so that former colonial administrative lines become international frontiers, to avoid fratricidal struggles."},{"id":"pil-94","t":"Territory","q":"The India-Bangladesh Land Boundary Agreement exchanging enclaves was implemented by:","o":["An ordinary Act of Parliament","The Constitution (100th Amendment) Act, 2015","An executive order","A UN resolution"],"a":1,"e":"Following Berubari, the exchange of enclaves under the 1974 Agreement and 2011 Protocol required amendment of the First Schedule by the Constitution (One Hundredth Amendment) Act, 2015."},{"id":"pil-95","t":"Jurisdiction","q":"The principle under which any State may try pirates is:","o":["Territorial principle","Nationality principle","Protective principle","Universal principle"],"a":3,"e":"Under the universality principle, certain offences (piracy jure gentium, war crimes, genocide, crimes against humanity) are so grave that any State may exercise jurisdiction regardless of where they were committed or the nationality of the offender."},{"id":"pil-96","t":"Jurisdiction","q":"The \"passive personality\" principle bases jurisdiction on:","o":["The place of the offence","The nationality of the offender","The nationality of the victim","The security of the State"],"a":2,"e":"The passive personality principle allows a State to try an alien for an offence committed abroad against its own national. It was controversial in the Lotus Case and is now accepted mainly for terrorism."},{"id":"pil-97","t":"Jurisdiction","q":"The protective (security) principle permits a State to exercise jurisdiction over:","o":["Any offence anywhere","Acts committed abroad by aliens that threaten the security, integrity or vital interests of the State","Only its own nationals","Only piracy"],"a":1,"e":"The protective principle covers offences such as counterfeiting currency, espionage and plotting against the State; Joyce v. DPP (1946) (\"Lord Haw-Haw\") is often cited."},{"id":"pil-98","t":"Jurisdiction","q":"In the Eichmann Case (1961-62), the Israeli courts asserted jurisdiction over Nazi crimes committed outside Israel mainly on the basis of:","o":["Territorial principle","Universality and protective principles","Nationality of the accused","A treaty with Germany"],"a":1,"e":"Attorney-General of Israel v. Eichmann: the District Court of Jerusalem and the Supreme Court relied on universal jurisdiction over crimes against humanity and on the protective (linking) principle, despite Eichmann's abduction from Argentina."},{"id":"pil-99","t":"Jurisdiction","q":"The doctrine of sovereign immunity of a foreign State from the jurisdiction of local courts was first laid down in:","o":["The Schooner Exchange v. McFaddon (1812)","Paquete Habana","Luther v. Sagor","Pinochet Case"],"a":0,"e":"Chief Justice Marshall in The Schooner Exchange v. McFaddon (1812) held that a public armed vessel of a friendly foreign sovereign was immune from the jurisdiction of US courts; this is the origin of the absolute immunity doctrine."},{"id":"pil-100","t":"Jurisdiction","q":"The modern \"restrictive\" theory of sovereign immunity distinguishes between:","o":["Large and small States","Acts jure imperii (sovereign acts) and acts jure gestionis (commercial acts)","Civil and criminal cases","Monarchies and republics"],"a":1,"e":"Under the restrictive theory, immunity is granted for sovereign or governmental acts (jure imperii) but not for commercial or private-law acts (jure gestionis). The UK adopted it in Trendtex (1977) and the State Immunity Act, 1978."},{"id":"pil-101","t":"Jurisdiction","q":"Diplomatic immunities and privileges are codified in:","o":["Vienna Convention on Diplomatic Relations, 1961","Vienna Convention on the Law of Treaties, 1969","Vienna Convention on Consular Relations, 1963","Montevideo Convention, 1933"],"a":0,"e":"The Vienna Convention on Diplomatic Relations, 1961 codifies the inviolability of diplomatic agents (Art. 29), immunity from criminal jurisdiction (Art. 31) and inviolability of mission premises (Art. 22). India implemented it by the Diplomatic Relations (Vienna Convention) Act, 1972."},{"id":"pil-102","t":"Jurisdiction","q":"In the Pinochet Case (1999), the House of Lords held that:","o":["A former head of State enjoys absolute immunity for all acts","A former head of State has no immunity from extradition proceedings for torture, an international crime, committed while in office","Chile could not be sued","Torture is lawful for heads of State"],"a":1,"e":"R v. Bow Street Magistrate, ex parte Pinochet (No. 3) (1999): immunity ratione materiae of a former head of State does not extend to torture after the UK, Spain and Chile became parties to the Torture Convention, since torture cannot be an official function."},{"id":"pil-103","t":"Responsibility","q":"The ILC Articles on Responsibility of States for Internationally Wrongful Acts were adopted in:","o":["1945","1969","2001","2010"],"a":2,"e":"The International Law Commission adopted the Draft Articles (ARSIWA) in 2001; the General Assembly took note of them in Resolution 56/83. They are widely treated as reflecting customary law."},{"id":"pil-104","t":"Responsibility","q":"Under Art. 2 of the ILC Articles, an internationally wrongful act requires:","o":["Only damage","Conduct attributable to the State under international law which constitutes a breach of an international obligation","A treaty","A UN resolution"],"a":1,"e":"Art. 2 ARSIWA: there is an internationally wrongful act when conduct consisting of an action or omission is attributable to the State and constitutes a breach of an international obligation of the State. Fault and damage are not separate general requirements."},{"id":"pil-105","t":"Responsibility","q":"\"Breach of an engagement involves an obligation to make reparation\" was laid down in:","o":["Chorzow Factory Case","Lotus Case","Reparation Case","Paquete Habana"],"a":0,"e":"Chorzow Factory (Germany v. Poland, PCIJ 1928): it is a principle of international law that the breach of an engagement involves an obligation to make reparation in an adequate form; reparation must wipe out all the consequences of the illegal act."},{"id":"pil-106","t":"Responsibility","q":"The first contentious case decided by the ICJ was:","o":["Corfu Channel Case","Asylum Case","Nottebohm Case","Lotus Case"],"a":0,"e":"Corfu Channel (UK v. Albania, 1949): Albania was held responsible for damage to British warships from mines in its waters because it must have known of them and failed to warn; every State is obliged not to allow knowingly its territory to be used for acts contrary to the rights of other States."},{"id":"pil-107","t":"Responsibility","q":"The Trail Smelter Arbitration (1941) between the USA and Canada established the principle that:","o":["A State may use its territory as it pleases","No State has the right to use or permit the use of its territory so as to cause injury by fumes to the territory of another (transboundary harm)","Smelters are illegal","Canada owed no reparation"],"a":1,"e":"Trail Smelter: Canada was held responsible for sulphur dioxide fumes from a smelter in British Columbia damaging property in Washington State, and ordered to pay compensation and control emissions."},{"id":"pil-108","t":"Responsibility","q":"The rule that an alien must exhaust local remedies before his State may bring an international claim is illustrated by:","o":["Interhandel Case (1959) and Ambatielos Arbitration (1956)","Lotus Case","Asylum Case","Reparation Case"],"a":0,"e":"In the Interhandel Case (Switzerland v. USA, 1959), the ICJ held the Swiss claim inadmissible because local remedies in US courts had not been exhausted. The rule allows the respondent State a chance to redress the wrong through its own system."},{"id":"pil-109","t":"Responsibility","q":"The Calvo Clause, named after the Argentine jurist Carlos Calvo, provides that:","o":["Aliens may always invoke diplomatic protection","An alien contracting with a State agrees to rely only on local remedies and waives diplomatic protection by his home State","Debts must be collected by force","States are never responsible for injuries to aliens"],"a":1,"e":"The Calvo Doctrine asserts that aliens are entitled only to the treatment given to nationals and must not seek diplomatic intervention; the Calvo Clause inserts this into contracts. Its validity under international law is contested (North American Dredging Co. case, 1926)."},{"id":"pil-110","t":"Responsibility","q":"The Drago Doctrine (1902) states that:","o":["Public debts cannot be recovered from a State by armed force","States must pay all debts","Aliens have no rights","Force may be used to collect debts"],"a":0,"e":"Argentine Foreign Minister Luis Drago, responding to the blockade of Venezuela, declared that public debt cannot occasion armed intervention or occupation of territory; the principle was partly adopted in the Hague Convention II of 1907 (Porter Convention)."},{"id":"pil-111","t":"Responsibility","q":"The Rainbow Warrior Arbitration (1990) between New Zealand and France concerned:","o":["Fishing rights","State responsibility for the sinking of a Greenpeace vessel by French agents and breach of the subsequent agreement","Nuclear tests at Mururoa only","Recognition"],"a":1,"e":"France was held responsible for the bombing of the Rainbow Warrior in Auckland harbour in 1985 and later for removing its agents from Hao island in breach of the 1986 agreement; the award discussed circumstances precluding wrongfulness (force majeure, distress)."},{"id":"pil-112","t":"Nationality","q":"In the Nottebohm Case (1955), the ICJ held that:","o":["Any grant of nationality must be recognised internationally","For diplomatic protection, nationality must be based on a \"genuine and effective link\" between the individual and the State","Guatemala must compensate Liechtenstein","Dual nationality is prohibited"],"a":1,"e":"Nottebohm (Liechtenstein v. Guatemala, 1955): Liechtenstein could not exercise diplomatic protection for Nottebohm against Guatemala because his naturalisation lacked a genuine connection with Liechtenstein, his real links being with Germany and Guatemala."},{"id":"pil-113","t":"Nationality","q":"Under international law, is a State bound to extradite a fugitive in the absence of a treaty?","o":["Yes, always","No; extradition is generally a matter of treaty or reciprocity, not a customary duty","Yes, for all political offences","Only if the UN orders it"],"a":1,"e":"There is no general duty under customary international law to extradite; extradition rests on bilateral or multilateral treaties and municipal law (in India, the Extradition Act, 1962). Political offenders are usually excluded from extradition."},{"id":"pil-114","t":"Nationality","q":"The Savarkar Case (1911) between France and Great Britain decided that:","o":["Savarkar must be returned to France","Britain was not bound to restore Savarkar to France even though he had been recaptured on French soil with the assistance of a French policeman","France had jurisdiction over Savarkar","Asylum was granted"],"a":1,"e":"The Permanent Court of Arbitration held that there was no rule of international law obliging Britain to return V.D. Savarkar to France, as the irregularity in his recapture at Marseilles did not create such a duty."},{"id":"pil-115","t":"Nationality","q":"The right of a person to seek and enjoy asylum from persecution is recognised in:","o":["Article 14 of the Universal Declaration of Human Rights, 1948","Article 2(4) of the UN Charter","Article 38 of the ICJ Statute","The Montevideo Convention"],"a":0,"e":"Art. 14 UDHR: everyone has the right to seek and to enjoy in other countries asylum from persecution. Territorial asylum is a right of the State; diplomatic asylum in embassies is not generally recognised (Asylum Case, 1950)."},{"id":"pil-116","t":"UN","q":"The UN Charter came into force on:","o":["26 June 1945","24 October 1945","10 December 1948","1 January 1946"],"a":1,"e":"The Charter was signed at San Francisco on 26 June 1945 and came into force on 24 October 1945, now celebrated as United Nations Day."},{"id":"pil-117","t":"UN","q":"The ICJ consists of ____ judges elected for a term of ____ years:","o":["9; 15","15; 9","11; 5","15; 5"],"a":1,"e":"Art. 3 and Art. 13 of the ICJ Statute: fifteen judges, no two of whom may be nationals of the same State, elected by the General Assembly and Security Council for nine years, with one-third retiring every three years; they may be re-elected."},{"id":"pil-118","t":"UN","q":"Only ____ may be parties in contentious cases before the ICJ:","o":["Individuals","States","International organisations","NGOs"],"a":1,"e":"Art. 34(1) of the ICJ Statute: only States may be parties in cases before the Court. International organisations may request advisory opinions under Art. 65."},{"id":"pil-119","t":"UN","q":"The ICJ's predecessor, the Permanent Court of International Justice, was established under:","o":["The UN Charter","The Covenant of the League of Nations (1920)","The Hague Convention 1899","The Treaty of Westphalia"],"a":1,"e":"The PCIJ was set up under Art. 14 of the League Covenant and sat at The Hague from 1922 to 1946; the ICJ replaced it in 1946 as the principal judicial organ of the UN (Art. 92 of the Charter)."},{"id":"pil-120","t":"UN","q":"The ICJ's compulsory jurisdiction under the \"optional clause\" is contained in:","o":["Art. 36(2) of the Statute","Art. 38","Art. 59","Art. 65"],"a":0,"e":"Art. 36(2): States may declare that they recognise as compulsory ipso facto and without special agreement the jurisdiction of the Court in all legal disputes with any other State accepting the same obligation. India's declaration contains several reservations."},{"id":"pil-121","t":"UN","q":"Which of the following is NOT a principal organ of the United Nations?","o":["Security Council","Economic and Social Council","International Law Commission","Trusteeship Council"],"a":2,"e":"Art. 7 of the Charter lists six principal organs: General Assembly, Security Council, ECOSOC, Trusteeship Council, ICJ and Secretariat. The ILC is a subsidiary body of the General Assembly for codification of international law."}]}]};
const SUBJECTS = DATA.subjects; // [{key,name,short,scope,topics,questions:[{id,t,q,o,a,e}]}]
const ALLQ = SUBJECTS.flatMap(s => s.questions.map(q => ({ ...q, s: s.key })));
const BYID = Object.fromEntries(ALLQ.map(q => [q.id, q]));
const SUBJ = Object.fromEntries(SUBJECTS.map(s => [s.key, s]));
const COLOR = { cpc: 'var(--c-cpc)', bnss: 'var(--c-bnss)', labour: 'var(--c-labour)', pil: 'var(--c-pil)', all: 'var(--c-all)' };
const KEY = 'tyllb-mcq-v1';

let store = { stats: {}, flags: {}, settings: { subject: 'all', mode: 'practice', count: 20, topic: 'all', wrongOnly: false } };
try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); store = { ...store, ...s, settings: { ...store.settings, ...(s.settings || {}) } }; } } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

let view = 'home';
let quiz = null; // {items:[{id, opts:[{text,idx}], ans, picked}], i, mode, started, finished}
let reviewFilter = 'wrong';
let timer = null;

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const positional = /of the above|of these|\(a\)|\(b\)|of the two/i;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pool() {
  const st = store.settings;
  let qs = st.subject === 'all' ? ALLQ : ALLQ.filter(q => q.s === st.subject);
  if (st.subject !== 'all' && st.topic !== 'all') qs = qs.filter(q => q.t === st.topic);
  if (st.wrongOnly) qs = qs.filter(q => (store.stats[q.id] || {}).wrong > 0);
  return qs;
}
function subjectAcc(key) {
  let seen = 0, ok = 0;
  (key === 'all' ? ALLQ : ALLQ.filter(q => q.s === key)).forEach(q => { const s = store.stats[q.id]; if (s) { seen += s.seen; ok += s.correct; } });
  return { seen, ok };
}
function fmtTime(ms) { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

/* ---------- home ---------- */
function renderHome() {
  stopTimer();
  const st = store.settings;
  const tot = subjectAcc('all');
  const attemptedQ = Object.keys(store.stats).length;
  const flagged = Object.keys(store.flags).length;
  const wrongCount = ALLQ.filter(q => (store.stats[q.id] || {}).wrong > 0).length;
  const p = pool();
  const subj = SUBJ[st.subject];
  const n = Math.min(p.length, st.count === 'all' ? p.length : st.count);
  app.innerHTML = `
    <div class="band"><div class="wrap">
      <p class="eyebrow">TY LLB · MCQ examination 2026-27</p>
      <h1>MCQ Trainer</h1>
      <p class="sub">${ALLQ.length} questions across CPC, BNSS, Labour Law II and Public International Law, each with an explanation.</p>
    </div></div>
    <div class="wrap main">
      <div class="stats">
        <div class="stat"><b>${attemptedQ}<span style="font-size:.9rem;color:var(--muted)"> / ${ALLQ.length}</span></b><span>questions seen</span></div>
        <div class="stat"><b>${tot.seen ? Math.round(100 * tot.ok / tot.seen) : 0}%</b><span>accuracy (${tot.ok} of ${tot.seen})</span></div>
        <div class="stat"><b>${wrongCount}</b><span>to revise</span></div>
      </div>
      <div class="section-title"><h2>Subject</h2><span class="muted">tap to select</span></div>
      <div class="subjects" role="group" aria-label="Subject">
        ${[{ key: 'all', name: 'All four subjects', short: 'ALL', questions: ALLQ }, ...SUBJECTS].map(s => {
          const a = subjectAcc(s.key); const pct = a.seen ? Math.round(100 * a.ok / a.seen) : 0;
          return `<button class="subj" data-subject="${s.key}" aria-pressed="${st.subject === s.key}" style="--sc:${COLOR[s.key]}">
            <span class="mono" aria-hidden="true">${esc(s.short)}</span>
            <span><span class="name">${esc(s.name)}</span>
            <span class="meta">${s.questions.length} questions · ${a.seen ? pct + '% correct so far' : 'not started'}</span>
            <span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span></span></button>`; }).join('')}
      </div>
      <div class="section-title"><h2>Set up the round</h2></div>
      <div class="card settings">
        <fieldset><legend class="eyebrow">Mode</legend><div class="seg">
          <button data-mode="practice" aria-pressed="${st.mode === 'practice'}">Practice<span class="desc">answer and explanation after each question</span></button>
          <button data-mode="test" aria-pressed="${st.mode === 'test'}">Test<span class="desc">score and review at the end</span></button></div></fieldset>
        <fieldset><legend class="eyebrow">Questions in this round</legend><div class="seg">
          ${[10, 20, 40, 60, 'all'].map(c => `<button data-count="${c}" aria-pressed="${String(st.count) === String(c)}">${c === 'all' ? 'All' : c}</button>`).join('')}</div></fieldset>
        ${subj ? `<fieldset><legend class="eyebrow">Topic</legend><select id="topic" aria-label="Topic">
          <option value="all" ${st.topic === 'all' ? 'selected' : ''}>All topics in ${esc(subj.name)}</option>
          ${subj.topics.map(t => `<option value="${esc(t)}" ${st.topic === t ? 'selected' : ''}>${esc(t)} (${subj.questions.filter(q => q.t === t).length})</option>`).join('')}</select></fieldset>` : ''}
        <label class="toggle"><input type="checkbox" id="wrongOnly" ${st.wrongOnly ? 'checked' : ''} ${wrongCount ? '' : 'disabled'}> Only questions I have answered wrong before (${wrongCount})</label>
      </div>
      <div class="start">
        <button class="btn-primary" id="start" ${p.length ? '' : 'disabled'}>${p.length ? `Start ${n} question${n === 1 ? '' : 's'} · ${st.mode === 'practice' ? 'Practice' : 'Test'}` : 'No questions match these filters'}</button>
        <div class="row">
          <button class="btn-ghost" id="flaggedBtn" ${flagged ? '' : 'disabled'}>Practise bookmarked (${flagged})</button>
          <button class="btn-ghost" id="reset">Reset progress</button>
        </div>
      </div>
      <footer class="note">Progress is saved in this browser only. Check figures against your bare act before the exam.</footer>
    </div>`;
  app.querySelectorAll('[data-subject]').forEach(b => b.onclick = () => { st.subject = b.dataset.subject; st.topic = 'all'; save(); renderHome(); });
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { st.mode = b.dataset.mode; save(); renderHome(); });
  app.querySelectorAll('[data-count]').forEach(b => b.onclick = () => { st.count = b.dataset.count === 'all' ? 'all' : +b.dataset.count; save(); renderHome(); });
  const tsel = document.getElementById('topic'); if (tsel) tsel.onchange = () => { st.topic = tsel.value; save(); renderHome(); };
  document.getElementById('wrongOnly').onchange = e => { st.wrongOnly = e.target.checked; save(); renderHome(); };
  document.getElementById('start').onclick = () => startQuiz(pool());
  document.getElementById('flaggedBtn').onclick = () => startQuiz(Object.keys(store.flags).map(id => BYID[id]).filter(Boolean), 'all');
  document.getElementById('reset').onclick = () => {
    const b = document.getElementById('reset');
    if (b.dataset.armed) { store.stats = {}; store.flags = {}; save(); renderHome(); }
    else { b.dataset.armed = '1'; b.textContent = 'Tap again to confirm reset'; setTimeout(() => { delete b.dataset.armed; b.textContent = 'Reset progress'; }, 3000); }
  };
}

/* ---------- quiz ---------- */
function startQuiz(qs, countOverride) {
  const st = store.settings;
  const n = countOverride === 'all' || st.count === 'all' ? qs.length : Math.min(qs.length, st.count);
  const picked = shuffle(qs.slice()).slice(0, n);
  quiz = {
    mode: st.mode, i: 0, started: Date.now(), finished: false,
    items: picked.map(q => {
      let opts = q.o.map((text, idx) => ({ text, idx }));
      if (!q.o.some(o => positional.test(o))) opts = shuffle(opts);
      return { id: q.id, opts, ans: opts.findIndex(o => o.idx === q.a), picked: -1 };
    }),
  };
  view = 'quiz'; renderQuiz(); window.scrollTo(0, 0);
}
function renderQuiz() {
  const it = quiz.items[quiz.i]; const q = BYID[it.id]; const subj = SUBJ[q.s];
  const answered = it.picked >= 0; const revealed = quiz.mode === 'practice' && answered;
  const last = quiz.i === quiz.items.length - 1;
  app.innerHTML = `
    <div class="qtop">
      <div class="wrap">
        <button class="btn-ghost" id="quit">Quit</button>
        <span><span class="count">${quiz.i + 1} / ${quiz.items.length}</span> <span class="time" id="time">${fmtTime(Date.now() - quiz.started)}</span></span>
        <button class="flag" id="flag" aria-pressed="${!!store.flags[q.id]}" title="Bookmark this question">${store.flags[q.id] ? '★ Bookmarked' : '☆ Bookmark'}</button>
      </div>
      <div class="progress" aria-hidden="true"><i style="width:${100 * quiz.i / quiz.items.length}%"></i></div>
    </div>
    <div class="wrap qwrap">
      <div class="card">
        <div class="tags"><span class="tag subject" style="--sc:${COLOR[q.s]}">${esc(subj.short)}</span><span class="tag">${esc(q.t)}</span></div>
        <p class="question">${esc(q.q)}</p>
        <div class="opts" role="group" aria-label="Options">
          ${it.opts.map((o, k) => {
            let cls = 'opt', mark = '';
            if (revealed) { if (k === it.ans) { cls += ' correct'; mark = 'Correct'; } else if (k === it.picked) { cls += ' wrong'; mark = 'Your pick'; } }
            else if (k === it.picked) cls += ' selected';
            return `<button class="${cls}" data-k="${k}" ${revealed ? 'disabled' : ''}><span class="k">${'ABCD'[k]}</span><span class="t">${esc(o.text)}</span>${mark ? `<span class="mark">${mark}</span>` : ''}</button>`; }).join('')}
        </div>
        ${revealed ? `<div class="explain"><p class="verdict ${it.picked === it.ans ? 'ok' : 'bad'}">${it.picked === it.ans ? '✓ Correct' : `✗ Not quite. The answer is ${'ABCD'[it.ans]}.`}</p><p class="lbl">Why</p><p>${esc(q.e)}</p></div>` : ''}
        <div class="actions">
          <span class="hint">${quiz.mode === 'practice' ? 'Keys 1-4 or A-D answer · Enter for next' : 'Keys 1-4 choose · you can change before Next'}</span>
          <button class="btn-primary" id="next" ${answered ? '' : 'disabled'}>${last ? 'Finish round' : 'Next →'}</button>
        </div>
      </div>
    </div>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
  document.getElementById('next').onclick = next;
  document.getElementById('flag').onclick = () => { if (store.flags[q.id]) delete store.flags[q.id]; else store.flags[q.id] = 1; save(); renderQuiz(); };
  document.getElementById('quit').onclick = () => { const b = document.getElementById('quit'); if (b.dataset.armed) { view = 'home'; quiz = null; renderHome(); } else { b.dataset.armed = '1'; b.textContent = 'Quit? Tap again'; setTimeout(() => { delete b.dataset.armed; b.textContent = 'Quit'; }, 3000); } };
  stopTimer(); timer = setInterval(() => { const t = document.getElementById('time'); if (t && quiz) t.textContent = fmtTime(Date.now() - quiz.started); }, 1000);
}
function pick(k) {
  const it = quiz.items[quiz.i];
  if (quiz.mode === 'practice' && it.picked >= 0) return;
  it.picked = k;
  if (quiz.mode === 'practice') record(it);
  renderQuiz();
  if (quiz.mode === 'practice') { const ex = app.querySelector('.explain'); if (ex) ex.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
function record(it) {
  const s = store.stats[it.id] || { seen: 0, correct: 0, wrong: 0 };
  s.seen++; if (it.picked === it.ans) { s.correct++; } else { s.wrong++; }
  store.stats[it.id] = s; save();
}
function next() {
  const it = quiz.items[quiz.i]; if (it.picked < 0) return;
  if (quiz.i < quiz.items.length - 1) { quiz.i++; renderQuiz(); window.scrollTo(0, 0); }
  else finish();
}
function finish() {
  if (quiz.mode === 'test') quiz.items.forEach(record);
  quiz.finished = true; quiz.ended = Date.now(); view = 'results'; reviewFilter = 'wrong'; stopTimer(); renderResults(); window.scrollTo(0, 0);
}

/* ---------- results ---------- */
function renderResults() {
  const n = quiz.items.length; const ok = quiz.items.filter(it => it.picked === it.ans).length; const pct = Math.round(100 * ok / n);
  const byTopic = {};
  quiz.items.forEach(it => { const q = BYID[it.id]; const k = SUBJ[q.s].short + ' · ' + q.t; byTopic[k] = byTopic[k] || { n: 0, ok: 0 }; byTopic[k].n++; if (it.picked === it.ans) byTopic[k].ok++; });
  const wrong = quiz.items.filter(it => it.picked !== it.ans);
  const r = 66, c = 2 * Math.PI * r;
  const shown = reviewFilter === 'wrong' ? wrong : quiz.items;
  app.innerHTML = `
    <div class="band"><div class="wrap"><p class="eyebrow">Round complete</p><h1>${pct >= 80 ? 'Strong round' : pct >= 50 ? 'Getting there' : 'Keep drilling'}</h1></div></div>
    <div class="wrap main">
    <div class="card score" style="margin-top:-48px">
      <svg class="ring" viewBox="0 0 160 160" role="img" aria-label="${pct}% correct">
        <circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
        <circle cx="80" cy="80" r="${r}" fill="none" stroke="${pct >= 50 ? 'var(--ok)' : 'var(--bad)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c * pct / 100} ${c}" transform="rotate(-90 80 80)"/>
        <text x="80" y="90" text-anchor="middle" font-size="32">${pct}%</text></svg>
      <div>
        <h2>${ok} of ${n} correct</h2>
        <p class="muted">${fmtTime(quiz.ended - quiz.started)} · ${quiz.mode === 'practice' ? 'practice' : 'test'} mode</p>
        <div class="row" style="margin-top:14px">
          ${wrong.length ? `<button class="btn-primary" id="retryWrong">Retry the ${wrong.length} wrong</button>` : ''}
          <button id="again">New round</button>
          <button class="btn-ghost" id="home">Home</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:14px"><p class="eyebrow">By topic (weakest first)</p><div class="topics">
      ${Object.entries(byTopic).sort((a, b) => (a[1].ok / a[1].n) - (b[1].ok / b[1].n)).map(([k, v]) => `<div class="topic"><span>${esc(k)}</span><span style="font-variant-numeric:tabular-nums">${v.ok}/${v.n}</span><span class="bar" aria-hidden="true"><i style="width:${100 * v.ok / v.n}%;background:${v.ok === v.n ? 'var(--ok)' : v.ok / v.n >= .5 ? 'var(--gold)' : 'var(--bad)'}"></i></span></div>`).join('')}
    </div></div>
    <div class="section-title" style="margin-top:26px">
      <h2>Review</h2>
      <div class="seg"><button data-rf="wrong" aria-pressed="${reviewFilter === 'wrong'}">Wrong only (${wrong.length})</button><button data-rf="all" aria-pressed="${reviewFilter === 'all'}">All (${n})</button></div>
    </div>
    <div class="review">
      ${shown.length ? shown.map(it => { const q = BYID[it.id]; const okq = it.picked === it.ans; return `<div class="card">
        <div class="tags"><span class="tag subject" style="--sc:${COLOR[q.s]}">${esc(SUBJ[q.s].short)}</span><span class="tag">${esc(q.t)}</span>${store.flags[q.id] ? '<span class="tag">★ Bookmarked</span>' : ''}</div>
        <p class="q">${esc(q.q)}</p>
        ${okq ? `<p class="ans ok">${esc(it.opts[it.picked].text)}</p>` : `<p class="ans bad">Your answer: ${esc(it.opts[it.picked].text)}</p><p class="ans ok">Correct: ${esc(it.opts[it.ans].text)}</p>`}
        <p class="exp">${esc(q.e)}</p></div>`; }).join('') : '<div class="card empty">Nothing wrong in this round.</div>'}
    </div></div>`;
  const rw = document.getElementById('retryWrong'); if (rw) rw.onclick = () => startQuiz(wrong.map(it => BYID[it.id]), 'all');
  document.getElementById('again').onclick = () => { view = 'home'; renderHome(); window.scrollTo(0, 0); };
  document.getElementById('home').onclick = () => { view = 'home'; renderHome(); window.scrollTo(0, 0); };
  app.querySelectorAll('[data-rf]').forEach(b => b.onclick = () => { reviewFilter = b.dataset.rf; renderResults(); });
}

document.addEventListener('keydown', e => {
  if (view !== 'quiz' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k.length === 1 && '1234'.includes(k)) pick(+k - 1);
  else if (k.length === 1 && 'abcd'.includes(k)) pick('abcd'.indexOf(k));
  else if (e.key === 'Enter' || e.key === 'ArrowRight') next();
});

function start(saved) {
  if (saved && saved.quiz && !saved.quiz.finished) { quiz = saved.quiz; view = 'quiz'; renderQuiz(); }
  else renderHome();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ quiz }));
(window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script></body></html>
