<meta name="description" content="Practice MCQs with explanations for CPC, BNSS, Labour Law II and Public International Law.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Light-only design (by choice): oxblood brand band on top, white cards on a cool off-white ground, one column max 820px. */
:root {
  color-scheme: light;
  --bg: #F4F4F2; --surface: #FFFFFF; --surface-2: #EEEDE9; --fg: #1F1B18; --muted: #6B6560; --line: #E2DFD8;
  --brand: #7A1F2B; --brand-deep: #5A1620; --brand-fg: #FFFFFF; --gold: #C9A24A; --gold-ink: #7A5A12;
  --ok: #2E6B4F; --ok-bg: #E3F1E8; --bad: #B23E2F; --bad-bg: #F8E5E1;
  --c-cpc: #2F5D8A; --c-bnss: #7A1F2B; --c-labour: #2E6B4F; --c-pil: #8A5A1C; --c-all: #3E3A44;
  --font-display: "Newsreader", "Cambria", Georgia, serif; --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --shadow: 0 1px 2px rgba(31,27,24,.06), 0 6px 20px rgba(31,27,24,.06);
}
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 2.1rem } h2 { font-size: 1.5rem } h3 { font-size: 1.15rem }
p { margin: 0 }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; transition: background .15s, border-color .15s, transform .05s; }
button:active { transform: translateY(1px) }
button:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
button:disabled { opacity: .5; cursor: default; transform: none }
.btn-primary { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); font-weight: 600; }
.btn-primary:not(:disabled):hover { background: var(--brand-deep) }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted) }
.btn-ghost:hover { background: var(--surface-2); color: var(--fg) }
.btn-light { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); color: #fff }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.eyebrow { font-size: .76rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
.band { background: linear-gradient(135deg, var(--brand-deep), var(--brand) 60%, #9A3341); color: var(--brand-fg); }
.band .wrap { padding-block: 26px 70px; }
.band h1 { color: #fff; }
.band .eyebrow { color: var(--gold) }
.band p.sub { color: rgba(255,255,255,.8); margin-top: 6px; max-width: 48ch }
.wrap { max-width: 820px; margin: 0 auto; padding-inline: 16px; }
.main { padding-block: 0 56px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: -48px; margin-bottom: 26px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1 }
.stat span { font-size: .8rem; color: var(--muted) }
@media (max-width: 520px) { .stat { padding: 12px } .stat b { font-size: 1.4rem } }
.section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 12px; gap: 10px; flex-wrap: wrap }
.subjects { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 22px; }
@media (max-width: 560px) { .subjects { grid-template-columns: 1fr } }
.subj { text-align: left; padding: 14px; display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; border-radius: 16px; border: 2px solid var(--line); min-width: 0; box-shadow: var(--shadow); }
.subj:hover { border-color: var(--muted) }
.subj[aria-pressed="true"] { border-color: var(--sc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sc) 16%, transparent), var(--shadow); }
.subj .mono { width: 52px; height: 52px; border-radius: 14px; background: var(--sc); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: .02em }
.subj .name { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; display: block }
.subj .meta { font-size: .85rem; color: var(--muted); display: block }
.subj .bar { margin-top: 8px }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); width: 0 }
.settings { display: grid; gap: 18px; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { padding: 0; margin-bottom: 8px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; max-width: 100% }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 14px; color: var(--muted); font-weight: 600 }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12) }
.seg .desc { display: block; font-weight: 400; font-size: .8rem; color: var(--muted) }
select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: inherit; max-width: 100%; }
label.toggle { display: flex; gap: 10px; align-items: center; }
label.toggle input { width: 20px; height: 20px; accent-color: var(--brand); }
.start { position: sticky; bottom: 0; padding-block: 12px env(safe-area-inset-bottom, 0px); background: linear-gradient(to top, var(--bg) 75%, transparent); margin-top: 10px; }
.start .btn-primary { width: 100%; padding: 15px; font-size: 1.08rem; border-radius: 12px; box-shadow: 0 6px 18px rgba(122,31,43,.25) }
.start .row { margin-top: 8px; justify-content: space-between }

/* quiz */
.qtop { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2 }
.qtop .wrap { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 10px; }
.qtop .count { font-weight: 600; font-variant-numeric: tabular-nums }
.qtop .time { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums }
.progress { height: 5px; background: var(--surface-2); }
.progress i { display: block; height: 100%; background: var(--brand); transition: width .25s; }
.qwrap { padding-block: 22px 56px }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center }
.tag { font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.subject { background: var(--sc); color: #fff; }
.question { font-family: var(--font-display); font-size: 1.42rem; font-weight: 500; line-height: 1.35; margin-bottom: 20px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: center; text-align: left; padding: 13px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); width: 100%; line-height: 1.4; }
.opt .k { flex: 0 0 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9rem; background: var(--surface-2); color: var(--muted); }
.opt .t { min-width: 0; flex: 1 }
.opt .mark { flex: 0 0 auto; font-weight: 700; font-size: .85rem }
.opt:not(:disabled):hover { border-color: var(--brand); background: #FFF9F9 }
.opt.selected { border-color: var(--fg); }
.opt.selected .k { background: var(--fg); color: #fff; }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.correct .k { background: var(--ok); color: #fff; } .opt.correct .mark { color: var(--ok) }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); color: #fff; } .opt.wrong .mark { color: var(--bad) }
.opt:disabled { cursor: default; opacity: 1; transform: none }
.opt:disabled:not(.correct):not(.wrong) { opacity: .55 }
.explain { margin-top: 18px; padding: 16px 18px; border-radius: 14px; background: #FBF7EC; border: 1px solid #EBDDB4; }
.explain .verdict { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px }
.explain .verdict.ok { color: var(--ok) } .explain .verdict.bad { color: var(--bad) }
.explain .lbl { font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-ink); font-weight: 700; margin-bottom: 4px }
.actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; flex-wrap: wrap; align-items: center }
.actions .btn-primary { padding: 12px 26px; border-radius: 12px }
.flag[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1F1B18; font-weight: 600 }
.hint { font-size: .85rem; color: var(--muted); }

/* results */
.score { display: grid; grid-template-columns: 160px 1fr; gap: 24px; align-items: center; }
@media (max-width: 560px) { .score { grid-template-columns: 1fr; justify-items: center; text-align: center } .score .row { justify-content: center } }
.ring { width: 160px; height: 160px; max-width: 100% }
.ring text { fill: var(--fg); font-family: var(--font-display); font-weight: 600; }
.topics { display: grid; gap: 10px; margin-top: 14px; }
.topic { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; font-size: .95rem; }
.topic .bar { grid-column: 1 / -1 }
.review { display: grid; gap: 12px; margin-top: 14px; }
.review .card { padding: 16px 18px }
.review .q { font-family: var(--font-display); font-size: 1.12rem; margin-bottom: 8px; }
.review .ans { font-size: .95rem; margin: 2px 0; padding-left: 22px; position: relative }
.review .ans::before { position: absolute; left: 0; font-weight: 700 }
.review .ans.ok { color: var(--ok) } .review .ans.ok::before { content: "✓" }
.review .ans.bad { color: var(--bad) } .review .ans.bad::before { content: "✗" }
.review .exp { font-size: .95rem; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line) }
.empty { padding: 30px; text-align: center; color: var(--muted) }
footer.note { margin-top: 30px; font-size: .85rem; color: var(--muted); text-align: center }
@media (prefers-reduced-motion: reduce) { .progress i, button { transition: none } }
</style>

<script>
const DATA = {"subjects":[{"key":"cpc","name":"Civil Procedure Code","short":"CPC","scope":"Jurisdiction of civil courts; summons under Order V","topics":["Basics","Jurisdiction","Kinds","Pecuniary","Territorial","Objections","Summons","Order V","Service"],"questions":[{"id":"cpc-1","t":"Basics","q":"The Code of Civil Procedure, 1908 is best described as:","o":["A law that creates civil rights","A procedural law that provides the machinery for enforcing civil rights","A penal law","A law on evidence"],"a":1,"e":"The CPC is adjective (procedural) law. It does not create or define rights; it lays down how civil courts enforce rights created by substantive law. It came into force on 1 January 1909."},{"id":"cpc-2","t":"Basics","q":"The Orders in the First Schedule of the CPC differ from the sections of the Code in that the Orders:","o":["Cannot be changed at all","Can be altered or added to by High Courts under their rule-making power","Apply only in Mumbai","Override the sections"],"a":1,"e":"Under S.122 High Courts may annul, alter or add to the rules in the First Schedule for courts in their State. The sections themselves can be amended only by the legislature, and in case of conflict the sections prevail."},{"id":"cpc-3","t":"Basics","q":"Which of the following is a correct statement about the structure of the CPC?","o":["158 sections and 51 Orders","484 sections and 37 chapters","511 sections","56 sections and 12 Orders"],"a":0,"e":"The body of the CPC has 158 sections in 11 Parts; the First Schedule contains 51 Orders with rules; the other Schedules have been repealed except the Appendices (forms)."},{"id":"cpc-4","t":"Jurisdiction","q":"A court has \"jurisdiction\" over a suit when it has:","o":["The power or authority to hear and decide that case","A judge available","Received the court fee","The consent of both parties"],"a":0,"e":"Jurisdiction means the authority which a court has to decide matters litigated before it (Official Trustee v. Sachindra Nath, 1969). It is conferred by law, not by the parties or by payment of fees."},{"id":"cpc-5","t":"Jurisdiction","q":"A tenant sues for an injunction restraining the landlord from cutting off the water supply. Is this a suit of civil nature that an ordinary civil court can try?","o":["No, it is a tenancy matter","Yes, it concerns a private civil right, and civil courts try all suits of a civil nature unless cognizance is expressly or impliedly barred","Only if the Collector permits","Only in a High Court"],"a":1,"e":"S.9: courts have jurisdiction to try all suits of a civil nature except suits whose cognizance is expressly or impliedly barred. A dispute over a private right between landlord and tenant is civil in nature."},{"id":"cpc-6","t":"Jurisdiction","q":"Members of a caste expel a person and he sues to be declared a member of the caste again, claiming no right to property or office. The suit is:","o":["Of civil nature","Not of civil nature, because a purely caste question with no civil right involved is outside S.9","Triable only by a Family Court","Triable only by a criminal court"],"a":1,"e":"Purely caste or social questions (expulsion from caste, mere dignity or honour) are not of a civil nature. The suit would be civil if a right to property, office or some legal right were in issue."},{"id":"cpc-7","t":"Jurisdiction","q":"A suit claims the hereditary right to perform worship as pujari in a temple and the decision turns entirely on religious rites. The suit is:","o":["Not of civil nature because religion is involved","Of civil nature, because the right to an office is in issue, even though it depends on questions of religious rites","Barred by public policy","Triable only by a religious endowment board"],"a":1,"e":"Explanation I to S.9: a suit in which the right to property or to an office is contested is a suit of a civil nature even if the right depends entirely on questions as to religious rites or ceremonies."},{"id":"cpc-8","t":"Jurisdiction","q":"Does it matter, for the purpose of a suit over a religious office, that no fees are attached to the office?","o":["Yes, a suit lies only if fees are attached","No, it is immaterial whether fees are attached or whether the office is attached to a particular place","Yes, unless the office is hereditary","Only if the office is in a temple"],"a":1,"e":"Explanation II to S.9 (added in 1976): it is immaterial whether or not any fees are attached to the office or whether the office is attached to a particular place."},{"id":"cpc-9","t":"Jurisdiction","q":"A statute creates a tribunal to decide disputes about a particular tax and makes its orders \"final\". A party sues in the civil court on the same dispute. The civil court should decide its jurisdiction by asking:","o":["Whether the plaintiff is rich","Whether the statute gives an adequate remedy and whether exclusion is express or implied, applying the Dhulabhai principles","Whether the tribunal is in the same city","Nothing; civil courts always have jurisdiction"],"a":1,"e":"Dhulabhai v. State of M.P. (1969) laid down seven principles: finality of a tribunal's orders excludes civil-court jurisdiction only if the statute provides adequate remedies for what the civil court would normally do; but a suit lies where the statutory provisions are not complied with or the tribunal acted outside the fundamental principles of judicial procedure."},{"id":"cpc-10","t":"Jurisdiction","q":"Who bears the burden of proving that the jurisdiction of the civil court is excluded?","o":["The plaintiff","The party who asserts that jurisdiction is ousted","The court itself","The State"],"a":1,"e":"The presumption is in favour of jurisdiction of the civil court; exclusion is not readily inferred and the burden lies on the party who contends that jurisdiction is barred (Secretary of State v. Mask & Co., 1940)."},{"id":"cpc-11","t":"Jurisdiction","q":"A court with no jurisdiction over the subject-matter passes a decree. Years later, in execution, the judgment-debtor objects that the decree is void. The objection is:","o":["Barred because it was not raised in the trial","Maintainable, because a decree passed without jurisdiction is a nullity and its invalidity can be set up whenever it is sought to be enforced","Barred by res judicata","Maintainable only in the Supreme Court"],"a":1,"e":"Kiran Singh v. Chaman Paswan (1954): a decree passed by a court without jurisdiction is a nullity, and its invalidity can be set up at any stage, even in execution or in collateral proceedings."},{"id":"cpc-12","t":"Jurisdiction","q":"Both parties agree in writing that a Small Causes Court may decide their partition suit. The court:","o":["Gets jurisdiction because of the consent","Still has no jurisdiction, because consent cannot confer jurisdiction on a court that lacks it","Can decide with the High Court's permission","Can decide if the value is below Rs 1 lakh"],"a":1,"e":"Consent, waiver or acquiescence cannot confer jurisdiction on a court which has none, nor take away jurisdiction a court has. A Small Causes Court cannot try a partition suit."},{"id":"cpc-13","t":"Jurisdiction","q":"A contract says \"all disputes shall be decided only by courts at Mumbai\". Both Mumbai and Delhi courts otherwise have jurisdiction. The clause is:","o":["Void under S.28 of the Contract Act","Valid; parties may choose one of several courts that already have jurisdiction","Valid only if registered","Invalid because it ousts the Delhi court"],"a":1,"e":"Hakam Singh v. Gammon (India) Ltd (1971) and ABC Laminart v. A.P. Agencies (1989): where two or more courts have jurisdiction, an agreement to confine disputes to one of them is valid and does not offend S.28 of the Contract Act. It cannot, however, confer jurisdiction on a court that has none."},{"id":"cpc-14","t":"Jurisdiction","q":"In deciding whether it has jurisdiction, the court looks at:","o":["The plaint as framed by the plaintiff","The written statement of the defendant","The evidence of both sides","The opinion of the Public Prosecutor"],"a":0,"e":"Jurisdiction is determined on the averments in the plaint, not on the defence raised in the written statement."},{"id":"cpc-15","t":"Jurisdiction","q":"A court having jurisdiction decides a question of law wrongly. The resulting decree is:","o":["A nullity","Erroneous, but valid until set aside in appeal or revision","Void in execution","Automatically reversed"],"a":1,"e":"There is a distinction between lack of jurisdiction (decree void) and irregular or erroneous exercise of jurisdiction (decree valid until corrected in appeal or revision)."},{"id":"cpc-16","t":"Kinds","q":"The jurisdiction that depends on the amount or value of the subject-matter of the suit is called:","o":["Territorial jurisdiction","Pecuniary jurisdiction","Subject-matter jurisdiction","Appellate jurisdiction"],"a":1,"e":"Pecuniary jurisdiction (S.6) limits a court to suits whose value does not exceed the limit fixed for it."},{"id":"cpc-17","t":"Kinds","q":"Which of these suits is outside the jurisdiction of a Court of Small Causes?","o":["Suit for price of goods sold","Suit for specific performance of a contract to sell land","Suit for arrears of rent","Suit for a small money loan"],"a":1,"e":"Small Causes Courts have limited subject-matter jurisdiction: suits for specific performance, injunction, partition and those concerning immovable property are excluded."},{"id":"cpc-18","t":"Kinds","q":"A court that can both try suits at first instance and hear appeals from lower courts is said to have:","o":["Only original jurisdiction","Only appellate jurisdiction","Both original and appellate jurisdiction, like a District Court","Exclusive jurisdiction"],"a":2,"e":"District Courts and High Courts have original jurisdiction (trying suits) as well as appellate jurisdiction (hearing appeals)."},{"id":"cpc-19","t":"Kinds","q":"In the hierarchy of civil courts under the CPC, a Court of Small Causes is subordinate to:","o":["Only the Supreme Court","The High Court and the District Court","No court","The Collector"],"a":1,"e":"S.3: the District Court is subordinate to the High Court; every civil court of a grade inferior to a District Court and every Court of Small Causes is subordinate to the High Court and the District Court."},{"id":"cpc-20","t":"Pecuniary","q":"A suit valued at Rs 8 lakh is filed in a court whose pecuniary limit is Rs 5 lakh. The court:","o":["May try it with the plaintiff's consent","Has no jurisdiction, since no court can try a suit whose value exceeds its pecuniary limits","May try it after increasing the court fee","May try it if the defendant does not object"],"a":1,"e":"S.6: nothing in the Code operates to give any court jurisdiction over suits the amount or value of which exceeds the pecuniary limits of its ordinary jurisdiction."},{"id":"cpc-21","t":"Pecuniary","q":"A plaintiff files a Rs 50,000 suit directly in the District Court even though the Civil Judge (Junior Division) is competent to try it. The decree passed by the District Court is:","o":["A nullity","Valid; the rule that a suit be filed in the court of the lowest grade competent is a rule of procedure, not of jurisdiction","Void unless the defendant consented","Valid only if the District Judge records reasons"],"a":1,"e":"S.15 requires every suit to be instituted in the court of the lowest grade competent to try it, but a decree passed by a higher court is not void for breach of this rule; it is a matter of procedure meant to avoid overcrowding higher courts."},{"id":"cpc-22","t":"Pecuniary","q":"For deciding which court has pecuniary jurisdiction, the value of the suit is normally taken from:","o":["The defendant's estimate","The plaintiff's valuation in the plaint, unless it is arbitrary or deliberately wrong","The market value fixed by the Collector","The amount of the decree"],"a":1,"e":"The plaintiff's valuation ordinarily determines jurisdiction; the court may interfere if the valuation is arbitrary, unreasonable or deliberately made to choose a particular court."},{"id":"cpc-23","t":"Territorial","q":"A, living in Delhi, wants to sue for partition of ancestral land situated in Nashik. Where must the suit be filed?","o":["Delhi, where the plaintiff lives","Nashik, where the land is situated","Mumbai, in the High Court","Any court in Maharashtra"],"a":1,"e":"S.16(b): suits for partition of immovable property must be instituted in the court within whose local limits the property is situate."},{"id":"cpc-24","t":"Territorial","q":"Which of the following suits must be filed where the immovable property is situated?","o":["Recovery of immovable property with rent or mesne profits","Foreclosure, sale or redemption of a mortgage of immovable property","Compensation for wrong to immovable property","All of the above"],"a":3,"e":"S.16(a)-(f) covers recovery, partition, mortgage suits, determination of any other right or interest, compensation for wrong to immovable property, and recovery of movable property under distraint or attachment."},{"id":"cpc-25","t":"Territorial","q":"A sues B for an injunction restraining B from trespassing on A's land at Thane. B lives in Pune. The relief can be obtained entirely through B's personal obedience. A may file the suit in:","o":["Thane only","Pune only","Either Thane (where the property is) or Pune (where B resides), under the proviso to S.16","The High Court only"],"a":2,"e":"Proviso to S.16: where the relief sought can be entirely obtained through the personal obedience of the defendant, the suit may be filed either where the property is situate or where the defendant resides, carries on business or personally works for gain. The rule reflects the maxim \"equity acts in personam\"."},{"id":"cpc-26","t":"Territorial","q":"A files in Delhi a suit for specific performance of an agreement to sell a flat in Gurgaon, with delivery of possession. The Delhi court:","o":["Has jurisdiction because the contract was signed in Delhi","Has no jurisdiction; a suit for specific performance with possession of immovable property must be filed where the property is situate","Has jurisdiction if the defendant lives in Delhi","Has jurisdiction with leave of the court"],"a":1,"e":"Harshad Chiman Lal Modi v. DLF Universal Ltd (2005): such a suit falls within S.16(d) and the proviso does not apply because the court would have to deliver possession; the suit lies only where the property is situated."},{"id":"cpc-27","t":"Territorial","q":"A single plot of land lies partly in District X and partly in District Y. A suit for its recovery may be filed in:","o":["Only District X","Only District Y","Either District X or District Y, provided the whole claim is within that court's pecuniary limits","Only the High Court"],"a":2,"e":"S.17: where immovable property is situate within the jurisdiction of different courts, the suit may be instituted in any court within whose local limits any portion of the property is situate, subject to pecuniary jurisdiction."},{"id":"cpc-28","t":"Territorial","q":"It is uncertain whether a piece of land falls within the limits of Court X or Court Y. Court X records a statement that there is such uncertainty and tries the suit. Its decree is:","o":["Void for want of jurisdiction","Valid, and has the same effect as if the property were within its jurisdiction","Valid only if Court Y consents","Void unless confirmed by the High Court"],"a":1,"e":"S.18: where it is uncertain within which of two or more courts' limits property is situate, any of them may record a statement to that effect and proceed; its decree has the same effect as if the property were situated within its local limits."},{"id":"cpc-29","t":"Territorial","q":"A, residing in Delhi, assaults B in Kolkata. B may sue A for damages in:","o":["Only Kolkata, where the wrong was done","Only Delhi, where A resides","Either Kolkata or Delhi, at B's option","Only where B resides"],"a":2,"e":"S.19: a suit for compensation for wrong done to the person or to movable property may be filed, at the plaintiff's option, either where the wrong was done or where the defendant resides, carries on business or personally works for gain."},{"id":"cpc-30","t":"Territorial","q":"A, living in Mumbai, writes and publishes in Chennai a defamatory article about B. B may sue:","o":["Only in Chennai","Only in Mumbai","In Chennai (where the wrong was done) or Mumbai (where A resides)","Only where the newspaper is printed"],"a":2,"e":"Defamation is a wrong to the person. Under S.19 the plaintiff may choose between the place where the wrong was done and the place where the defendant resides."},{"id":"cpc-31","t":"Territorial","q":"A contract is made at Pune, goods are to be delivered at Nagpur and the defendant carries on business at Mumbai. Payment is not made. The plaintiff may sue at:","o":["Pune, Nagpur or Mumbai: where the cause of action wholly or partly arose, or where the defendant carries on business","Only Mumbai","Only Pune","Only where the plaintiff lives"],"a":0,"e":"S.20: a suit may be filed where the defendant resides or carries on business, or where the cause of action wholly or in part arises. Making the contract, performance and breach are all parts of the cause of action."},{"id":"cpc-32","t":"Territorial","q":"There are three defendants: one lives in Jaipur, the others in Lucknow. The plaintiff sues all three in Jaipur. The Jaipur court may proceed:","o":["Without any condition","If the court grants leave, or the Lucknow defendants acquiesce in the suit being filed there","Only if all three consent in writing","Never"],"a":1,"e":"S.20(b): where there are several defendants and any one of them resides or carries on business within the jurisdiction, the suit may be filed there provided leave of the court is given or the other defendants acquiesce."},{"id":"cpc-33","t":"Territorial","q":"A company has its registered office in Mumbai and a branch in Pune. A customer's contract was made at and performed through the Pune branch. The customer wants to sue the company. Where does the suit lie?","o":["Only Mumbai, because that is the registered office","Pune, because the cause of action arose where the company has a subordinate office; Mumbai is not available merely because it is the principal office","Anywhere in India","Only the High Court"],"a":1,"e":"Explanation to S.20 and Patel Roadways v. Prasad Trading Co. (1991): a corporation is deemed to carry on business at its principal office, or, where the cause of action arises at a place where it has a subordinate office, at that place. In such a case the suit lies at the subordinate office, not the principal office."},{"id":"cpc-34","t":"Territorial","q":"\"Cause of action\" for the purpose of deciding where to sue means:","o":["Only the breach of contract","Every fact which the plaintiff must prove to get a judgment in his favour","The relief claimed","The defendant's defence"],"a":1,"e":"Cause of action is the bundle of facts which, if traversed, the plaintiff must prove to succeed. Under S.20(c) a suit may be filed wherever any part of that bundle of facts arose."},{"id":"cpc-35","t":"Objections","q":"The defendant did not object to the place of suing in the trial court, lost on merits, and now objects in appeal that the trial court had no territorial jurisdiction. The appellate court:","o":["Must set aside the decree","Will not entertain the objection unless it was taken in the trial court at the earliest opportunity and there has been a consequent failure of justice","Must remand the case","Must transfer the suit"],"a":1,"e":"S.21(1): no objection as to the place of suing shall be allowed by an appellate or revisional court unless (i) it was taken in the court of first instance, (ii) at the earliest possible opportunity and before settlement of issues, and (iii) there has been a consequent failure of justice. All three must co-exist."},{"id":"cpc-36","t":"Objections","q":"Which of the following objections is treated as waivable under S.21, so that it cannot be raised for the first time in appeal without showing failure of justice?","o":["Objection as to territorial (place of suing) jurisdiction","Objection as to pecuniary jurisdiction","Objection as to the local limits of the executing court","All of the above"],"a":3,"e":"S.21(1) covers place of suing; S.21(2) pecuniary limits; S.21(3) the local limits of the executing court. Sub-sections (2) and (3) were added by the 1976 amendment."},{"id":"cpc-37","t":"Objections","q":"After losing a suit, the defendant files a fresh suit to set aside the decree on the ground that the earlier suit was filed in the wrong place. The fresh suit is:","o":["Maintainable","Barred: no suit lies to set aside a decree on an objection as to the place of suing","Maintainable only in the High Court","Maintainable within three years"],"a":1,"e":"S.21A (inserted in 1976): no suit shall lie challenging the validity of a decree passed in a former suit between the same parties on any ground based on an objection as to the place of suing."},{"id":"cpc-38","t":"Objections","q":"Which jurisdictional defect can be raised at any stage, even in execution, because it cannot be waived?","o":["Territorial","Pecuniary","Lack of jurisdiction over the subject-matter","Competence of the executing court"],"a":2,"e":"S.21 applies only to territorial and pecuniary objections and the executing court. Inherent lack of subject-matter jurisdiction makes the decree a nullity and is not curable by consent or waiver."},{"id":"cpc-39","t":"Summons","q":"Why does the law require a summons to be served on the defendant before a suit proceeds?","o":["To collect court fees","To give the defendant notice of the claim so that he can defend himself (audi alteram partem)","To fix the value of the suit","To identify witnesses"],"a":1,"e":"Summons gives the defendant an opportunity to appear and answer the claim. It applies the rule of natural justice that no one should be condemned unheard."},{"id":"cpc-40","t":"Summons","q":"A suit is instituted on 1 March. By what date should the summons to the defendant ordinarily be served?","o":["Within 7 days","Within 30 days of the institution of the suit","Within 90 days","There is no time limit"],"a":1,"e":"S.27: summons may be issued to the defendant to appear and answer the claim and may be served in the manner prescribed on such day not beyond thirty days from the date of the institution of the suit."},{"id":"cpc-41","t":"Summons","q":"A party wants the bank manager to attend and produce the account records. The court issues:","o":["A summons to the defendant","A summons to a witness to give evidence or produce documents","A warrant of arrest","A commission"],"a":1,"e":"S.31 applies the provisions on service of summons to summonses to give evidence or to produce documents; Order XVI contains the detailed rules."},{"id":"cpc-42","t":"Summons","q":"A witness duly served with summons fails to attend without lawful excuse. What can the court do?","o":["Nothing","Issue a warrant for his arrest, attach and sell his property, impose a fine up to Rs 5,000, or order him to furnish security","Only dismiss the suit","Only adjourn the case"],"a":1,"e":"S.32: for default in complying with a summons, the court may issue a warrant of arrest, order attachment and sale of property, impose a fine not exceeding five thousand rupees, or order security for appearance."},{"id":"cpc-43","t":"Order V","q":"The rules dealing with the issue and service of summons on the defendant are contained in:","o":["Order V","Order VI","Order VII","Order IX"],"a":0,"e":"Order V (Rules 1-30) deals with summons: Rules 1-8 with issue of summons and Rules 9-30 with service."},{"id":"cpc-44","t":"Order V","q":"Summons is served on the defendant on 1 July. By when must he ordinarily file his written statement?","o":["Within 7 days","Within 30 days from the date of service","Within 90 days from the date of institution","At the first hearing only"],"a":1,"e":"O.V R.1(1): the summons calls on the defendant to appear and answer the claim and to file a written statement within thirty days from the date of service of summons."},{"id":"cpc-45","t":"Order V","q":"In an ordinary civil suit the defendant fails to file the written statement within 30 days. The court:","o":["Must pronounce judgment immediately","May, for reasons recorded, allow it to be filed within a further period not later than 90 days from service; even this limit is directory, not mandatory","Cannot extend time at all","May extend time indefinitely as of right"],"a":1,"e":"Proviso to O.V R.1(1) allows extension up to ninety days for reasons recorded. In Kailash v. Nanhku (2005) and Salem Advocate Bar Association v. UOI (2005), the Supreme Court held the limit is directory for ordinary suits and can be relaxed in exceptional cases."},{"id":"cpc-46","t":"Order V","q":"In a commercial suit under the Commercial Courts Act, the defendant files the written statement on the 125th day after service. The court:","o":["Must take it on record","Cannot take it on record; the 120-day outer limit is mandatory and the right to file stands forfeited","May take it on payment of costs","May take it if the plaintiff consents"],"a":1,"e":"SCG Contracts (India) v. K.S. Chamankar Infrastructure (2019): for commercial disputes, the proviso to O.V R.1 and O.VIII R.1 as amended makes 120 days the mandatory outer limit."},{"id":"cpc-47","t":"Order V","q":"The defendant is present in court when the plaint is presented and admits the plaintiff's claim. Should summons be issued to him?","o":["Yes, always","No; no summons is issued when the defendant has appeared at the presentation of the plaint and admitted the claim","Yes, but by e-mail only","Only if the plaintiff insists"],"a":1,"e":"First proviso to O.V R.1(1): no such summons shall be issued when a defendant has appeared at the presentation of the plaint and admitted the plaintiff's claim."},{"id":"cpc-48","t":"Order V","q":"In response to a summons, a defendant may appear:","o":["Only personally","Personally, or by a pleader duly instructed and able to answer all material questions, or by a pleader accompanied by a person who can answer them","Only through a relative","Only through a power-of-attorney holder"],"a":1,"e":"O.V R.1(2) permits appearance in person, by a pleader duly instructed, or by a pleader accompanied by some person able to answer all material questions relating to the suit."},{"id":"cpc-49","t":"Order V","q":"For a summons to be valid it must be:","o":["Signed by the plaintiff's advocate","Signed by the Judge or an officer appointed by him and sealed with the seal of the court","Typed on stamp paper","Published in a newspaper"],"a":1,"e":"O.V R.1(3): every summons shall be signed by the Judge or such officer as he appoints, and shall be sealed with the seal of the court."},{"id":"cpc-50","t":"Order V","q":"A defendant receives a summons without any copy of the plaint. The service is:","o":["Complete","Defective, because every summons must be accompanied by a copy of the plaint","Valid if the plaint is available on the court website","Valid if the defendant has a lawyer"],"a":1,"e":"O.V R.2: every summons shall be accompanied by a copy of the plaint, so that the defendant knows the case he must meet."},{"id":"cpc-51","t":"Order V","q":"The court wants the plaintiff herself, not merely her lawyer, to be present at the hearing. Can it order this?","o":["No, parties may never be ordered to appear personally","Yes; the court may order the defendant or the plaintiff to appear in person where it sees reason to require personal appearance","Only the defendant can be so ordered","Only with the consent of the other party"],"a":1,"e":"O.V R.3: where the court sees reason to require the personal appearance of the defendant or the plaintiff, the summons shall order him to appear in person on the day fixed."},{"id":"cpc-52","t":"Order V","q":"A defendant lives 300 miles from the court, with no railway connection. Can the court order him to appear in person?","o":["Yes, always","No; a party residing outside the court's local limits cannot be ordered to appear in person unless he lives within 50 miles (or 200 miles where rail or steamer communication covers five-sixths of the distance)","Yes, if the plaintiff pays travel costs","Only through video conference"],"a":1,"e":"O.V R.4 protects parties living far away from being compelled to appear in person; the 50-mile and 200-mile limits apply."},{"id":"cpc-53","t":"Order V","q":"When the court issues a summons, it must decide whether it is:","o":["For settlement of issues only or for final disposal of the suit","For evidence or for arguments","For admission or for denial","For costs or for judgment"],"a":0,"e":"O.V R.5: the court shall determine at the time of issuing the summons whether it shall be for the settlement of issues only or for the final disposal of the suit."},{"id":"cpc-54","t":"Order V","q":"A suit is pending before a Court of Small Causes. The summons issued must be for:","o":["Settlement of issues","Final disposal of the suit","Either, as the court chooses","Discovery of documents"],"a":1,"e":"Proviso to O.V R.5: in every suit heard by a Court of Small Causes, the summons shall be for the final disposal of the suit."},{"id":"cpc-55","t":"Order V","q":"Besides calling the defendant to appear, the summons may direct him to produce:","o":["His passport","All documents or copies thereof in his possession or power on which he intends to rely in support of his case","His income-tax returns","His witnesses' affidavits"],"a":1,"e":"O.V R.7: the summons may order the defendant to produce all documents or copies in his possession or power upon which he intends to rely."},{"id":"cpc-56","t":"Order V","q":"When the summons is for final disposal, it shall also direct the defendant to:","o":["Deposit the suit amount","Produce, on the day fixed, the witnesses on whose evidence he intends to rely","File a counter-claim","Pay the plaintiff's costs"],"a":1,"e":"O.V R.8: where the summons is for the final disposal of the suit, it shall also direct the defendant to produce on the day fixed the witnesses upon whose evidence he intends to rely."},{"id":"cpc-57","t":"Service","q":"Which of the following is a valid mode of delivering summons from the court under Order V?","o":["Registered post acknowledgment due or speed post","A courier service approved by the High Court","Fax message or electronic mail","All of the above"],"a":3,"e":"O.V R.9(3), as amended in 2002, allows service by registered post acknowledgment due, speed post, approved courier, fax message or e-mail, besides delivery through the court's proper officer."},{"id":"cpc-58","t":"Service","q":"A summons is sent by registered post to the defendant's correct address and the postman reports that the defendant refused to take it. The court:","o":["Must send it again","Shall declare that the summons has been duly served","Must issue a warrant","Must dismiss the suit"],"a":1,"e":"O.V R.9(5): where the defendant or his agent refuses to take delivery of the postal article, or the acknowledgment is lost or not received back within thirty days of a properly addressed, prepaid summons, the court shall declare the summons duly served."},{"id":"cpc-59","t":"Service","q":"A properly addressed, prepaid registered summons is sent, but the acknowledgment card never comes back. After how long can the court treat it as served?","o":["7 days","15 days","30 days from the date of issue","6 months"],"a":2,"e":"Proviso to O.V R.9(5): where the acknowledgment is lost or mislaid or not received back within thirty days of issue, the court shall declare the summons duly served."},{"id":"cpc-60","t":"Service","q":"The plaintiff asks the court to hand him the summons so that he can serve the defendant himself. This is:","o":["Not permitted","Permitted; the court may give the summons to the plaintiff for service in addition to the court's own service (\"dasti\" summons)","Permitted only in money suits","Permitted only if the defendant agrees"],"a":1,"e":"O.V R.9A: the court may, in addition to service under R.9, on the plaintiff's application permit him to serve the summons personally on the defendant."},{"id":"cpc-61","t":"Service","q":"What exactly must be delivered or tendered to the defendant to effect service?","o":["A photocopy of the plaint only","A copy of the summons signed by the Judge or his officer and sealed with the seal of the court","An oral intimation of the hearing date","A letter from the plaintiff's advocate"],"a":1,"e":"O.V R.10: service shall be made by delivering or tendering a copy of the summons signed by the Judge (or an officer appointed by him) and sealed with the seal of the court."},{"id":"cpc-62","t":"Service","q":"A suit is filed against three brothers. Summons is served on only the eldest. Is service complete on all?","o":["Yes, service on one defendant is enough","No; where there are several defendants, service must be made on each of them","Yes if they live in the same house","Yes if the eldest is the karta"],"a":1,"e":"O.V R.11: save as otherwise prescribed, where there are more defendants than one, service of the summons shall be made on each defendant."},{"id":"cpc-63","t":"Service","q":"Wherever practicable, the serving officer should serve the summons on:","o":["Any adult in the house","The defendant in person, or on an agent empowered to accept service on his behalf","The village headman","The nearest police station"],"a":1,"e":"O.V R.12 prefers personal service on the defendant; service on an agent empowered to accept service is equally sufficient."},{"id":"cpc-64","t":"Service","q":"A trader living in Kolkata runs a shop in Patna through a manager. He is sued in Patna over a transaction of that shop. Summons may be served on:","o":["Only the trader in Kolkata","The manager who personally carries on the business at Patna","Any customer of the shop","The landlord of the shop"],"a":1,"e":"O.V R.13: in a suit relating to business or work against a person not residing within the jurisdiction, service may be made on any manager or agent who, at the time of service, personally carries on that business or work within the jurisdiction."},{"id":"cpc-65","t":"Service","q":"A suit is filed against the owner of a ship over a shipping contract. The owner is abroad. For the purpose of service, who is treated as the owner's agent?","o":["The harbour master","The master of the ship","The customs officer","The ship's insurer"],"a":1,"e":"Explanation to O.V R.13: the master of a ship shall be deemed to be the agent of the owner or charterer."},{"id":"cpc-66","t":"Service","q":"In a suit about a house, the defendant cannot be found and has no agent empowered to accept service, but his caretaker manages the house. Summons may be served on:","o":["The caretaker, as the agent in charge of the property","The neighbour","The municipal corporation","No one; the suit must be dismissed"],"a":0,"e":"O.V R.14: where in a suit to obtain relief respecting immovable property service cannot be made on the defendant in person and he has no agent empowered to accept service, it may be made on any agent of the defendant in charge of the property."},{"id":"cpc-67","t":"Service","q":"The defendant is away and unlikely to be found within a reasonable time. The process server finds only the defendant's adult daughter and his domestic servant at home. He should serve the summons on:","o":["The servant","The adult daughter, as an adult member of the family residing with the defendant; a servant is not a member of the family","Either of them","Neither; he must wait for the defendant"],"a":1,"e":"O.V R.15: service may be made on any adult member of the family, whether male or female, who is residing with the defendant. The Explanation says a servant is not a member of the family."},{"id":"cpc-68","t":"Service","q":"The defendant's 15-year-old son is the only person at home. Service of summons on him is:","o":["Valid","Not valid; the family member must be an adult","Valid if the son signs","Valid if the father later approves"],"a":1,"e":"O.V R.15 requires an adult member of the family residing with the defendant. A minor cannot receive service."},{"id":"cpc-69","t":"Service","q":"After delivering the summons, the serving officer asks the recipient to sign. What is this signature for?","o":["It is the recipient's consent to the suit","It is an acknowledgment of service endorsed on the original summons","It is a bond for appearance","It is a vakalatnama"],"a":1,"e":"O.V R.16: the serving officer shall require the signature of the person to whom the copy is delivered or tendered to an acknowledgment of service endorsed on the original summons."},{"id":"cpc-70","t":"Service","q":"The defendant is at home but refuses to accept the summons or sign the acknowledgment. The process server should:","o":["Leave without serving","Affix a copy of the summons on the outer door or some conspicuous part of the house where the defendant ordinarily resides, and return the original with a report","Call the police","Publish the summons in a newspaper"],"a":1,"e":"O.V R.17: where the defendant refuses to sign the acknowledgment, or cannot be found after due and reasonable diligence, the serving officer shall affix a copy on the outer door or some other conspicuous part of the house and return the original to the court with a report of the circumstances."},{"id":"cpc-71","t":"Service","q":"The process server affixes the summons under Rule 17. What must his report state?","o":["Only the date","The circumstances, the time and manner of affixation, and the name and address of any person who identified the house and witnessed the affixation","The plaintiff's claim","The amount of court fee"],"a":1,"e":"O.V R.17 requires the return to state that the copy was affixed, the circumstances, and the name and address of the person (if any) by whom the house was identified and in whose presence the copy was affixed."},{"id":"cpc-72","t":"Service","q":"The serving officer has affixed the summons but his report is not verified by affidavit. Before treating the defendant as served, the court should:","o":["Declare the summons duly served immediately","Examine the serving officer on oath (or have him examined by another court) and then either declare the summons duly served or order fresh service","Dismiss the suit","Issue a warrant against the defendant"],"a":1,"e":"O.V R.19: where the return under R.17 is not verified by the affidavit of the serving officer, the court shall examine the serving officer on oath, make such further inquiry as it thinks fit, and then declare the summons duly served or order such service as it thinks fit."},{"id":"cpc-73","t":"Service","q":"The court is satisfied that the defendant is deliberately keeping out of the way to avoid service. What can the court order?","o":["Arrest of the defendant","Substituted service: affixing a copy of the summons in a conspicuous place in the court-house and on a conspicuous part of the house where he last resided or carried on business, or publication in a newspaper","Dismissal of the suit","Transfer of the suit"],"a":1,"e":"O.V R.20: where the court is satisfied that the defendant is keeping out of the way for the purpose of avoiding service, or that for any other reason summons cannot be served in the ordinary way, it shall order substituted service."},{"id":"cpc-74","t":"Service","q":"Substituted service by advertisement must be published in:","o":["Any newspaper anywhere in India","A daily newspaper circulating in the locality where the defendant is last known to have actually and voluntarily resided, carried on business or worked for gain","The Official Gazette only","A legal journal"],"a":1,"e":"O.V R.20(1A): the advertisement shall be in a daily newspaper circulating in the locality in which the defendant is last known to have actually and voluntarily resided, carried on business or personally worked for gain."},{"id":"cpc-75","t":"Service","q":"After substituted service is validly ordered and carried out, the defendant does not appear. Can the court proceed ex parte?","o":["No, personal service is essential","Yes; substituted service by order of the court is as effectual as personal service","Only after a second personal service","Only with the High Court's permission"],"a":1,"e":"O.V R.20(2): service substituted by order of the court shall be as effectual as if it had been made on the defendant personally. The court must, however, fix a time for appearance under R.20(3)."},{"id":"cpc-76","t":"Service","q":"The defendant lives in a district served by a different court. The summons can be sent for service to that court by:","o":["Only an officer of the issuing court","One of the issuing court's officers, by post, approved courier, fax message or e-mail","Only by hand through the plaintiff","Only through the High Court"],"a":1,"e":"O.V R.21: a summons may be sent by the court by which it is issued, whether within or without the State, either by one of its officers or by post or approved courier, fax message or e-mail, to any court having jurisdiction in the place where the defendant resides."},{"id":"cpc-77","t":"Service","q":"A mofussil court issues a summons to a defendant living within the presidency town of Kolkata. It may send the summons for service to:","o":["The Court of Small Causes at Kolkata","The Calcutta High Court","The police commissioner","The Collector"],"a":0,"e":"O.V R.22: where a summons issued by a court outside a presidency town is to be served within it, it may be sent to the Court of Small Causes within whose jurisdiction it is to be served."},{"id":"cpc-78","t":"Service","q":"The defendant is an undertrial lodged in Yerwada jail. Summons should be served:","o":["By affixing it on his house","By sending it to the officer in charge of the prison for service on the defendant","Through his co-accused","Through the Sessions Judge"],"a":1,"e":"O.V R.24: where the defendant is confined in a prison, the summons shall be delivered or sent to the officer in charge of the prison for service on the defendant."},{"id":"cpc-79","t":"Service","q":"The defendant lives in Dubai and has no agent in India. How is the summons served?","o":["It cannot be served","By addressing it to him at Dubai and sending it by post, approved courier, fax message or e-mail","Only through the Indian embassy","Only through Interpol"],"a":1,"e":"O.V R.25: where the defendant resides out of India and has no agent in India empowered to accept service, the summons shall be addressed to him at the place where he is residing and sent by post, approved courier, fax message or electronic mail."},{"id":"cpc-80","t":"Service","q":"A defendant lives in Bangladesh. Besides post, the Indian court may send the summons for service to:","o":["The Bangladesh High Court","Any court in Bangladesh (not being the High Court) having jurisdiction where the defendant resides","The UN","The Indian consulate only"],"a":1,"e":"Proviso to O.V R.25: where a defendant resides in Bangladesh or Pakistan, the summons may be sent for service to any court in that country (not being the High Court) having jurisdiction in the place where the defendant resides."},{"id":"cpc-81","t":"Service","q":"The defendant is a clerk in a government office. The court may send the summons for service to:","o":["The head of the office in which he is employed","The District Collector only","The Governor","The State Legal Services Authority"],"a":0,"e":"O.V R.27: where the defendant is a public officer (not belonging to the armed forces), or a servant of a railway company or local authority, the court may send the summons to the head of the office in which he is employed."},{"id":"cpc-82","t":"Service","q":"The defendant is a soldier posted in Ladakh. The summons should be sent to:","o":["The Ministry of Defence","His commanding officer, together with a copy to be retained by the defendant","The nearest police station","The District Judge of Leh"],"a":1,"e":"O.V R.28: where the defendant is a soldier, sailor or airman, the court shall send the summons for service to his commanding officer together with a copy to be retained by the defendant."},{"id":"cpc-83","t":"Service","q":"When a summons is sent to a prison officer, head of office or commanding officer for service, that person is bound to:","o":["Decide the case","Serve it if possible and return it under his signature with the defendant's written acknowledgment","Represent the defendant","Pay the process fee"],"a":1,"e":"O.V R.29: such a person shall be bound to serve it if possible and return it under his signature with the written acknowledgment of the defendant, which is evidence of service."},{"id":"cpc-84","t":"Service","q":"The defendant is a person of high rank entitled to special consideration. Instead of a summons the court may:","o":["Exempt him from the suit","Send him a letter signed by the Judge, which is treated in all respects as a summons","Serve his secretary only","Publish a notice"],"a":1,"e":"O.V R.30: the court may, instead of issuing a summons, send a letter signed by the Judge to a person of rank entitling him to such mark of consideration; the letter shall be treated in all respects as a summons."},{"id":"cpc-85","t":"Service","q":"In which case did the Supreme Court examine the 1999 and 2002 amendments on service of summons by courier and e-mail and uphold them?","o":["Salem Advocate Bar Association v. Union of India","Dhulabhai v. State of M.P.","Kiran Singh v. Chaman Paswan","Hakam Singh v. Gammon"],"a":0,"e":"Salem Advocate Bar Association v. Union of India (2003 and 2005) considered the amended CPC provisions including O.V R.9 and held them valid, while suggesting safeguards for courier and electronic service."},{"id":"cpc-86","t":"Service","q":"Which sequence correctly states the order in which modes of service should ordinarily be attempted?","o":["Newspaper advertisement, then affixation, then personal service","Personal service, then agent, then adult family member, then affixation on the house, then substituted service","Substituted service first, then personal service","Any order the plaintiff chooses"],"a":1,"e":"Order V proceeds from personal service (R.12), to service on agents (Rr. 12-14), to an adult family member (R.15), to affixation (R.17), and only then to substituted service (R.20) when ordinary service fails."},{"id":"cpc-87","t":"Service","q":"Which of the following is NOT a valid ground for ordering substituted service?","o":["The defendant is keeping out of the way to avoid service","Summons cannot be served in the ordinary way for any other reason","The plaintiff finds personal service inconvenient","Both (a) and (b) are valid grounds; (c) is not"],"a":3,"e":"O.V R.20 permits substituted service only where the court is satisfied that the defendant is avoiding service, or that for any other reason the summons cannot be served in the ordinary way. Mere inconvenience to the plaintiff is not enough."}]},{"key":"bnss","name":"BNSS, 2023","short":"BNSS","scope":"Sections 1 to 89","topics":["Overview","Definitions","Courts","Prosecutors","Powers","Aid","Arrest","Summons","Warrants","Proclamation","Correspondence"],"questions":[{"id":"bnss-1","t":"Overview","q":"From which date are offences investigated and tried under the BNSS instead of the CrPC?","o":["25 December 2023","26 January 2024","1 July 2024","1 April 2024"],"a":2,"e":"The BNS, BNSS and BSA received Presidential assent on 25 December 2023 and came into force on 1 July 2024. Offences committed before that date continue under the IPC and CrPC."},{"id":"bnss-2","t":"Overview","q":"Which of the following correctly describes the size of the BNSS?","o":["484 sections and 37 chapters","531 sections and 39 chapters","511 sections and 23 chapters","358 sections and 20 chapters"],"a":1,"e":"BNSS has 531 sections, 39 chapters and 2 Schedules; the CrPC had 484 sections and 37 chapters."},{"id":"bnss-3","t":"Overview","q":"The BNSS is the procedural counterpart of which substantive law?","o":["Indian Penal Code, 1860","Bharatiya Nyaya Sanhita, 2023","Bharatiya Sakshya Adhiniyam, 2023","Code of Civil Procedure, 1908"],"a":1,"e":"The BNSS (Act 46 of 2023) provides the procedure for investigation and trial of offences under the Bharatiya Nyaya Sanhita (Act 45 of 2023); the Bharatiya Sakshya Adhiniyam (Act 47 of 2023) governs evidence."},{"id":"bnss-4","t":"Overview","q":"A crime is committed in a tribal area of Assam. Which parts of the BNSS apply there?","o":["The whole Sanhita","Only Chapters IX, XI and XII, unless the State Government extends other provisions by notification","None of it","Only the arrest provisions"],"a":1,"e":"S.1(2) proviso: the provisions of the Sanhita, other than those relating to Chapters IX, XI and XII, do not apply to the State of Nagaland and to the tribal areas, but the State Government may extend them by notification."},{"id":"bnss-5","t":"Definitions","q":"Which of the following concepts was NOT defined in the CrPC but is now defined in the BNSS?","o":["Complaint","Cognizable offence","Bail, bail bond and bond","Police report"],"a":2,"e":"S.2(1)(b), (d) and (e) BNSS define bail, bail bond and bond for the first time. Audio-video electronic means and electronic communication are also newly defined."},{"id":"bnss-6","t":"Definitions","q":"Under the BNSS, \"bail\" means:","o":["Acquittal of the accused","Release of a person accused of or suspected of an offence from the custody of law on conditions, on execution of a bond or bail bond","Payment of a fine","Suspension of sentence"],"a":1,"e":"S.2(1)(b): bail is release from custody of the law upon certain conditions imposed by an officer or court on execution by such person of a bond or a bail bond."},{"id":"bnss-7","t":"Definitions","q":"An accused is released on his own personal undertaking without any sureties. He has executed a:","o":["Bail bond","Bond","Warrant","Recognisance order"],"a":1,"e":"S.2(1)(e): \"bond\" means a personal bond or an undertaking for release without sureties; S.2(1)(d): \"bail bond\" means an undertaking for release with sureties."},{"id":"bnss-8","t":"Definitions","q":"A person orally tells a Magistrate that an unknown person stole his motorcycle and asks the Magistrate to take action. In law this is:","o":["A First Information Report","A complaint","A police report","A charge"],"a":1,"e":"S.2(1)(h): complaint means any allegation made orally or in writing to a Magistrate, with a view to his taking action, that some person, whether known or unknown, has committed an offence. It does not include a police report."},{"id":"bnss-9","t":"Definitions","q":"A police officer investigates a non-cognizable offence and submits a report to the Magistrate. For procedural purposes this report is treated as:","o":["A police report","A complaint, and the officer as the complainant","A charge-sheet","Evidence"],"a":1,"e":"Explanation to S.2(1)(h): a report made by a police officer in a case which discloses, after investigation, the commission of a non-cognizable offence shall be deemed to be a complaint, and the police officer the complainant."},{"id":"bnss-10","t":"Definitions","q":"An offence punishable with imprisonment up to 3 years is tried as a:","o":["Summons-case","Warrant-case","Sessions case","Summary case only"],"a":1,"e":"S.2(1)(z): a warrant-case relates to an offence punishable with death, imprisonment for life or imprisonment for a term exceeding two years. Anything else is a summons-case (S.2(1)(x))."},{"id":"bnss-11","t":"Definitions","q":"A theft is committed. A police officer arrests the thief without going to a Magistrate for a warrant. This is lawful because theft is:","o":["A bailable offence","A cognizable offence, for which the police may arrest without warrant under the First Schedule","A non-cognizable offence","A summons-case"],"a":1,"e":"S.2(1)(g): cognizable offence means an offence for which a police officer may, in accordance with the First Schedule or any other law, arrest without warrant."},{"id":"bnss-12","t":"Definitions","q":"The proceedings by which the police collect evidence after an FIR are called:","o":["Inquiry","Investigation","Trial","Inquest"],"a":1,"e":"S.2(1)(l): investigation includes all proceedings for the collection of evidence conducted by a police officer or by any person (other than a Magistrate) authorised by a Magistrate."},{"id":"bnss-13","t":"Definitions","q":"A Magistrate examines witnesses to decide whether there is sufficient ground to proceed before framing a charge. This stage is an:","o":["Investigation","Inquiry, since it is a proceeding other than a trial conducted by a Magistrate","Appeal","Execution"],"a":1,"e":"S.2(1)(k): inquiry means every inquiry, other than a trial, conducted under this Sanhita by a Magistrate or Court."},{"id":"bnss-14","t":"Definitions","q":"The legal heir of a person murdered in a robbery wishes to be heard in the case. Under the BNSS, the heir is treated as:","o":["A stranger to the proceedings","A \"victim\", because the definition includes the guardian or legal heir of the person who suffered loss or injury","A witness only","An accused"],"a":1,"e":"S.2(1)(y): victim means a person who has suffered any loss or injury caused by reason of the act or omission of the accused person and includes the guardian or legal heir of such victim."},{"id":"bnss-15","t":"Definitions","q":"A proceeding in which evidence may be legally taken on oath is called:","o":["A judicial proceeding","An investigation","An administrative inquiry","A police inquiry"],"a":0,"e":"S.2(1)(m): judicial proceeding includes any proceeding in the course of which evidence is or may be legally taken on oath."},{"id":"bnss-16","t":"Definitions","q":"A statute refers simply to \"the Magistrate\" in connection with trying an offence, without saying which kind. Under the BNSS this reference means:","o":["An Executive Magistrate","A Judicial Magistrate of the first class (or second class, as the context requires)","The District Magistrate","Any police officer"],"a":1,"e":"S.3(1): unless the context otherwise requires, a reference to a Magistrate without qualifying words is construed as a reference to a Judicial Magistrate of the first class, or of the second class where the context so requires; matters involving executive functions go to Executive Magistrates."},{"id":"bnss-17","t":"Courts","q":"A newspaper reports that a case will be heard by a \"Metropolitan Magistrate\" in Mumbai under the BNSS. What is wrong with this?","o":["Nothing","The BNSS abolished metropolitan areas and Metropolitan Magistrates; the court would be a Judicial Magistrate of the first class","Mumbai has only Sessions Courts","Magistrates cannot hear cases"],"a":1,"e":"S.6 lists only Courts of Session, Judicial Magistrates of the first and second class, and Executive Magistrates (besides High Courts). The CrPC categories of metropolitan areas and Metropolitan Magistrates no longer exist."},{"id":"bnss-18","t":"Courts","q":"The classes of criminal courts under the BNSS, apart from High Courts and courts under other laws, are:","o":["Courts of Session, Judicial Magistrates of the first class, Judicial Magistrates of the second class and Executive Magistrates","Sessions Courts and Magistrates only","Supreme Court, High Court and District Court","Civil Judges and Magistrates"],"a":0,"e":"S.6 enumerates the four classes of criminal courts in every State."},{"id":"bnss-19","t":"Courts","q":"The State Government wants to split a large sessions division into two. It may do so:","o":["On its own","After consultation with the High Court","Only with Parliament's approval","Only on a Supreme Court direction"],"a":1,"e":"S.7(2): the State Government may, after consultation with the High Court, alter the limits or the number of sessions divisions and districts."},{"id":"bnss-20","t":"Courts","q":"Who establishes a Court of Session for a sessions division, and who appoints the Judge to preside over it?","o":["The High Court establishes it; the State Government appoints the Judge","The State Government establishes it; the High Court appoints the Judge","The Central Government does both","The Governor does both"],"a":1,"e":"S.8(1): the State Government shall establish a Court of Session for every sessions division. S.8(2): every Court of Session shall be presided over by a Judge appointed by the High Court."},{"id":"bnss-21","t":"Courts","q":"The Sessions Judge is on leave. Urgent applications in the Sessions Court may be dealt with by:","o":["The District Magistrate","An Additional Sessions Judge, or if none, the Chief Judicial Magistrate, as the High Court may direct","Any Judicial Magistrate","The Public Prosecutor"],"a":1,"e":"S.8(7): in the absence of the Sessions Judge, urgent applications may be disposed of by the Additional Sessions Judge, or if none, by the Chief Judicial Magistrate, in accordance with the High Court's directions."},{"id":"bnss-22","t":"Courts","q":"Which judicial post that existed under the CrPC does not exist under the BNSS?","o":["Additional Sessions Judge","Assistant Sessions Judge","Chief Judicial Magistrate","Special Judicial Magistrate"],"a":1,"e":"S.8 of the BNSS provides for Sessions Judges and Additional Sessions Judges only; the post of Assistant Sessions Judge has been dropped."},{"id":"bnss-23","t":"Courts","q":"New Courts of Judicial Magistrates in a district are established by:","o":["The High Court on its own","The State Government after consultation with the High Court","The District Judge","The Central Government"],"a":1,"e":"S.9(1): in every district the State Government may, after consultation with the High Court, establish as many Courts of Judicial Magistrates of the first class and second class as it may specify. The presiding officers are appointed by the High Court (S.9(2))."},{"id":"bnss-24","t":"Courts","q":"The senior-most Magistrate in a district who supervises the other Judicial Magistrates is the:","o":["District Magistrate","Chief Judicial Magistrate, appointed by the High Court","Sessions Judge","Sub-divisional Magistrate"],"a":1,"e":"S.10(1): in every district the High Court shall appoint a Judicial Magistrate of the first class to be the Chief Judicial Magistrate. The CJM is subordinate to the Sessions Judge, and other Judicial Magistrates are subordinate to the CJM (S.13)."},{"id":"bnss-25","t":"Courts","q":"A retired government officer is given the powers of a Judicial Magistrate to try particular cases. For how long can such a Special Judicial Magistrate be appointed at one time?","o":["Six months","One year","Three years","Until the age of 65"],"a":1,"e":"S.11: the High Court may confer the powers of a Judicial Magistrate on any person who holds or has held a government post, for such term not exceeding one year at a time as the High Court may direct."},{"id":"bnss-26","t":"Courts","q":"Who defines the local area within which each Judicial Magistrate in a district can exercise powers?","o":["The State Government","The Chief Judicial Magistrate, subject to the control of the High Court","The District Magistrate","The Sessions Judge alone"],"a":1,"e":"S.12(1): subject to the control of the High Court, the Chief Judicial Magistrate may define the local limits of the areas within which the Magistrates may exercise their powers."},{"id":"bnss-27","t":"Courts","q":"Executive Magistrates, including the District Magistrate, are appointed by:","o":["The High Court","The State Government","The Sessions Judge","The Chief Judicial Magistrate"],"a":1,"e":"S.14(1): in every district the State Government may appoint as many persons as it thinks fit to be Executive Magistrates and shall appoint one of them to be the District Magistrate. S.17: all Executive Magistrates are subordinate to the District Magistrate."},{"id":"bnss-28","t":"Courts","q":"For maintaining order during a festival, the State Government wants to give a police officer the powers of an Executive Magistrate. The officer must be at least of the rank of:","o":["Inspector","Deputy Superintendent of Police","Superintendent of Police","Director General of Police"],"a":2,"e":"S.15: the State Government may appoint Executive Magistrates or any police officer not below the rank of Superintendent of Police (or equivalent) as Special Executive Magistrates for particular areas or functions."},{"id":"bnss-29","t":"Prosecutors","q":"An advocate with 6 years' practice applies to be appointed Public Prosecutor for a district. Is he eligible?","o":["Yes","No; a Public Prosecutor or Additional Public Prosecutor must have practised as an advocate for at least 7 years","Yes, if recommended by the Bar Council","Yes, if he was earlier a police officer"],"a":1,"e":"S.18(7): a person is eligible to be appointed as Public Prosecutor or Additional Public Prosecutor only if he has been in practice as an advocate for not less than seven years."},{"id":"bnss-30","t":"Prosecutors","q":"For a sensitive murder trial the State wants to appoint a senior advocate as Special Public Prosecutor. The minimum practice required is:","o":["7 years","10 years","12 years","15 years"],"a":1,"e":"S.18(8): the Central or State Government may appoint, for any case or class of cases, an advocate who has been in practice for not less than ten years as a Special Public Prosecutor."},{"id":"bnss-31","t":"Prosecutors","q":"The District Magistrate prepares a panel of advocates for appointment as Public Prosecutors for the district. He must do so:","o":["Alone","In consultation with the Sessions Judge","In consultation with the Superintendent of Police","In consultation with the Bar Council"],"a":1,"e":"S.18(4): the District Magistrate shall, in consultation with the Sessions Judge, prepare a panel of names of persons fit to be appointed as Public Prosecutors or Additional Public Prosecutors for the district."},{"id":"bnss-32","t":"Prosecutors","q":"Prosecutions in the courts of Magistrates are conducted by:","o":["Public Prosecutors appointed for the High Court","Assistant Public Prosecutors appointed by the State Government","Police station officers","Private advocates only"],"a":1,"e":"S.19(1): the State Government shall appoint one or more Assistant Public Prosecutors in every district for conducting prosecutions in the Courts of Magistrates."},{"id":"bnss-33","t":"Prosecutors","q":"No Assistant Public Prosecutor is available for a case. The District Magistrate wants to appoint a Sub-Inspector who investigated that very case. This is:","o":["Permissible","Not permissible: a police officer who took part in the investigation, or who is below the rank of Inspector, cannot be appointed","Permissible with the Sessions Judge's consent","Permissible for summons-cases"],"a":1,"e":"S.19(3) proviso: where no Assistant Public Prosecutor is available, the DM may appoint any other person, but no police officer shall be eligible if he has taken any part in the investigation of the offence or is below the rank of Inspector."},{"id":"bnss-34","t":"Prosecutors","q":"Who heads the Directorate of Prosecution in a State and what is the minimum qualification?","o":["Advocate General; no minimum","Director of Prosecution; 15 years' practice as an advocate, or being or having been a Sessions Judge","Public Prosecutor; 7 years' practice","Police Commissioner; 20 years' service"],"a":1,"e":"S.20: the Directorate is headed by a Director of Prosecution. A Director or Deputy Director must have practised as an advocate for not less than fifteen years or be or have been a Sessions Judge; an Assistant Director needs seven years' practice or to have been a Magistrate of the first class."},{"id":"bnss-35","t":"Prosecutors","q":"An offence is punishable with 8 years' imprisonment. Which officer of the Directorate of Prosecution monitors the case?","o":["Director of Prosecution","Deputy Director of Prosecution (cases of 7 years or more but less than 10)","Assistant Director of Prosecution","Public Prosecutor for the High Court"],"a":1,"e":"S.20: the Director monitors cases punishable with ten years or more, life or death; the Deputy Director those punishable with seven years or more but less than ten; the Assistant Director those punishable with less than seven years."},{"id":"bnss-36","t":"Powers","q":"An offence under the Bharatiya Nyaya Sanhita may be tried by:","o":["Only the High Court","The High Court, the Court of Session, or any other court shown in the First Schedule as competent","Only Magistrates","Only Executive Magistrates"],"a":1,"e":"S.21(a): any offence under the BNS may be tried by the High Court, the Court of Session, or any other court by which such offence is shown in the First Schedule to be triable."},{"id":"bnss-37","t":"Powers","q":"A rape case under S.64 of the BNS is to be tried. The BNSS directs that, as far as practicable, it be tried by:","o":["A court presided over by a woman","The High Court only","An Executive Magistrate","The Chief Judicial Magistrate only"],"a":0,"e":"Proviso to S.21: any offence under Ss. 64 to 71 of the BNS shall be tried as far as practicable by a Court presided over by a woman."},{"id":"bnss-38","t":"Powers","q":"A Sessions Judge awards the death sentence. Before it can be executed:","o":["The President must approve","The High Court must confirm it","The Supreme Court must confirm it","Nothing further is needed"],"a":1,"e":"S.22(2): a Sessions Judge or Additional Sessions Judge may pass any sentence authorised by law, but a sentence of death is subject to confirmation by the High Court."},{"id":"bnss-39","t":"Powers","q":"A Chief Judicial Magistrate convicts an accused of an offence punishable with up to 10 years. The maximum imprisonment the CJM can award is:","o":["3 years","5 years","7 years","10 years"],"a":2,"e":"S.23(1): the Court of a CJM may pass any sentence authorised by law except death, imprisonment for life, or imprisonment for a term exceeding seven years."},{"id":"bnss-40","t":"Powers","q":"A Judicial Magistrate of the first class convicts an accused of cheating. The heaviest sentence this Magistrate can impose is:","o":["3 years' imprisonment or Rs 10,000 fine or both","3 years' imprisonment or Rs 50,000 fine or both, or community service","1 year or Rs 10,000","7 years or Rs 50,000"],"a":1,"e":"S.23(2): a Magistrate of the first class may pass a sentence of imprisonment not exceeding three years, or fine not exceeding fifty thousand rupees, or both, or community service. (The CrPC limit on fine was Rs 10,000.)"},{"id":"bnss-41","t":"Powers","q":"A Judicial Magistrate of the second class can impose at most:","o":["1 year's imprisonment or fine of Rs 10,000 or both, or community service","1 year or Rs 5,000","6 months or Rs 1,000","2 years or Rs 10,000"],"a":0,"e":"S.23(3): imprisonment for a term not exceeding one year, or fine not exceeding ten thousand rupees, or both, or community service."},{"id":"bnss-42","t":"Powers","q":"A court orders a convict to clean a public park for 30 days without pay instead of sending him to jail. This punishment is called:","o":["Probation","Community service, newly recognised by the BNSS","Solitary confinement","Fine"],"a":1,"e":"The Explanation to S.23 defines community service as work which the court may order a convict to perform as a form of punishment that benefits the community, for which he is not entitled to any remuneration."},{"id":"bnss-43","t":"Powers","q":"A Magistrate competent to award up to 3 years' imprisonment imposes a fine and directs imprisonment in default. The default imprisonment cannot exceed:","o":["3 years","1 year","9 months, i.e., one-fourth of the term the Magistrate can award as substantive sentence","6 months"],"a":2,"e":"S.24: imprisonment in default of fine shall not exceed the Magistrate's powers under S.23 and shall not exceed one-fourth of the term of imprisonme
