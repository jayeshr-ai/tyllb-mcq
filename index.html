<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body><title>TY LLB MCQ Trainer</title>
<meta name="description" content="Practice MCQs with explanations for CPC, BNSS, Labour Law II and Public International Law.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Light-only design (by choice): oxblood brand band on top, white cards on a cool off-white ground, one column max 820px. */
:root {
  color-scheme: light;
  --bg: #F4F4F2; --surface: #FFFFFF; --surface-2: #EEEDE9; --fg: #1F1B18; --muted: #6B6560; --line: #E2DFD8;
  --brand: #7A1F2B; --brand-deep: #5A1620; --brand-fg: #FFFFFF; --gold: #C9A24A; --gold-ink: #7A5A12;
  --ok: #2E6B4F; --ok-bg: #E3F1E8; --bad: #B23E2F; --bad-bg: #F8E5E1;
  --c-cpc: #2F5D8A; --c-bnss: #7A1F2B; --c-labour: #2E6B4F; --c-pil: #8A5A1C; --c-all: #3E3A44;
  --font-display: "Newsreader", "Cambria", Georgia, serif; --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --shadow: 0 1px 2px rgba(31,27,24,.06), 0 6px 20px rgba(31,27,24,.06);
}
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 2.1rem } h2 { font-size: 1.5rem } h3 { font-size: 1.15rem }
p { margin: 0 }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; transition: background .15s, border-color .15s, transform .05s; }
button:active { transform: translateY(1px) }
button:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
button:disabled { opacity: .5; cursor: default; transform: none }
.btn-primary { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); font-weight: 600; }
.btn-primary:not(:disabled):hover { background: var(--brand-deep) }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted) }
.btn-ghost:hover { background: var(--surface-2); color: var(--fg) }
.btn-light { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); color: #fff }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.eyebrow { font-size: .76rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
.band { background: linear-gradient(135deg, var(--brand-deep), var(--brand) 60%, #9A3341); color: var(--brand-fg); }
.band .wrap { padding-block: 26px 70px; }
.band h1 { color: #fff; }
.band .eyebrow { color: var(--gold) }
.band p.sub { color: rgba(255,255,255,.8); margin-top: 6px; max-width: 48ch }
.wrap { max-width: 820px; margin: 0 auto; padding-inline: 16px; }
.main { padding-block: 0 56px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: -48px; margin-bottom: 26px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1 }
.stat span { font-size: .8rem; color: var(--muted) }
@media (max-width: 520px) { .stat { padding: 12px } .stat b { font-size: 1.4rem } }
.section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 12px; gap: 10px; flex-wrap: wrap }
.subjects { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 22px; }
@media (max-width: 560px) { .subjects { grid-template-columns: 1fr } }
.subj { text-align: left; padding: 14px; display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; border-radius: 16px; border: 2px solid var(--line); min-width: 0; box-shadow: var(--shadow); }
.subj:hover { border-color: var(--muted) }
.subj[aria-pressed="true"] { border-color: var(--sc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sc) 16%, transparent), var(--shadow); }
.subj .mono { width: 52px; height: 52px; border-radius: 14px; background: var(--sc); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: .02em }
.subj .name { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; display: block }
.subj .meta { font-size: .85rem; color: var(--muted); display: block }
.subj .bar { margin-top: 8px }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); width: 0 }
.settings { display: grid; gap: 18px; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { padding: 0; margin-bottom: 8px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; max-width: 100% }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 14px; color: var(--muted); font-weight: 600 }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12) }
.seg .desc { display: block; font-weight: 400; font-size: .8rem; color: var(--muted) }
select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: inherit; max-width: 100%; }
label.toggle { display: flex; gap: 10px; align-items: center; }
label.toggle input { width: 20px; height: 20px; accent-color: var(--brand); }
.start { position: sticky; bottom: 0; padding-block: 12px env(safe-area-inset-bottom, 0px); background: linear-gradient(to top, var(--bg) 75%, transparent); margin-top: 10px; }
.start .btn-primary { width: 100%; padding: 15px; font-size: 1.08rem; border-radius: 12px; box-shadow: 0 6px 18px rgba(122,31,43,.25) }
.start .row { margin-top: 8px; justify-content: space-between }

/* quiz */
.qtop { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2 }
.qtop .wrap { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 10px; }
.qtop .count { font-weight: 600; font-variant-numeric: tabular-nums }
.qtop .time { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums }
.progress { height: 5px; background: var(--surface-2); }
.progress i { display: block; height: 100%; background: var(--brand); transition: width .25s; }
.qwrap { padding-block: 22px 56px }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center }
.tag { font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.subject { background: var(--sc); color: #fff; }
.question { font-family: var(--font-display); font-size: 1.42rem; font-weight: 500; line-height: 1.35; margin-bottom: 20px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: center; text-align: left; padding: 13px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); width: 100%; line-height: 1.4; }
.opt .k { flex: 0 0 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9rem; background: var(--surface-2); color: var(--muted); }
.opt .t { min-width: 0; flex: 1 }
.opt .mark { flex: 0 0 auto; font-weight: 700; font-size: .85rem }
.opt:not(:disabled):hover { border-color: var(--brand); background: #FFF9F9 }
.opt.selected { border-color: var(--fg); }
.opt.selected .k { background: var(--fg); color: #fff; }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.correct .k { background: var(--ok); color: #fff; } .opt.correct .mark { color: var(--ok) }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); color: #fff; } .opt.wrong .mark { color: var(--bad) }
.opt:disabled { cursor: default; opacity: 1; transform: none }
.opt:disabled:not(.correct):not(.wrong) { opacity: .55 }
.explain { margin-top: 18px; padding: 16px 18px; border-radius: 14px; background: #FBF7EC; border: 1px solid #EBDDB4; }
.explain .verdict { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px }
.explain .verdict.ok { color: var(--ok) } .explain .verdict.bad { color: var(--bad) }
.explain .lbl { font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-ink); font-weight: 700; margin-bottom: 4px }
.actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; flex-wrap: wrap; align-items: center }
.actions .btn-primary { padding: 12px 26px; border-radius: 12px }
.flag[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #1F1B18; font-weight: 600 }
.hint { font-size: .85rem; color: var(--muted); }

/* results */
.score { display: grid; grid-template-columns: 160px 1fr; gap: 24px; align-items: center; }
@media (max-width: 560px) { .score { grid-template-columns: 1fr; justify-items: center; text-align: center } .score .row { justify-content: center } }
.ring { width: 160px; height: 160px; max-width: 100% }
.ring text { fill: var(--fg); font-family: var(--font-display); font-weight: 600; }
.topics { display: grid; gap: 10px; margin-top: 14px; }
.topic { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; font-size: .95rem; }
.topic .bar { grid-column: 1 / -1 }
.review { display: grid; gap: 12px; margin-top: 14px; }
.review .card { padding: 16px 18px }
.review .q { font-family: var(--font-display); font-size: 1.12rem; margin-bottom: 8px; }
.review .ans { font-size: .95rem; margin: 2px 0; padding-left: 22px; position: relative }
.review .ans::before { position: absolute; left: 0; font-weight: 700 }
.review .ans.ok { color: var(--ok) } .review .ans.ok::before { content: "✓" }
.review .ans.bad { color: var(--bad) } .review .ans.bad::before { content: "✗" }
.review .exp { font-size: .95rem; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line) }
.empty { padding: 30px; text-align: center; color: var(--muted) }
footer.note { margin-top: 30px; font-size: .85rem; color: var(--muted); text-align: center }
@media (prefers-reduced-motion: reduce) { .progress i, button { transition: none } }
</style>

<script>
const DATA = {"subjects":[{"key":"cpc","name":"Civil Procedure Code","short":"CPC","scope":"Jurisdiction of civil courts; summons under Order V","topics":["Basics","Jurisdiction","Kinds","Pecuniary","Territorial","Objections","Summons","Order V","Service"],"questions":[{"id":"cpc-1","t":"Basics","q":"The Code of Civil Procedure, 1908 came into force on:","o":["1 January 1908","1 January 1909","1 April 1909","15 August 1908"],"a":1,"e":"The CPC was enacted on 21 March 1908 and came into force on 1 January 1909. It has 158 sections and 51 Orders in the First Schedule."},{"id":"cpc-2","t":"Basics","q":"The CPC is a:","o":["Substantive law","Procedural (adjective) law","Penal law","Constitutional law"],"a":1,"e":"The CPC regulates the procedure to be followed by civil courts. It does not create rights; it provides the machinery to enforce them."},{"id":"cpc-3","t":"Basics","q":"Which of the following is a feature of the Orders in the First Schedule of the CPC?","o":["They can be amended only by Parliament","They can be amended by High Courts under S.122","They have no legal force","They apply only to High Courts"],"a":1,"e":"S.122 empowers High Courts to make rules regulating their own procedure and that of subordinate civil courts, and to annul, alter or add to the rules in the First Schedule. The body of the Code (sections) can be amended only by the legislature."},{"id":"cpc-4","t":"Jurisdiction","q":"\"Jurisdiction\" means:","o":["The power of a court to hear and decide a case","The power to execute a decree only","The right of a party to appeal","The territory of a State"],"a":0,"e":"Jurisdiction is the authority of a court to hear and determine a matter. The term is not defined in the CPC; the meaning was explained in Official Trustee v. Sachindra Nath (1969)."},{"id":"cpc-5","t":"Jurisdiction","q":"Section 9 of the CPC deals with:","o":["Res judicata","Jurisdiction of civil courts to try all suits of civil nature unless barred","Place of suing","Stay of suit"],"a":1,"e":"S.9: \"The Courts shall (subject to the provisions herein contained) have jurisdiction to try all suits of a civil nature excepting suits of which their cognizance is either expressly or impliedly barred.\""},{"id":"cpc-6","t":"Jurisdiction","q":"Under S.9, cognizance of a civil suit may be barred:","o":["Only expressly","Only impliedly","Either expressly or impliedly","Only by the Constitution"],"a":2,"e":"S.9 uses the words \"expressly or impliedly barred\". Express bar is by statute; implied bar arises from general principles of law or where a statute provides a special remedy and forum."},{"id":"cpc-7","t":"Jurisdiction","q":"A suit in which the right to property or to an office is contested, though depending entirely on questions of religious rites, is:","o":["Not a suit of civil nature","A suit of civil nature","A criminal proceeding","Barred by S.9"],"a":1,"e":"Explanation I to S.9 says such a suit is of a civil nature notwithstanding that the right may depend entirely on the decision of questions as to religious rites or ceremonies."},{"id":"cpc-8","t":"Jurisdiction","q":"Explanation II to S.9 (added in 1976) provides that it is immaterial whether:","o":["The suit is for money","Any fees are attached to the office, or the office is attached to a particular place","The plaintiff is a Hindu","The court is a High Court"],"a":1,"e":"Explanation II makes it clear that a suit for an office is civil whether or not fees are attached to it and whether or not the office is attached to a particular place."},{"id":"cpc-9","t":"Jurisdiction","q":"Which of the following is NOT a suit of civil nature?","o":["Suit for rent","Suit for right to worship","Suit for a purely caste question","Suit for damages for breach of contract"],"a":2,"e":"Suits involving purely caste questions, purely religious rites, or mere dignity or honour are not of a civil nature. Rights to property, worship, office and contractual rights are civil."},{"id":"cpc-10","t":"Jurisdiction","q":"A suit for restitution of conjugal rights is:","o":["Not maintainable in a civil court","A suit of civil nature","A criminal matter","Barred by S.9"],"a":1,"e":"Matrimonial rights such as restitution of conjugal rights are civil rights, so the suit is of a civil nature."},{"id":"cpc-11","t":"Jurisdiction","q":"The presumption regarding jurisdiction of a civil court is that:","o":["The court has no jurisdiction unless conferred","The court has jurisdiction unless excluded","Jurisdiction depends on the defendant's consent","Jurisdiction depends on the value of the suit alone"],"a":1,"e":"The presumption is in favour of jurisdiction. Exclusion is not readily inferred; the burden is on the party who claims that jurisdiction is ousted (Secretary of State v. Mask & Co., 1940)."},{"id":"cpc-12","t":"Jurisdiction","q":"The principles regarding exclusion of jurisdiction of civil courts were laid down in:","o":["Dhulabhai v. State of M.P.","Kiran Singh v. Chaman Paswan","Salem Advocate Bar Assn. v. UOI","Kailash v. Nanhku"],"a":0,"e":"In Dhulabhai v. State of M.P. (1969), Chief Justice Hidayatullah laid down seven principles, including that finality given to a tribunal's order excludes civil courts only if the statute provides adequate remedies."},{"id":"cpc-13","t":"Jurisdiction","q":"A decree passed by a court without jurisdiction is a nullity. This was held in:","o":["Dhulabhai v. State of M.P.","Hakam Singh v. Gammon","Kiran Singh v. Chaman Paswan","Patel Roadways v. Prasad Trading"],"a":2,"e":"Kiran Singh v. Chaman Paswan (1954): a decree passed by a court without jurisdiction is a nullity and its invalidity can be set up whenever it is sought to be enforced, even in execution or collateral proceedings."},{"id":"cpc-14","t":"Jurisdiction","q":"Jurisdiction of a civil court is determined on the basis of:","o":["Averments in the plaint","Defence in the written statement","Evidence of the defendant","Final decree"],"a":0,"e":"Whether a court has jurisdiction is decided on the allegations made in the plaint, not on the defence taken in the written statement."},{"id":"cpc-15","t":"Jurisdiction","q":"Which defect of jurisdiction can NEVER be cured by consent, waiver or acquiescence?","o":["Territorial","Pecuniary","Subject-matter","None of these"],"a":2,"e":"Lack of subject-matter (inherent) jurisdiction cannot be cured. Objections to territorial and pecuniary jurisdiction are treated as waivable under S.21."},{"id":"cpc-16","t":"Jurisdiction","q":"Parties by agreement can:","o":["Confer jurisdiction on a court which has none","Oust the jurisdiction of all courts","Choose one among several courts having jurisdiction","Make a Small Causes Court try a partition suit"],"a":2,"e":"Hakam Singh v. Gammon (India) Ltd (1971): consent cannot confer jurisdiction, but where two or more courts have jurisdiction, parties may agree that only one of them shall try the dispute. Such a clause does not offend S.28 of the Contract Act."},{"id":"cpc-17","t":"Jurisdiction","q":"The distinction between lack of jurisdiction and irregular exercise of jurisdiction is that:","o":["Both make the decree void","Lack of jurisdiction makes the decree void; irregular exercise makes it only erroneous","Irregular exercise makes the decree void; lack of jurisdiction makes it erroneous","There is no distinction"],"a":1,"e":"A decree passed without jurisdiction is a nullity, whereas an error in exercising jurisdiction that exists makes the decree merely wrong and liable to be corrected in appeal or revision."},{"id":"cpc-18","t":"Kinds","q":"Which kind of jurisdiction is based on the value of the subject-matter of the suit?","o":["Territorial","Pecuniary","Original","Appellate"],"a":1,"e":"Pecuniary jurisdiction (S.6) depends on the amount or value of the subject-matter of the suit."},{"id":"cpc-19","t":"Kinds","q":"A Court of Small Causes cannot try:","o":["A suit for recovery of money","A suit for partition of immovable property","A suit for price of goods sold","A suit for rent"],"a":1,"e":"Small Causes Courts have limited subject-matter jurisdiction. Suits for partition, specific performance, injunction and those relating to immovable property are excluded."},{"id":"cpc-20","t":"Kinds","q":"Which courts have both original and appellate jurisdiction?","o":["Only the Supreme Court","District Courts and High Courts","Only Courts of Small Causes","Only Munsif Courts"],"a":1,"e":"District Courts and High Courts can try suits at first instance (original) and also hear appeals (appellate)."},{"id":"cpc-21","t":"Kinds","q":"Under S.3 of the CPC, a District Court is subordinate to:","o":["The Supreme Court","The High Court","The Court of Small Causes","The Collector"],"a":1,"e":"S.3: the District Court is subordinate to the High Court; every civil court of a grade inferior to a District Court and every Court of Small Causes is subordinate to the High Court and the District Court."},{"id":"cpc-22","t":"Pecuniary","q":"Pecuniary jurisdiction of civil courts is dealt with in:","o":["S.6","S.10","S.16","S.21A"],"a":0,"e":"S.6: nothing in the Code operates to give any court jurisdiction over suits the amount or value of which exceeds its pecuniary limits."},{"id":"cpc-23","t":"Pecuniary","q":"Every suit shall be instituted in the court of the lowest grade competent to try it. This is provided in:","o":["S.6","S.9","S.15","S.20"],"a":2,"e":"S.15 is a rule of procedure meant to avoid overcrowding of higher courts. A decree passed by a higher court is not a nullity merely because a lower court was competent."},{"id":"cpc-24","t":"Pecuniary","q":"For determining pecuniary jurisdiction, the valuation that matters is:","o":["The valuation by the defendant","The valuation in the plaint, unless deliberately over- or under-valued","The valuation by the court","The market value on the date of decree"],"a":1,"e":"The plaintiff's valuation in the plaint ordinarily determines jurisdiction. If it is arbitrary or deliberately wrong, the court may examine and correct it."},{"id":"cpc-25","t":"Territorial","q":"A suit for partition of immovable property must be filed:","o":["Where the plaintiff resides","Where the defendant resides","Where the property is situate","Anywhere in India"],"a":2,"e":"S.16(b): suits for partition of immovable property shall be instituted in the court within whose local limits the property is situate."},{"id":"cpc-26","t":"Territorial","q":"Which of the following suits is covered by S.16?","o":["Suit for recovery of immovable property with or without rent","Suit for foreclosure, sale or redemption of a mortgage of immovable property","Suit for compensation for wrong to immovable property","All of the above"],"a":3,"e":"S.16 covers clauses (a) to (f): recovery, partition, foreclosure/sale/redemption, determination of any other right or interest, compensation for wrong to immovable property, and recovery of movable property under distraint or attachment."},{"id":"cpc-27","t":"Territorial","q":"The proviso to S.16 is based on the maxim:","o":["Audi alteram partem","Equity acts in personam","Ubi jus ibi remedium","Res ipsa loquitur"],"a":1,"e":"Where the relief sought can be obtained entirely through the personal obedience of the defendant, the suit may be filed where the property is situate or where the defendant resides or carries on business. This reflects \"equity acts in personam\"."},{"id":"cpc-28","t":"Territorial","q":"A suit for specific performance of an agreement to sell immovable property with possession must be filed where the property is situate. Held in:","o":["Harshad Chiman Lal Modi v. DLF Universal","ABC Laminart v. AP Agencies","Kiran Singh v. Chaman Paswan","Official Trustee v. Sachindra Nath"],"a":0,"e":"In Harshad Chiman Lal Modi v. DLF Universal Ltd (2005), the Supreme Court held that such a suit falls under S.16(d) and the proviso did not apply, so the Delhi court had no jurisdiction over Gurgaon property."},{"id":"cpc-29","t":"Territorial","q":"Where immovable property is situate within the jurisdiction of different courts, the suit may be filed in any of those courts under:","o":["S.16","S.17","S.18","S.19"],"a":1,"e":"S.17: the suit may be instituted in any court within whose local limits any portion of the property is situate, provided the entire claim is within its pecuniary jurisdiction."},{"id":"cpc-30","t":"Territorial","q":"Where the local limits of jurisdiction of courts are uncertain, S.18 requires the court to:","o":["Transfer the suit to the High Court","Record a statement of uncertainty and proceed","Dismiss the suit","Refer the matter to the Collector"],"a":1,"e":"S.18: any one of the courts may, if satisfied there is ground for uncertainty, record a statement to that effect and proceed to try the suit; its decree then has the same effect as if the property were within its jurisdiction."},{"id":"cpc-31","t":"Territorial","q":"S.19 CPC applies to suits for compensation for wrongs to:","o":["Immovable property","Person or movable property","Reputation only","Government property"],"a":1,"e":"S.19: suits for compensation for wrong done to the person or to movable property may be filed where the wrong was done or where the defendant resides, carries on business or personally works for gain."},{"id":"cpc-32","t":"Territorial","q":"A, residing in Delhi, publishes in Kolkata statements defamatory of B. B may sue A:","o":["Only in Delhi","Only in Kolkata","Either in Delhi or in Kolkata","Only where B resides"],"a":2,"e":"This is an illustration to S.19. Defamation is a wrong to the person; the plaintiff may sue where the wrong was done (Kolkata) or where the defendant resides (Delhi)."},{"id":"cpc-33","t":"Territorial","q":"Under S.20, a suit may be instituted where:","o":["The defendant resides or carries on business","The cause of action wholly or in part arises","Both (a) and (b)","Only where the plaintiff resides"],"a":2,"e":"S.20 is the residuary section: suits may be filed where the defendant (or each defendant) resides, carries on business or personally works for gain, or where the cause of action wholly or in part arises."},{"id":"cpc-34","t":"Territorial","q":"Where there are several defendants and only one resides within the jurisdiction, the suit may be filed there:","o":["Without any condition","With the leave of the court or if the non-resident defendants acquiesce","Only if the plaintiff also resides there","Never"],"a":1,"e":"S.20(b): where any of the defendants resides within the jurisdiction, the suit may be filed there provided leave of the court is given or the other defendants acquiesce."},{"id":"cpc-35","t":"Territorial","q":"Under the Explanation to S.20, a corporation is deemed to carry on business at:","o":["The residence of its directors","Its sole or principal office in India, or where it has a subordinate office if the cause of action arises there","Any place in India","The place where the plaintiff resides"],"a":1,"e":"Patel Roadways v. Prasad Trading Co. (1991): if the cause of action arises at a place where the corporation has a subordinate office, the suit lies there, and not at the principal office merely because it is the principal office."},{"id":"cpc-36","t":"Territorial","q":"\"Cause of action\" in S.20 means:","o":["Only the breach","The bundle of facts the plaintiff must prove to obtain relief","The relief claimed","The defence"],"a":1,"e":"Cause of action is every fact which, if traversed, the plaintiff must prove in order to support his right to judgment. A suit may be filed where any part of it arises."},{"id":"cpc-37","t":"Objections","q":"An objection as to the place of suing shall be allowed by the appellate court only if:","o":["It was taken in the court of first instance at the earliest opportunity","It was taken at or before settlement of issues","There has been a consequent failure of justice","All of the above"],"a":3,"e":"S.21(1) requires all three conditions to co-exist: objection at the earliest opportunity in the trial court, at or before settlement of issues, and a consequent failure of justice."},{"id":"cpc-38","t":"Objections","q":"Sub-sections (2) and (3) of S.21, added in 1976, extend the same rule to objections regarding:","o":["Subject-matter jurisdiction","Pecuniary jurisdiction and competence of the executing court","Limitation","Court fees"],"a":1,"e":"S.21(2) applies the rule to objections as to pecuniary limits; S.21(3) to objections as to the local limits of the executing court."},{"id":"cpc-39","t":"Objections","q":"S.21A of the CPC bars:","o":["Appeal against a decree","A suit to set aside a decree on an objection as to place of suing","Revision","Execution of a decree"],"a":1,"e":"S.21A (inserted in 1976): no suit shall lie challenging the validity of a decree passed in a former suit on the ground that the former suit was filed in the wrong place."},{"id":"cpc-40","t":"Objections","q":"S.21 does NOT apply to an objection based on:","o":["Territorial jurisdiction","Pecuniary jurisdiction","Lack of jurisdiction over the subject-matter","Competence of executing court"],"a":2,"e":"S.21 covers objections to place of suing, pecuniary limits and the executing court. Inherent lack of subject-matter jurisdiction is not waivable and can be raised at any stage."},{"id":"cpc-41","t":"Summons","q":"Summons to the defendant is governed by:","o":["S.27 and Order V","S.30 and Order XI","S.31 and Order XVI","S.26 and Order IV"],"a":0,"e":"S.27 provides for issue of summons to the defendant; Order V lays down the detailed rules on issue and service of summons."},{"id":"cpc-42","t":"Summons","q":"Under S.27 CPC, summons to the defendant may be served on such day not beyond ____ from the date of institution of the suit:","o":["7 days","15 days","30 days","90 days"],"a":2,"e":"The words \"on such day not beyond thirty days from date of the institution of the suit\" were added by the 1999/2002 amendments to curb delay."},{"id":"cpc-43","t":"Summons","q":"The object of serving summons on the defendant is based on the principle of:","o":["Res judicata","Audi alteram partem","Nemo judex in causa sua","Stare decisis"],"a":1,"e":"Summons gives the defendant notice of the claim so that he may defend himself. This is the natural-justice rule that no one shall be condemned unheard."},{"id":"cpc-44","t":"Summons","q":"Summons to a witness is dealt with in:","o":["S.27","S.30","S.31","S.32"],"a":2,"e":"S.31: the provisions in Ss. 27, 28 and 29 apply to summonses to give evidence or produce documents. Order XVI contains the detailed rules."},{"id":"cpc-45","t":"Summons","q":"Under S.32, for default in obeying a summons, the court may impose a fine not exceeding:","o":["Rs 500","Rs 1,000","Rs 5,000","Rs 10,000"],"a":2,"e":"S.32 allows the court to issue a warrant of arrest, attach and sell property, impose a fine not exceeding five thousand rupees, or order security for appearance."},{"id":"cpc-46","t":"Order V","q":"Order V of the CPC deals with:","o":["Pleadings","Plaint","Issue and service of summons","Written statement"],"a":2,"e":"Order V, Rules 1 to 30, deals with issue of summons (Rr. 1-8) and service of summons (Rr. 9-30)."},{"id":"cpc-47","t":"Order V","q":"Under O.V R.1, the defendant must file the written statement within ____ from the date of service of summons:","o":["15 days","30 days","60 days","120 days"],"a":1,"e":"O.V R.1(1): summons is issued to the defendant to appear, answer the claim and file a written statement within thirty days from the date of service."},{"id":"cpc-48","t":"Order V","q":"In an ordinary suit, the court may extend the time for filing the written statement up to a maximum of:","o":["45 days","60 days","90 days from the date of service","180 days"],"a":2,"e":"Proviso to O.V R.1(1): for reasons recorded in writing, the court may allow filing on a later day not later than ninety days from service. For ordinary suits this limit is directory (Kailash v. Nanhku, 2005)."},{"id":"cpc-49","t":"Order V","q":"In a commercial suit under the Commercial Courts Act, the outer limit of 120 days for filing a written statement is:","o":["Directory","Mandatory","Extendable by the High Court","Not applicable"],"a":1,"e":"SCG Contracts (India) v. K.S. Chamankar Infrastructure (2019): for commercial disputes the 120-day limit is mandatory and the right to file a written statement is forfeited thereafter."},{"id":"cpc-50","t":"Order V","q":"Summons need not be issued to the defendant when:","o":["The defendant resides abroad","The defendant has appeared at the presentation of the plaint and admitted the claim","The suit is for money","The plaintiff waives it"],"a":1,"e":"First proviso to O.V R.1(1): no summons is issued when the defendant has appeared at the presentation of the plaint and admitted the plaintiff's claim."},{"id":"cpc-51","t":"Order V","q":"Under O.V R.1(2), the defendant may appear:","o":["In person only","By a pleader duly instructed and able to answer all material questions","By a pleader accompanied by a person able to answer such questions","Any of the above"],"a":3,"e":"O.V R.1(2) permits appearance in person, by a pleader duly instructed, or by a pleader accompanied by some person able to answer all material questions."},{"id":"cpc-52","t":"Order V","q":"Every summons shall be:","o":["Signed by the plaintiff","Signed by the Judge or officer appointed by him and sealed with the seal of the court","Signed by the advocate","Only sealed"],"a":1,"e":"O.V R.1(3): every summons shall be signed by the Judge or such officer as he appoints and shall be sealed with the seal of the court."},{"id":"cpc-53","t":"Order V","q":"Every summons shall be accompanied by:","o":["A copy of the plaint","A copy of the written statement","An affidavit","A vakalatnama"],"a":0,"e":"O.V R.2: every summons shall be accompanied by a copy of the plaint, so that the defendant knows the case he has to meet."},{"id":"cpc-54","t":"Order V","q":"Under O.V R.3, the court may order:","o":["The defendant to appear in person","The plaintiff to appear in person","Either the defendant or the plaintiff to appear in person","Only witnesses to appear"],"a":2,"e":"O.V R.3: where the court sees reason to require the personal appearance of the defendant or the plaintiff, the summons shall order that person to appear in person."},{"id":"cpc-55","t":"Order V","q":"Under O.V R.4, a party residing outside the court's local limits cannot ordinarily be ordered to appear in person unless he resides within:","o":["50 miles (200 miles where rail/steamer communication exists)","10 miles","100 miles","500 miles"],"a":0,"e":"O.V R.4: no party shall be ordered to appear in person unless he resides within the court's ordinary original jurisdiction, or at a place less than fifty miles away, or less than two hundred miles where there is railway, steamer or other established public conveyance for five-sixths of the distance."},{"id":"cpc-56","t":"Order V","q":"Summons under O.V R.5 shall be either:","o":["For settlement of issues or for final disposal","For evidence or for arguments","For admission or denial","For interim relief or final relief"],"a":0,"e":"O.V R.5: the court shall determine whether the summons is for settlement of issues only or for final disposal of the suit."},{"id":"cpc-57","t":"Order V","q":"In a suit heard by a Court of Small Causes, the summons shall be for:","o":["Settlement of issues","Final disposal","Either of the two","Filing of documents"],"a":1,"e":"Proviso to O.V R.5: in every suit heard by a Court of Small Causes, the summons shall be for the final disposal of the suit."},{"id":"cpc-58","t":"Order V","q":"Under O.V R.7, the summons may order the defendant to produce:","o":["His witnesses","All documents or copies in his possession on which he intends to rely","His bank statements","His passport"],"a":1,"e":"O.V R.7: the summons may order the defendant to produce all documents or copies in his possession or power upon which he intends to rely in support of his case."},{"id":"cpc-59","t":"Order V","q":"Where the summons is for final disposal, O.V R.8 directs the defendant to:","o":["Produce his witnesses on the day fixed","File written statement within 7 days","Deposit costs","Appear through counsel only"],"a":0,"e":"O.V R.8: where the summons is for the final disposal of the suit, it shall also direct the defendant to produce, on the day fixed, the witnesses on whose evidence he intends to rely."},{"id":"cpc-60","t":"Service","q":"Under O.V R.9, summons may be served by:","o":["Registered post acknowledgment due","Courier service approved by the High Court","Fax message or e-mail","All of the above"],"a":3,"e":"O.V R.9(3) (as amended in 2002) permits service by registered post acknowledgment due, speed post, approved courier, fax message or electronic mail, in addition to service by the proper officer."},{"id":"cpc-61","t":"Service","q":"Under O.V R.9, where the defendant or his agent refuses to take delivery of the postal article, the court shall:","o":["Order fresh service","Declare that the summons was duly served","Dismiss the suit","Issue a warrant"],"a":1,"e":"O.V R.9(5): where the defendant refuses delivery, or the acknowledgment is lost or not received back within thirty days of issue of a properly addressed and prepaid summons, the court shall declare the summons duly served."},{"id":"cpc-62","t":"Service","q":"Under O.V R.9(5), where the acknowledgment of a properly addressed, prepaid RPAD summons is not received back within ____ of issue, the court shall declare it duly served:","o":["7 days","15 days","30 days","60 days"],"a":2,"e":"The proviso to O.V R.9(5) fixes thirty days from the date of issue of the summons."},{"id":"cpc-63","t":"Service","q":"\"Dasti\" summons, i.e., summons given to the plaintiff for service, is provided under:","o":["O.V R.9","O.V R.9A","O.V R.17","O.V R.20"],"a":1,"e":"O.V R.9A: the court may, in addition to service under R.9, permit the plaintiff to serve the summons on the defendant himself (\"dasti\" service)."},{"id":"cpc-64","t":"Service","q":"The mode of service under O.V R.10 is:","o":["Oral intimation","Delivering or tendering a copy of the summons signed by the Judge or officer and sealed with the court seal","Telephone call","Publication in the Gazette"],"a":1,"e":"O.V R.10: service shall be made by delivering or tendering a copy of the summons signed by the Judge (or his officer) and sealed with the seal of the court."},{"id":"cpc-65","t":"Service","q":"Where there are several defendants, O.V R.11 requires:","o":["Service on any one of them","Service on each defendant","Service on the first defendant only","Service through the plaintiff"],"a":1,"e":"O.V R.11: save as otherwise prescribed, where there are more defendants than one, service of the summons shall be made on each defendant."},{"id":"cpc-66","t":"Service","q":"Under O.V R.12, service should, wherever practicable, be made:","o":["On the defendant in person, or on an agent empowered to accept service","On any neighbour","On the village headman","By newspaper publication"],"a":0,"e":"O.V R.12 prefers personal service on the defendant himself; where he has an agent empowered to accept service, service on the agent is sufficient."},{"id":"cpc-67","t":"Service","q":"In a suit relating to business against a person not residing within jurisdiction, O.V R.13 permits service on:","o":["Any customer","The manager or agent who personally carries on the business within the jurisdiction","The bank","The landlord"],"a":1,"e":"O.V R.13: service may be made on any manager or agent who, at the time of service, personally carries on such business or work within the local limits. The master of a ship is deemed agent of the owner or charterer."},{"id":"cpc-68","t":"Service","q":"Under O.V R.13, the master of a ship is deemed to be the agent of:","o":["The port authority","The owner or charterer","The crew","The insurer"],"a":1,"e":"O.V R.13 Explanation: for the purpose of this rule, the master of a ship shall be deemed to be the agent of the owner or charterer."},{"id":"cpc-69","t":"Service","q":"In suits relating to immovable property, where the defendant cannot be found and has no agent, service may be made under O.V R.14 on:","o":["Any agent of the defendant in charge of the property","The tenant","The Tehsildar","The purchaser"],"a":0,"e":"O.V R.14: service may be made on any agent of the defendant in charge of the property, when personal service is not possible and there is no agent empowered to accept service."},{"id":"cpc-70","t":"Service","q":"Where the defendant is absent and has no agent, summons may be served on:","o":["His servant","Any adult member of his family residing with him","His neighbour","His minor son"],"a":1,"e":"O.V R.15: service may be made on any adult member of the family, whether male or female, who is residing with him. The Explanation says a servant is not a member of the family."},{"id":"cpc-71","t":"Service","q":"Under O.V R.16, the person on whom summons is served must:","o":["Pay the process fee","Sign an acknowledgement of service on the original summons","Give a bond","File a written statement immediately"],"a":1,"e":"O.V R.16: the serving officer shall require the signature of the person to whom the copy is delivered or tendered to an acknowledgment of service endorsed on the original summons."},{"id":"cpc-72","t":"Service","q":"Where the defendant refuses to accept the summons, the serving officer shall:","o":["Return the summons unserved","Affix a copy on the outer door or conspicuous part of his house","Arrest the defendant","Publish it in a newspaper"],"a":1,"e":"O.V R.17: if the defendant refuses to sign the acknowledgment or cannot be found after due diligence, the serving officer shall affix a copy on the outer door or some other conspicuous part of the house where the defendant ordinarily resides or carries on business, and return the original with a report."},{"id":"cpc-73","t":"Service","q":"The report of the serving officer under O.V R.17 must state:","o":["The time and manner of affixation and the name of the person who identified the house","Only the date","The advocate's name","The amount of court fee"],"a":0,"e":"O.V R.17: the serving officer shall return the original with a report endorsed thereon stating that he has so affixed the copy, the circumstances, and the name and address of the person (if any) by whom the house was identified and in whose presence the copy was affixed."},{"id":"cpc-74","t":"Service","q":"Under O.V R.18, the serving officer must endorse on the original summons:","o":["The time when and manner in which the summons was served, and the name of the person identifying the defendant","The amount of fee paid","The verdict","The plaintiff's address"],"a":0,"e":"O.V R.18 requires an endorsement or annexed return stating the time and manner of service and the name and address of the person (if any) identifying the person served and witnessing delivery."},{"id":"cpc-75","t":"Service","q":"Under O.V R.19, if the return under R.17 is not verified by the affidavit of the serving officer, the court:","o":["Shall declare the summons duly served","Shall examine the serving officer on oath, or cause him to be examined","Shall dismiss the suit","Shall order newspaper publication"],"a":1,"e":"O.V R.19: where the return is not verified by affidavit, the court shall examine the serving officer on oath (or cause him to be examined by another court) and then declare the summons duly served or order fresh service."},{"id":"cpc-76","t":"Service","q":"Substituted service of summons is provided under:","o":["O.V R.15","O.V R.17","O.V R.20","O.V R.24"],"a":2,"e":"O.V R.20 provides for substituted service where the court is satisfied that the defendant is keeping out of the way to avoid service, or that for any other reason the summons cannot be served in the ordinary way."},{"id":"cpc-77","t":"Service","q":"Substituted service under O.V R.20 is ordered by affixing a copy of the summons:","o":["Only on the court notice board","In a conspicuous place in the court-house and on a conspicuous part of the house where the defendant last resided or carried on business","Only on the defendant's vehicle","At the police station"],"a":1,"e":"O.V R.20(1): the court shall order service by affixing a copy in some conspicuous place in the court-house and also upon some conspicuous part of the house in which the defendant is known to have last resided, carried on business or personally worked for gain, or in such other manner as the court thinks fit."},{"id":"cpc-78","t":"Service","q":"Under O.V R.20(1A), substituted service by newspaper advertisement must be in:","o":["Any national newspaper","A daily newspaper circulating in the locality where the defendant is last known to have actually and voluntarily resided","The Official Gazette","A legal journal"],"a":1,"e":"O.V R.20(1A): where the court orders service by advertisement, it shall be in a daily newspaper circulating in the locality in which the defendant is last known to have actually and voluntarily resided, carried on business or personally worked for gain."},{"id":"cpc-79","t":"Service","q":"Substituted service under O.V R.20 is:","o":["Not a valid service","As effectual as if made on the defendant personally","Valid only with plaintiff's consent","Valid only in money suits"],"a":1,"e":"O.V R.20(2): service substituted by order of the court shall be as effectual as if it had been made on the defendant personally."},{"id":"cpc-80","t":"Service","q":"When substituted service is ordered, O.V R.20(3) requires the court to:","o":["Fix a time for the appearance of the defendant","Dismiss the suit if defendant fails to appear","Close the case","Pass a decree immediately"],"a":0,"e":"O.V R.20(3): where service is substituted by order of the court, the court shall fix such time for the appearance of the defendant as the case may require."},{"id":"cpc-81","t":"Service","q":"Where the defendant resides within the jurisdiction of another court, O.V R.21 provides that the summons may be:","o":["Returned unserved","Sent to that court for service, by officer, post, courier, fax or e-mail","Served only through the High Court","Served only on the advocate"],"a":1,"e":"O.V R.21: summons may be sent by the issuing court to the court within whose jurisdiction the defendant resides, by one of its officers, by post, approved courier, fax message or e-mail."},{"id":"cpc-82","t":"Service","q":"Under O.V R.22, a summons issued by a court outside a presidency town, for service within the presidency town, is sent to:","o":["The Court of Small Causes","The High Court","The Police Commissioner","The Collector"],"a":0,"e":"O.V R.22: such a summons may be sent to the Court of Small Causes within whose jurisdiction it is to be served."},{"id":"cpc-83","t":"Service","q":"Summons to a defendant confined in prison is served through:","o":["The police station","The officer in charge of the prison","The District Magistrate","His advocate"],"a":1,"e":"O.V R.24: where the defendant is confined in a prison, the summons shall be delivered or sent to the officer in charge of the prison for service on the defendant."},{"id":"cpc-84","t":"Service","q":"Under O.V R.25, where the defendant resides out of India and has no agent in India, the summons:","o":["Cannot be served","Shall be addressed to him at the place where he resides and sent by post, courier, fax or e-mail","Must be served through the Supreme Court","Must be served through Interpol"],"a":1,"e":"O.V R.25: the summons shall be addressed to the defendant at the place where he is residing and sent by post, approved courier, fax message or electronic mail. For Bangladesh or Pakistan it may be sent to any court in that country (not being the High Court) for service."},{"id":"cpc-85","t":"Service","q":"Summons to a civil public officer may be sent to:","o":["The head of the office in which he is employed","The Collector","The Governor","The State Government"],"a":0,"e":"O.V R.27: where the defendant is a public officer (not belonging to the armed forces), or a servant of a railway company or local authority, the court may send the summons to the head of the office in which he is employed."},{"id":"cpc-86","t":"Service","q":"Summons to a soldier, sailor or airman is sent for service to:","o":["The Ministry of Defence","His commanding officer","The District Judge","The nearest police station"],"a":1,"e":"O.V R.28: the court shall send the summons for service to his commanding officer together with a copy to be retained by the defendant."},{"id":"cpc-87","t":"Service","q":"Under O.V R.29, a person to whom summons is sent for service under Rr. 24, 27 and 28 is bound to:","o":["Serve it and return it with his signature and a written acknowledgment","Decide the suit","Appear in court on behalf of the defendant","Pay the process fee"],"a":0,"e":"O.V R.29: such person shall be bound to serve the summons if possible and return it under his signature with the written acknowledgment of the defendant, which is evidence of service."},{"id":"cpc-88","t":"Service","q":"Under O.V R.30, the court may substitute a letter for a summons where:","o":["The defendant is a minor","The defendant is of a rank entitling him to such a mark of consideration","The suit is for less than Rs 1,000","The plaintiff requests it"],"a":1,"e":"O.V R.30: the court may, instead of issuing a summons, send a letter signed by the Judge to a person of rank entitling him to such mark of consideration; the letter is treated as a summons for all purposes."},{"id":"cpc-89","t":"Service","q":"Which rules of Order V stand omitted or repealed?","o":["Rules 1 and 2","Rules 19A and 20A","Rules 9 and 9A","Rules 24 and 25"],"a":1,"e":"Rule 19A (simultaneous service by post) was omitted by the 1999 amendment, and Rule 20A (service by post) was repealed, since R.9 now covers postal and electronic service."},{"id":"cpc-90","t":"Service","q":"The Supreme Court upheld the validity of the 1999 and 2002 amendments relating to service of summons by courier and e-mail in:","o":["Salem Advocate Bar Association v. Union of India","Dhulabhai v. State of M.P.","Kiran Singh v. Chaman Paswan","Hakam Singh v. Gammon"],"a":0,"e":"Salem Advocate Bar Association v. Union of India (2003 and 2005) considered the amended provisions, including O.V R.9, and held them valid while suggesting safeguards."},{"id":"cpc-91","t":"Service","q":"The correct order of preference for service of summons is:","o":["Substituted service, then personal service","Personal service, then agent, then adult family member, then affixation, then substituted service","Newspaper, then affixation, then personal","Any order at the plaintiff's choice"],"a":1,"e":"Order V proceeds from personal service (R.12), to agents (Rr. 12-14), to an adult family member (R.15), to affixation (R.17), and only then to substituted service (R.20) when the ordinary modes fail."}]},{"key":"bnss","name":"BNSS, 2023","short":"BNSS","scope":"Sections 1 to 89","topics":["Overview","Definitions","Courts","Prosecutors","Powers","Aid","Arrest","Summons","Warrants","Proclamation","Correspondence"],"questions":[{"id":"bnss-1","t":"Overview","q":"The BNSS, 2023 came into force on:","o":["25 December 2023","26 January 2024","1 July 2024","1 April 2024"],"a":2,"e":"The three new criminal laws (BNS, BNSS and BSA) received Presidential assent on 25 December 2023 and came into force on 1 July 2024."},{"id":"bnss-2","t":"Overview","q":"The BNSS contains:","o":["484 sections and 37 chapters","531 sections and 39 chapters","511 sections and 23 chapters","358 sections and 20 chapters"],"a":1,"e":"BNSS has 531 sections, 39 chapters and 2 Schedules. The CrPC, 1973 had 484 sections and 37 chapters."},{"id":"bnss-3","t":"Overview","q":"The BNSS replaced:","o":["Indian Penal Code, 1860","Indian Evidence Act, 1872","Code of Criminal Procedure, 1973","Code of Civil Procedure, 1908"],"a":2,"e":"BNSS replaces the CrPC, 1973. The IPC was replaced by the Bharatiya Nyaya Sanhita and the Evidence Act by the Bharatiya Sakshya Adhiniyam."},{"id":"bnss-4","t":"Overview","q":"The BNSS is Act No. ____ of 2023:","o":["45","46","47","48"],"a":1,"e":"BNS is Act 45 of 2023, BNSS is Act 46 of 2023 and BSA is Act 47 of 2023."},{"id":"bnss-5","t":"Overview","q":"Provisions of the BNSS, other than Chapters IX, XI and XII, do not apply to:","o":["Jammu and Kashmir","Nagaland and tribal areas","Sikkim","Union Territories"],"a":1,"e":"S.1(2) proviso: the Sanhita (except Chapters IX, XI and XII) does not apply to the State of Nagaland and to the tribal areas, though the State Government may extend it by notification."},{"id":"bnss-6","t":"Definitions","q":"Definitions under the BNSS are contained in:","o":["S.1","S.2","S.3","S.6"],"a":1,"e":"S.2(1) contains the definitions in clauses (a) to (z); S.2(2) says words not defined but defined in the BNS have the same meaning."},{"id":"bnss-7","t":"Definitions","q":"Which of the following is a NEW definition introduced in the BNSS?","o":["Complaint","Inquiry","Audio-video electronic means","Police report"],"a":2,"e":"S.2(1)(a) defines \"audio-video electronic means\" to include video conferencing, recording of identification, search and seizure, and transmission of electronic communication. \"Bail\", \"bail bond\", \"bond\" and \"electronic communication\" are also new."},{"id":"bnss-8","t":"Definitions","q":"\"Bail\" is defined in S.2(1)(b) as:","o":["Release of a person on payment of fine","Release of a person accused of or suspected of an offence from custody on certain conditions on execution of a bond or bail bond","Acquittal of the accused","Suspension of sentence"],"a":1,"e":"The CrPC never defined bail. S.2(1)(b) BNSS defines it as release from custody of the law upon certain conditions imposed by an officer or court on execution of a bond or bail bond."},{"id":"bnss-9","t":"Definitions","q":"Under S.2(1), a \"bail bond\" means:","o":["An undertaking for release without sureties","An undertaking for release with sureties","A fine","A warrant"],"a":1,"e":"S.2(1)(d): \"bail bond\" means an undertaking for release with sureties; S.2(1)(e): \"bond\" means a personal bond or an undertaking for release without sureties."},{"id":"bnss-10","t":"Definitions","q":"\"Complaint\" under S.2(1)(h) does NOT include:","o":["An oral allegation","A written allegation","A police report","An allegation against an unknown person"],"a":2,"e":"A complaint is an allegation made orally or in writing to a Magistrate with a view to his taking action, that some person, known or unknown, has committed an offence; it does not include a police report. A report by a police officer in a non-cognizable case is, however, deemed a complaint."},{"id":"bnss-11","t":"Definitions","q":"A warrant-case means a case relating to an offence punishable with death, imprisonment for life or imprisonment for a term exceeding:","o":["One year","Two years","Three years","Seven years"],"a":1,"e":"S.2(1)(z). A summons-case (S.2(1)(x)) is any case relating to an offence that is not a warrant-case."},{"id":"bnss-12","t":"Definitions","q":"An offence for which a police officer may arrest without warrant is a:","o":["Bailable offence","Non-cognizable offence","Cognizable offence","Summons-case"],"a":2,"e":"S.2(1)(g): cognizable offence means an offence for which a police officer may, in accordance with the First Schedule or any other law, arrest without warrant."},{"id":"bnss-13","t":"Definitions","q":"\"Investigation\" under the BNSS is conducted by:","o":["A Magistrate","A police officer or any person (other than a Magistrate) authorised by a Magistrate","The Sessions Judge","The Public Prosecutor"],"a":1,"e":"S.2(1)(l): investigation includes all proceedings for collection of evidence conducted by a police officer or by any person (other than a Magistrate) who is authorised by a Magistrate."},{"id":"bnss-14","t":"Definitions","q":"\"Inquiry\" means every inquiry, other than a trial, conducted by:","o":["A police officer","A Magistrate or Court","The Public Prosecutor","The complainant"],"a":1,"e":"S.2(1)(k). Inquiry is a judicial proceeding before a Magistrate or court; investigation is by the police; trial is the final stage ending in conviction or acquittal."},{"id":"bnss-15","t":"Definitions","q":"Under S.2(1)(y), \"victim\" includes:","o":["Only the person injured","The person who has suffered loss or injury, and his guardian or legal heir","Only the complainant","Only a woman"],"a":1,"e":"Victim means a person who has suffered any loss or injury caused by the act or omission of the accused, and includes the guardian or legal heir of such victim."},{"id":"bnss-16","t":"Definitions","q":"\"Judicial proceeding\" under S.2(1)(m) includes any proceeding in which:","o":["Evidence is or may be legally taken on oath","A police officer records a statement","A fine is paid","A bond is executed"],"a":0,"e":"S.2(1)(m): judicial proceeding includes any proceeding in the course of which evidence is or may be legally taken on oath."},{"id":"bnss-17","t":"Definitions","q":"Under S.2(1)(t), a \"police report\" means a report forwarded by a police officer to a Magistrate under:","o":["S.173","S.176","S.193(3)","S.35"],"a":2,"e":"A police report is the report forwarded by a police officer to a Magistrate under S.193(3) of BNSS (corresponding to S.173(2) CrPC)."},{"id":"bnss-18","t":"Definitions","q":"Under S.3, unless the context otherwise requires, a reference to a \"Magistrate\" in relation to an area outside a metropolitan area in any law is to be construed as a reference to:","o":["An Executive Magistrate","A Judicial Magistrate of the first class","A Sessions Judge","A police officer"],"a":1,"e":"S.3(1): any reference to a Magistrate, without qualifying words, shall be construed as a reference to a Judicial Magistrate of the first class (or second class where the context so requires). References involving executive functions go to the Executive Magistrate."},{"id":"bnss-19","t":"Courts","q":"Which class of court is NOT mentioned in S.6 of the BNSS?","o":["Court of Session","Judicial Magistrate of the first class","Metropolitan Magistrate","Executive Magistrate"],"a":2,"e":"S.6 lists Courts of Session, Judicial Magistrates of the first class, Judicial Magistrates of the second class and Executive Magistrates, besides High Courts. Metropolitan areas and Metropolitan Magistrates have been abolished."},{"id":"bnss-20","t":"Courts","q":"Under S.7, every State shall be a sessions division or consist of sessions divisions, and every sessions division shall be a district or consist of districts. The State Government may alter these:","o":["On its own","After consultation with the High Court","With the approval of Parliament","On the advice of the Advocate General"],"a":1,"e":"S.7(2): the State Government may, after consultation with the High Court, alter the limits or number of such divisions and districts."},{"id":"bnss-21","t":"Courts","q":"The Court of Session is established by the ____ and its Judge is appointed by the ____:","o":["High Court; State Government","State Government; High Court","Central Government; Supreme Court","Governor; Chief Justice of India"],"a":1,"e":"S.8(1): the State Government shall establish a Court of Session for every sessions division; S.8(2): every Court of Session shall be presided over by a Judge appointed by the High Court."},{"id":"bnss-22","t":"Courts","q":"Which post under the CrPC has been dropped in the BNSS?","o":["Additional Sessions Judge","Assistant Sessions Judge","Chief Judicial Magistrate","Executive Magistrate"],"a":1,"e":"The BNSS retains Sessions Judges and Additional Sessions Judges (S.8) but does not provide for Assistant Sessions Judges."},{"id":"bnss-23","t":"Courts","q":"Courts of Judicial Magistrates are established by:","o":["The High Court","The State Government after consultation with the High Court","The Central Government","The District Magistrate"],"a":1,"e":"S.9(1): in every district the State Government may, after consultation with the High Court, establish as many Courts of Judicial Magistrates of the first and second class as it may specify."},{"id":"bnss-24","t":"Courts","q":"The Chief Judicial Magistrate is appointed by:","o":["The State Government","The Sessions Judge","The High Court","The District Magistrate"],"a":2,"e":"S.10(1): in every district, the High Court shall appoint a Judicial Magistrate of the first class to be the Chief Judicial Magistrate. The High Court may also appoint Additional CJMs and designate Sub-divisional Judicial Magistrates."},{"id":"bnss-25","t":"Courts","q":"Special Judicial Magistrates are appointed for a term not exceeding:","o":["Six months at a time","One year at a time","Two years at a time","Five years"],"a":1,"e":"S.11: the High Court may, on request of the Central or State Government, confer the powers of a Judicial Magistrate on persons holding or having held government posts, for such term not exceeding one year at a time as the High Court may direct."},{"id":"bnss-26","t":"Courts","q":"Under S.12, the local jurisdiction of Judicial Magistrates is defined by:","o":["The State Government","The Chief Judicial Magistrate, subject to the control of the High Court","The Sessions Judge","The District Magistrate"],"a":1,"e":"S.12(1): subject to the control of the High Court, the CJM may from time to time define the local limits of the areas within which the Magistrates may exercise their powers."},{"id":"bnss-27","t":"Courts","q":"Under S.13, the Chief Judicial Magistrate is subordinate to:","o":["The District Magistrate","The Sessions Judge","The High Court directly","The Executive Magistrate"],"a":1,"e":"S.13(1): every CJM shall be subordinate to the Sessions Judge; every other Judicial Magistrate shall, subject to the general control of the Sessions Judge, be subordinate to the CJM."},{"id":"bnss-28","t":"Courts","q":"Executive Magistrates are appointed by:","o":["The High Court","The State Government","The Sessions Judge","The Central Government"],"a":1,"e":"S.14(1): in every district the State Government may appoint as many persons as it thinks fit to be Executive Magistrates and shall appoint one of them to be the District Magistrate."},{"id":"bnss-29","t":"Courts","q":"Under S.15, the State Government may appoint as Special Executive Magistrate a police officer not below the rank of:","o":["Inspector","Deputy Superintendent of Police","Superintendent of Police","Sub-Inspector"],"a":2,"e":"S.15: the State Government may appoint Executive Magistrates or any police officer not below the rank of Superintendent of Police or equivalent, as Special Executive Magistrates for particular areas or functions."},{"id":"bnss-30","t":"Courts","q":"All Executive Magistrates are subordinate to:","o":["The Chief Judicial Magistrate","The District Magistrate","The Sessions Judge","The High Court"],"a":1,"e":"S.17(1): all Executive Magistrates shall be subordinate to the District Magistrate, and every Executive Magistrate (other than the SDM) exercising powers in a sub-division shall also be subordinate to the SDM."},{"id":"bnss-31","t":"Prosecutors","q":"Minimum practice as an advocate required for appointment as Public Prosecutor under S.18:","o":["5 years","7 years","10 years","15 years"],"a":1,"e":"S.18(7): a person is eligible to be appointed Public Prosecutor or Additional Public Prosecutor only if he has been in practice as an advocate for not less than seven years."},{"id":"bnss-32","t":"Prosecutors","q":"Minimum practice required for appointment as Special Public Prosecutor:","o":["7 years","10 years","12 years","15 years"],"a":1,"e":"S.18(8): the Central or State Government may appoint, for any case or class of cases, an advocate who has been in practice for not less than ten years as a Special Public Prosecutor."},{"id":"bnss-33","t":"Prosecutors","q":"The Public Prosecutor for a district is appointed by the State Government from a panel prepared by:","o":["The High Court","The District Magistrate in consultation with the Sessions Judge","The Sessions Judge alone","The Bar Council"],"a":1,"e":"S.18(4): the District Magistrate shall, in consultation with the Sessions Judge, prepare a panel of names of persons fit to be appointed as Public Prosecutors or Additional Public Prosecutors for the district."},{"id":"bnss-34","t":"Prosecutors","q":"Assistant Public Prosecutors are appointed under S.19 for conducting prosecutions in:","o":["The High Court","The Court of Session","The Courts of Magistrates","The Supreme Court"],"a":2,"e":"S.19(1): the State Government shall appoint one or more Assistant Public Prosecutors in every district for conducting prosecutions in the Courts of Magistrates."},{"id":"bnss-35","t":"Prosecutors","q":"Under S.19, a police officer is NOT eligible to be appointed as Assistant Public Prosecutor if he:","o":["Has taken part in the investigation of the offence","Is below the rank of Inspector","Either (a) or (b)","Is above 50 years of age"],"a":2,"e":"S.19(3) proviso: no police officer shall be eligible if he has taken any part in the investigation into the offence or is below the rank of Inspector."},{"id":"bnss-36","t":"Prosecutors","q":"The Directorate of Prosecution is provided under:","o":["S.18","S.19","S.20","S.21"],"a":2,"e":"S.20 provides for a Directorate of Prosecution in every State, headed by a Director of Prosecution, with Deputy and Assistant Directors, and for District Directorates."},{"id":"bnss-37","t":"Prosecutors","q":"Eligibility for Director of Prosecution under S.20 is practice as an advocate for not less than:","o":["7 years","10 years","15 years or has been a Sessions Judge","20 years"],"a":2,"e":"S.20(2): a person is eligible to be Director or Deputy Director of Prosecution if he has been in practice as an advocate for not less than fifteen years or is or has been a Sessions Judge."},{"id":"bnss-38","t":"Prosecutors","q":"Under S.20, the Director of Prosecution monitors cases in which the offence is punishable with:","o":["Less than 7 years","7 years or more but less than 10 years","10 years or more, life imprisonment or death","Fine only"],"a":2,"e":"S.20: Director: cases punishable with ten years or more, life or death; Deputy Director: seven years or more but less than ten; Assistant Director: less than seven years."},{"id":"bnss-39","t":"Powers","q":"Under S.21, offences under the BNS may be tried by:","o":["Only the High Court","The High Court, the Court of Session, or any other court shown in the First Schedule","Only Magistrates","Only Executive Magistrates"],"a":1,"e":"S.21(a): any offence under the BNS may be tried by the High Court, the Court of Session or any other court by which it is shown in the First Schedule to be triable."},{"id":"bnss-40","t":"Powers","q":"Under S.21, offences under Ss. 64 to 71 of the BNS (rape and related offences) shall be tried, as far as practicable, by:","o":["A court presided over by a woman","The High Court only","An Executive Magistrate","The Chief Judicial Magistrate only"],"a":0,"e":"Proviso to S.21: any offence under Ss. 64-71 of the BNS shall be tried as far as practicable by a Court presided over by a woman."},{"id":"bnss-41","t":"Powers","q":"A sentence of death passed by a Sessions Judge is subject to confirmation by:","o":["The Supreme Court","The High Court","The Governor","The President"],"a":1,"e":"S.22(2): a Sessions Judge or Additional Sessions Judge may pass any sentence authorised by law, but any sentence of death passed by such Judge shall be subject to confirmation by the High Court."},{"id":"bnss-42","t":"Powers","q":"Under S.22(1), a High Court may pass:","o":["Any sentence except death","Any sentence authorised by law","Only sentences up to 10 years","Only fines"],"a":1,"e":"S.22(1): a High Court may pass any sentence authorised by law."},{"id":"bnss-43","t":"Powers","q":"A Chief Judicial Magistrate may pass any sentence except death, life imprisonment or imprisonment exceeding:","o":["3 years","5 years","7 years","10 years"],"a":2,"e":"S.23(1): the Court of a CJM may pass any sentence authorised by law except a sentence of death or of imprisonment for life or of imprisonment for a term exceeding seven years."},{"id":"bnss-44","t":"Powers","q":"A Magistrate of the first class may pass a sentence of imprisonment up to ____ and fine up to ____:","o":["3 years; Rs 10,000","3 years; Rs 50,000","1 year; Rs 10,000","7 years; Rs 50,000"],"a":1,"e":"S.23(2): imprisonment not exceeding three years, or fine not exceeding fifty thousand rupees, or both, or community service. The CrPC limit on fine was Rs 10,000."},{"id":"bnss-45","t":"Powers","q":"A Magistrate of the second class may pass a sentence of imprisonment up to ____ and fine up to ____:","o":["1 year; Rs 10,000","1 year; Rs 5,000","6 months; Rs 1,000","2 years; Rs 10,000"],"a":0,"e":"S.23(3): imprisonment not exceeding one year, or fine not exceeding ten thousand rupees, or both, or community service. The CrPC limit on fine was Rs 5,000."},{"id":"bnss-46","t":"Powers","q":"Which new form of punishment can be awarded by Magistrates under S.23 of the BNSS?","o":["Forfeiture of property","Community service","Solitary confinement","Transportation"],"a":1,"e":"S.23 adds community service as a punishment Magistrates may award. The Explanation defines it as work the court may order a convict to perform as punishment that benefits the community, without remuneration."},{"id":"bnss-47","t":"Powers","q":"Imprisonment in default of fine awarded by a Magistrate shall not exceed ____ of the term he is competent to inflict:","o":["One-half","One-third","One-fourth","One-fifth"],"a":2,"e":"S.24: the term of imprisonment in default of fine shall not be in excess of the Magistrate's powers under S.23 and shall not exceed one-fourth of the term of imprisonment which the Magistrate is competent to inflict as substantive punishment."},{"id":"bnss-48","t":"Powers","q":"Under S.25, the aggregate of consecutive sentences at one trial shall not exceed:","o":["10 years","14 years","20 years","Life"],"a":2,"e":"S.25(2): in no case shall the aggregate of consecutive sentences exceed twenty years (the CrPC limit was fourteen years), nor exceed twice the amount of punishment the court is competent to inflict for a single offence."},{"id":"bnss-49","t":"Powers","q":"Under S.25, when a person is convicted of several offences at one trial, the sentences run:","o":["Always concurrently","Consecutively unless the court directs that they run concurrently","Always consecutively","As decided by the Public Prosecutor"],"a":1,"e":"S.25(1): the court may sentence him for such offences to the several punishments, which shall commence one after the expiration of the other unless the court directs that they run concurrently."},{"id":"bnss-50","t":"Powers","q":"Under S.29, the powers of a Judge or Magistrate may be exercised by:","o":["Only the same person","His successor-in-office","Only the High Court","The Public Prosecutor"],"a":1,"e":"S.29: subject to the other provisions of the Sanhita, the powers and duties of a Judge or Magistrate may be exercised or performed by his successor-in-office."},{"id":"bnss-51","t":"Aid","q":"Under S.31, the public is bound to assist a Magistrate or police officer reasonably demanding aid in:","o":["Taking or preventing the escape of a person whom they are authorised to arrest","Prevention or suppression of a breach of the peace","Prevention of injury to railway, canal, telegraph or public property","All of the above"],"a":3,"e":"S.31 lists all three situations in which every person is bound to assist a Magistrate or police officer reasonably demanding his aid."},{"id":"bnss-52","t":"Aid","q":"Under S.33, every person aware of the commission of certain specified offences is bound to give information to:","o":["The nearest Magistrate or police officer","The High Court","The District Collector","The Public Prosecutor"],"a":0,"e":"S.33(1): every person aware of the commission of, or intention to commit, the specified offences under the BNS shall forthwith give information to the nearest Magistrate or police officer."},{"id":"bnss-53","t":"Arrest","q":"When police may arrest without warrant is provided under:","o":["S.35","S.41","S.43","S.47"],"a":0,"e":"S.35 BNSS (corresponding to Ss. 41 and 41A CrPC) sets out when a police officer may arrest without an order from a Magistrate and without a warrant."},{"id":"bnss-54","t":"Arrest","q":"Under S.35(1)(b), for an offence punishable with imprisonment up to 7 years, a police officer may arrest without warrant only if:","o":["The person has a criminal record","The officer is satisfied that arrest is necessary for reasons such as preventing further offence, proper investigation, or preventing tampering with evidence, and records the reasons","The complainant demands it","The person is above 60 years"],"a":1,"e":"S.35(1)(b)(ii) lists the conditions (preventing further offence, proper investigation, preventing disappearance of or tampering with evidence, preventing inducement or threat to witnesses, ensuring presence in court); the officer must record reasons in writing. Arnesh Kumar v. State of Bihar (2014) requires this to be followed strictly."},{"id":"bnss-55","t":"Arrest","q":"Under S.35(2), a person concerned in a non-cognizable offence shall be arrested:","o":["Without warrant by any police officer","Only under a warrant or order of a Magistrate","Only by a Sub-Inspector","Never"],"a":1,"e":"S.35(2): subject to S.39, no person concerned in a non-cognizable offence or against whom a complaint has been made of such offence shall be arrested except under a warrant or order of a Magistrate."},{"id":"bnss-56","t":"Arrest","q":"The \"notice of appearance\" under S.35(3) (old S.41A CrPC) is issued when:","o":["The arrest of a person is not required under S.35(1)","The person is a proclaimed offender","The offence is punishable with death","The person is a foreigner"],"a":0,"e":"S.35(3): where arrest is not required under S.35(1), the police officer shall issue a notice directing the person to appear before him. If he complies, he shall not be arrested unless the officer records reasons."},{"id":"bnss-57","t":"Arrest","q":"Under S.35(7), prior permission of an officer not below the rank of DSP is needed to arrest, for an offence punishable with less than 3 years, a person who is infirm or above the age of:","o":["55 years","60 years","65 years","70 years"],"a":1,"e":"S.35(7) is new: no arrest shall be made without prior permission of an officer not below the rank of Deputy Superintendent of Police in case of an offence punishable with imprisonment of less than three years, where the person is infirm or above sixty years of age."},{"id":"bnss-58","t":"Arrest","q":"Under S.36, every police officer making an arrest shall:","o":["Bear an accurate, visible and clear identification of his name","Prepare a memorandum of arrest","Inform the arrested person of his right to have a relative or friend informed","All of the above"],"a":3,"e":"S.36 (old S.41B CrPC) lays down all three duties of the officer making the arrest."},{"id":"bnss-59","t":"Arrest","q":"The memorandum of arrest under S.36 shall be attested by at least ____ witness and countersigned by ____:","o":["Two; the Magistrate","One; the person arrested","One; the Public Prosecutor","Two; the person arrested"],"a":1,"e":"S.36(b): the memorandum shall be attested by at least one witness, who is a member of the family of the arrested person or a respectable member of the locality, and countersigned by the person arrested."},{"id":"bnss-60","t":"Arrest","q":"The designated police officer under S.37 shall not be below the rank of:","o":["Head Constable","Assistant Sub-Inspector","Sub-Inspector","Inspector"],"a":1,"e":"S.37(b): the State Government shall designate a police officer in every district and police station, not below the rank of Assistant Sub-Inspector, responsible for maintaining information about arrested persons and the nature of the offence."},{"id":"bnss-61","t":"Arrest","q":"Under S.37, information about arrested persons shall be displayed:","o":["Only in the police station register","In every police station and at the district headquarters, including in digital mode","Only on the website of the High Court","Only in the Gazette"],"a":1,"e":"S.37(a) and (b): a police control room is established in every district and at State level, and names and addresses of arrested persons and the nature of the offence are prominently displayed, including in digital mode."},{"id":"bnss-62","t":"Arrest","q":"The right of an arrested person to meet an advocate of his choice during interrogation is under:","o":["S.36","S.38","S.47","S.48"],"a":1,"e":"S.38 (old S.41D CrPC): when any person is arrested and interrogated by the police, he shall be entitled to meet an advocate of his choice during interrogation, though not throughout the interrogation."},{"id":"bnss-63","t":"Arrest","q":"Under S.39, a police officer may arrest a person who, in his presence, commits a non-cognizable offence if he:","o":["Refuses to give his name and residence, or gives a name believed to be false","Is a foreigner","Is drunk","Is a repeat offender"],"a":0,"e":"S.39(1): when a person accused of a non-cognizable offence committed in the presence of a police officer refuses on demand to give his name and residence, or gives one believed to be false, he may be arrested to ascertain his name and residence."},{"id":"bnss-64","t":"Arrest","q":"A person arrested under S.39 who fails to give a true name and residence within ____ shall be forwarded to the nearest Magistrate:","o":["Six hours","Twelve hours","Twenty-four hours","Forty-eight hours"],"a":2,"e":"S.39(3): if the true name and residence are not ascertained within twenty-four hours from the time of arrest, or he fails to execute a bond, he shall forthwith be forwarded to the nearest Magistrate having jurisdiction."},{"id":"bnss-65","t":"Arrest","q":"A private person may arrest a person who in his presence commits:","o":["Any offence","A bailable offence","A non-bailable and cognizable offence","A non-cognizable offence"],"a":2,"e":"S.40(1): any private person may arrest or cause to be arrested any person who in his presence commits a non-bailable and cognizable offence, or any proclaimed offender."},{"id":"bnss-66","t":"Arrest","q":"A private person who arrests someone under S.40 must hand him over to the police within:","o":["Six hours","Twelve hours","Twenty-four hours","Forty-eight hours"],"a":0,"e":"S.40(1): the private person shall, without unnecessary delay but within six hours from such arrest, make over the arrested person to a police officer or take him to the nearest police station. The six-hour limit is new in BNSS."},{"id":"bnss-67","t":"Arrest","q":"Under S.41, a Magistrate may arrest a person himself when:","o":["The offence is committed in his presence within his local jurisdiction","The accused is wealthy","The police refuse to act","The offence is bailable"],"a":0,"e":"S.41(1): when any offence is committed in the presence of a Magistrate, whether Executive or Judicial, within his local jurisdiction, he may himself arrest or order any person to arrest the offender."},{"id":"bnss-68","t":"Arrest","q":"Under S.42, a member of the Armed Forces of the Union cannot be arrested for anything done in the discharge of his official duties except:","o":["With the consent of the Central Government","With the consent of the State Government","On the orders of the High Court","With the consent of his Commanding Officer"],"a":0,"e":"S.42(1): no member of the Armed Forces of the Union shall be arrested for anything done or purported to be done by him in the discharge of his official duties except after obtaining the consent of the Central Government."},{"id":"bnss-69","t":"Arrest","q":"Under S.43(1), in making an arrest the police officer shall actually touch or confine the body
