, who may inquire (on complaint or suo motu) and direct payment of the amount","The police, who can arrest the employer","The ESI Corporation"],"a":1,"e":"S.72(1): any woman claiming that maternity benefit or any other amount has been improperly withheld, or that she has been discharged or dismissed during or on account of her absence, may make a complaint to the Inspector-cum-Facilitator, who may of his own motion or on complaint inquire into the matter and direct payment."},{"id":"labour-54","t":"S.72","q":"An employer wants to challenge the Inspector-cum-Facilitator's direction to pay. The appeal must be filed within:","o":["15 days","30 days from the date the decision is communicated","60 days","90 days"],"a":1,"e":"S.72(2): any person aggrieved by the decision of the Inspector-cum-Facilitator may, within thirty days from the date on which such decision is communicated, appeal to the prescribed authority."},{"id":"labour-55","t":"S.72","q":"No appeal is filed against the Inspector-cum-Facilitator's decision. The decision is:","o":["Void","Final","Subject to review by a civil court","Merely advisory"],"a":1,"e":"S.72(3): the decision of the prescribed authority where an appeal is preferred, or of the Inspector-cum-Facilitator where no appeal is preferred, shall be final."},{"id":"labour-56","t":"S.72","q":"The employer still does not pay after a final order. The amount can be recovered:","o":["Only by a civil suit","By the Inspector-cum-Facilitator in the prescribed manner, including as an arrear of land revenue","Only through the police","Only through the Labour Court"],"a":1,"e":"S.72(4): any amount payable under this Chapter shall be recoverable by the Inspector-cum-Facilitator in such manner as may be prescribed, which includes recovery as an arrear of land revenue."},{"id":"labour-57","t":"Cases","q":"Women engaged on daily wages (muster roll) by a municipal corporation claimed maternity benefit. The Supreme Court held:","o":["They are not entitled because they are not regular employees","They are entitled; the benefit extends to casual and daily-wage women workers (Municipal Corporation of Delhi v. Female Workers, 2000)","Only permanent employees qualify","The matter is for the Labour Court"],"a":1,"e":"Municipal Corporation of Delhi v. Female Workers (Muster Roll) (2000): relying on Articles 42 and 15(3) and the UDHR, the Court held that the Maternity Benefit Act applies to casual and daily-wage women workers."},{"id":"labour-58","t":"Cases","q":"An employer paid maternity benefit only for working days, excluding Sundays. The Supreme Court held:","o":["The employer was right","Sundays must be included; \"week\" means a cycle of seven days and the benefit is computed for all days of the period (B. Shah v. Presiding Officer, Labour Court, 1978)","Only paid holidays are included","The matter depends on the contract"],"a":1,"e":"B. Shah v. Presiding Officer, Labour Court, Coimbatore (1978): beneficial legislation must be construed liberally; maternity benefit must be paid for all seven days of each week, including Sundays and wageless holidays."},{"id":"labour-59","t":"Cases","q":"Air India's rules required air hostesses to retire on their first pregnancy. The Supreme Court in Air India v. Nergesh Meerza (1981):","o":["Upheld the rule as a reasonable safety measure","Struck it down as unreasonable, arbitrary and violative of Article 14","Referred it to the ILO","Upheld it for international flights only"],"a":1,"e":"The retirement-on-first-pregnancy rule was held to be grossly unreasonable and arbitrary, amounting to a penalty for motherhood, and was struck down under Article 14."},{"id":"labour-60","t":"Cases","q":"A woman had earlier taken child-care leave for her stepchildren and was then refused maternity leave for her first biological child. In Deepika Singh v. CAT (2022) the Supreme Court:","o":["Upheld the refusal","Granted maternity leave, holding that the earlier leave for stepchildren could not disentitle her and that atypical families deserve equal protection","Held that only biological children count","Held that stepchildren count as her own for the two-child limit"],"a":1,"e":"Deepika Singh v. Central Administrative Tribunal (2022) emphasised a purposive, beneficial interpretation of maternity provisions and recognised diverse family structures."},{"id":"labour-61","t":"Numbers","q":"Which statement about the maternity benefit period under the Code is correct?","o":["26 weeks, of which not more than 8 weeks before expected delivery","26 weeks, of which not more than 12 weeks before delivery","12 weeks, of which not more than 8 weeks before delivery","24 weeks, of which not more than 6 weeks before delivery"],"a":0,"e":"S.60(3): twenty-six weeks, of which not more than eight shall precede the expected date of delivery; for a woman with two or more surviving children, twelve weeks with not more than six before delivery."},{"id":"labour-62","t":"Numbers","q":"Match the time limits: appeal against an order depriving maternity benefit (S.68) and appeal against the Inspector-cum-Facilitator's decision (S.72) are respectively:","o":["30 days and 60 days","60 days and 30 days","30 days and 30 days","60 days and 60 days"],"a":1,"e":"S.68(3): sixty days; S.72(2): thirty days."},{"id":"labour-63","t":"Numbers","q":"Which of the following leave entitlements is wrongly stated?","o":["Miscarriage: 6 weeks","Tubectomy: 2 weeks","Illness arising out of pregnancy: up to 1 month extra","Medical termination of pregnancy: 12 weeks"],"a":3,"e":"Leave after medical termination of pregnancy is six weeks (S.65(1)), the same as for miscarriage. The other three are correct."},{"id":"labour-64","t":"Numbers","q":"A woman employee is told the following by HR. Which statement is wrong under the Code?","o":["\"You need 80 days of work in the preceding 12 months.\"","\"Not more than 8 of your 26 weeks can be taken before delivery.\"","\"You will get a medical bonus of Rs 3,500 since we provide no free care.\"","\"Nursing breaks are available until the child is 6 months old.\""],"a":3,"e":"S.66 allows two nursing breaks until the child attains the age of fifteen months, not six months. The other statements are correct (Ss. 60(2), 60(3), 64)."},{"id":"labour-65","t":"Numbers","q":"The creche requirement and the employee threshold for coverage of a shop are respectively:","o":["50 employees for a creche; 10 or more employees for coverage","20 employees for a creche; 10 for coverage","50 for both","10 for a creche; 50 for coverage"],"a":0,"e":"S.67 requires a creche where fifty employees (or the prescribed number) are employed; the First Schedule brings shops and establishments with ten or more employees within Chapter VI."}]},{"key":"pil","name":"Public International Law","short":"PIL","scope":"Units I and II","topics":["Nature","Basis","Sources","Relationship","Subjects","State","Recognition","Succession","Territory","Jurisdiction","Responsibility","Nationality","UN"],"questions":[{"id":"pil-1","t":"Nature","q":"Who gave the subject the name \"international law\", replacing the older term \"law of nations\"?","o":["Hugo Grotius","Jeremy Bentham","Oppenheim","John Austin"],"a":1,"e":"Jeremy Bentham coined \"international law\" in his Introduction to the Principles of Morals and Legislation (1780, published 1789). The Roman term was jus gentium."},{"id":"pil-2","t":"Nature","q":"Why is Hugo Grotius called the father of international law?","o":["He drafted the UN Charter","He systematised the subject in De Jure Belli ac Pacis (1625), treating it as a body of rules binding on States","He founded the ICJ","He wrote the Montevideo Convention"],"a":1,"e":"Grotius (1583-1645), a Dutch jurist, gave international law a scientific foundation in On the Law of War and Peace, based on natural law and State practice."},{"id":"pil-3","t":"Nature","q":"\"Le Droit des Gens\" (1758), which stressed the sovereign equality of States, was written by:","o":["Emmerich de Vattel","Grotius","Pufendorf","Gentili"],"a":0,"e":"Vattel's Law of Nations (1758) was highly influential in diplomatic practice of the 18th and 19th centuries."},{"id":"pil-4","t":"Nature","q":"A student argues that international law cannot be \"law\" because there is no sovereign to command it and no sanction behind it. Which jurist does this echo?","o":["Austin, who called international law \"positive morality\"","Oppenheim","Starke","Brierly"],"a":0,"e":"John Austin defined law as the command of a sovereign backed by sanction; lacking both, he treated international law as positive international morality."},{"id":"pil-5","t":"Nature","q":"Which jurist called international law \"the vanishing point of jurisprudence\"?","o":["Austin","Holland","Oppenheim","Kelsen"],"a":1,"e":"T.E. Holland used the phrase because international law lacks an arbiter and its rules rest on the consent of States; it exists at the outer edge of jurisprudence."},{"id":"pil-6","t":"Nature","q":"Which definition of international law has been criticised for describing it as rules binding on \"civilised States\" and for ignoring individuals and organisations?","o":["Oppenheim's classic definition","Starke's definition","Brierly's definition","Kelsen's definition"],"a":0,"e":"Oppenheim: \"Law of Nations or International Law is the name for the body of customary and conventional rules which are considered legally binding by civilised States in their intercourse with each other.\" Later editions dropped \"civilised\"."},{"id":"pil-7","t":"Nature","q":"The modern system of sovereign, equal States is usually dated from:","o":["The Congress of Vienna, 1815","The Peace of Westphalia, 1648","The Treaty of Versailles, 1919","The UN Charter, 1945"],"a":1,"e":"The Peace of Westphalia ended the Thirty Years' War and recognised the sovereignty and equality of States, beginning the modern international system."},{"id":"pil-8","t":"Nature","q":"An Indian citizen sues a French company in Mumbai over a contract made in Paris. Which branch of law decides which country's law applies?","o":["Public international law","Private international law (conflict of laws), which is part of municipal law","Constitutional law","Diplomatic law"],"a":1,"e":"Private international law deals with cases involving a foreign element between private parties; public international law governs relations between States and other international persons."},{"id":"pil-9","t":"Nature","q":"Which group of writers regards international law as true law, binding on States in practice despite the lack of a world legislature?","o":["Austin and Holland","Oppenheim, Starke, Brierly, Hall and Lawrence","Hobbes and Bentham","None"],"a":1,"e":"These writers point out that States habitually treat international law as binding, that it has recognised sources, and that enforcement exists through self-help, sanctions and collective action."},{"id":"pil-10","t":"Basis","q":"Grotius, Pufendorf and Vattel traced the binding force of international law to:","o":["The command of a sovereign","The law of nature, i.e., reason and the nature of man","UN resolutions","The practice of courts"],"a":1,"e":"The naturalist school holds that international law is part of natural law and binds States independently of their consent."},{"id":"pil-11","t":"Basis","q":"According to positivists like Bynkershoek and Anzilotti, why does international law bind States?","o":["Because of divine law","Because States have consented to it, expressly through treaties or tacitly through custom","Because of morality","Because the ICJ says so"],"a":1,"e":"Positivism grounds the binding force of international law in State consent; Anzilotti traced it ultimately to the norm pacta sunt servanda."},{"id":"pil-12","t":"Basis","q":"The maxim \"pacta sunt servanda\" means:","o":["Treaties may be ignored when inconvenient","Agreements must be kept; treaties bind the parties and must be performed in good faith","Custom overrides treaties","States may withdraw at will"],"a":1,"e":"Codified in Art. 26 of the Vienna Convention on the Law of Treaties, 1969. Anzilotti regarded it as the fundamental norm on which international law rests."},{"id":"pil-13","t":"Basis","q":"Jellinek explained how a sovereign State can be bound by international law by saying that the State:","o":["Is not really sovereign","Voluntarily limits its own sovereignty (auto-limitation)","Is bound by natural law","Is bound by the UN"],"a":1,"e":"The auto-limitation (self-limitation) theory of Georg Jellinek: a State is bound because it has limited its own will by consenting to the rules."},{"id":"pil-14","t":"Basis","q":"Kelsen's pure theory treats international law and municipal law as one system whose validity flows from:","o":["The will of the majority of States","A single basic norm (Grundnorm), with international law at the apex","The UN Charter","The ICJ Statute"],"a":1,"e":"Kelsen is a monist; in his hierarchy of norms, international law stands above national legal orders, all deriving validity from a Grundnorm."},{"id":"pil-15","t":"Sources","q":"A lawyer arguing before the ICJ wants to know what the Court will treat as \"law\". The authoritative list of sources is in:","o":["Article 38(1) of the Statute of the ICJ","Article 2(4) of the UN Charter","Article 51 of the UN Charter","The Montevideo Convention"],"a":0,"e":"Art. 38(1) lists international conventions, international custom, general principles of law recognised by civilised nations, and, as subsidiary means, judicial decisions and the teachings of the most highly qualified publicists."},{"id":"pil-16","t":"Sources","q":"Which of the following is treated only as a \"subsidiary means\" for determining rules of law, not as a primary source?","o":["Treaties","Custom","General principles of law","Judicial decisions and the teachings of eminent publicists"],"a":3,"e":"Art. 38(1)(d): judicial decisions and teachings are subsidiary means, subject to Art. 59 (no binding precedent)."},{"id":"pil-17","t":"Sources","q":"Two States agree to let the ICJ decide their dispute on the basis of fairness and good conscience rather than strict law. This is a decision:","o":["Ultra vires","Ex aequo et bono, permitted under Art. 38(2) if the parties agree","Under Chapter VII","By advisory opinion"],"a":1,"e":"Art. 38(2) of the Statute preserves the Court's power to decide a case ex aequo et bono if the parties agree. No contentious case has yet been decided on this basis."},{"id":"pil-18","t":"Sources","q":"For a practice of States to become customary international law, what must be shown besides a general and consistent practice?","o":["A treaty","Opinio juris: the belief that the practice is followed because it is legally required","A UN resolution","100 years of practice"],"a":1,"e":"Custom has two elements: State practice (the material element) and opinio juris sive necessitatis (the psychological element)."},{"id":"pil-19","t":"Sources","q":"Germany argued that the equidistance rule for continental-shelf delimitation had not become custom because States following it did not believe they were legally bound. The ICJ agreed in:","o":["North Sea Continental Shelf Cases (1969)","Corfu Channel Case","Chorzow Factory Case","Reparation Case"],"a":0,"e":"The ICJ stressed opinio juris and also held that passage of only a short time is not a bar to custom if State practice is extensive and virtually uniform."},{"id":"pil-20","t":"Sources","q":"Colombia claimed a right under a Latin American regional custom to grant diplomatic asylum to Haya de la Torre. The ICJ held that:","o":["Regional custom is impossible","A State relying on a regional custom must prove that it is established and binding on the other State; Colombia failed to do so","Peru must grant safe passage","Diplomatic asylum is universal custom"],"a":1,"e":"Asylum Case (Colombia v. Peru, 1950): the burden of proving a regional or special custom lies on the State invoking it."},{"id":"pil-21","t":"Sources","q":"Portugal claimed a right of passage between Daman and its enclaves through Indian territory, based on long practice between the two States. The ICJ:","o":["Rejected the claim entirely","Recognised a local custom between two States for passage of private persons and goods, but not for armed forces","Ordered India to cede the enclaves","Held that custom needs at least three States"],"a":1,"e":"Right of Passage over Indian Territory (Portugal v. India, 1960): custom can exist between only two States."},{"id":"pil-22","t":"Sources","q":"During the formation of a customary rule, Norway consistently objected to the ten-mile rule for bays. The ICJ held that the rule could not be applied against Norway. This illustrates:","o":["The persistent objector rule (Anglo-Norwegian Fisheries Case, 1951)","Jus cogens","Opinio juris","Estoppel"],"a":0,"e":"A State that persistently objects to a customary rule while it is forming is not bound by it; Norway's straight-baseline system was upheld."},{"id":"pil-23","t":"Sources","q":"A French ship collided with a Turkish ship on the high seas and Turkey prosecuted the French officer. The PCIJ held that:","o":["Turkey had no jurisdiction","Restrictions on the independence of States cannot be presumed; Turkey could prosecute because the effects were felt on a Turkish vessel (Lotus Case, 1927)","Only France could try him","The high seas belong to no one so no State can prosecute"],"a":1,"e":"S.S. Lotus (France v. Turkey, 1927): the \"Lotus principle\" that whatever is not prohibited to States is permitted. The rule on collisions was later reversed by treaty."},{"id":"pil-24","t":"Sources","q":"The US Supreme Court released Spanish coastal fishing vessels seized in war, holding that customary international law exempting such vessels is part of US law. The case is:","o":["Paquete Habana (1900)","Luther v. Sagor","Mortensen v. Peters","Tinoco Arbitration"],"a":0,"e":"The Paquete Habana (1900): \"International law is part of our law, and must be ascertained and administered by the courts.\""},{"id":"pil-25","t":"Sources","q":"Which instrument codifies the law on how treaties are made, interpreted, applied and terminated?","o":["UN Charter","Vienna Convention on the Law of Treaties, 1969 (in force 1980)","Montevideo Convention, 1933","Statute of the ICJ"],"a":1,"e":"The VCLT was adopted on 23 May 1969 and entered into force in 1980. India has not ratified it but treats most of its provisions as customary law."},{"id":"pil-26","t":"Sources","q":"Two States conclude a treaty agreeing to permit slave trading between them. The treaty is:","o":["Valid between them","Void, because it conflicts with a peremptory norm (jus cogens) from which no derogation is permitted","Voidable at the option of either","Valid if registered with the UN"],"a":1,"e":"Art. 53 VCLT: a treaty is void if it conflicts with a peremptory norm of general international law. Prohibitions of slavery, genocide, torture and aggression are accepted examples of jus cogens."},{"id":"pil-27","t":"Sources","q":"A State wants to withdraw from a treaty claiming that circumstances have fundamentally changed since it was signed. The relevant doctrine is:","o":["Pacta sunt servanda","Rebus sic stantibus (fundamental change of circumstances), narrowly allowed under Art. 62 VCLT","Uti possidetis","Opinio juris"],"a":1,"e":"Art. 62 permits termination for a fundamental change of circumstances only if the circumstances were an essential basis of consent and the change radically transforms the obligations; it never applies to boundary treaties."},{"id":"pil-28","t":"Sources","q":"Under the VCLT, a \"treaty\" is:","o":["Any agreement between States, oral or written","An international agreement concluded between States in written form and governed by international law, whatever its name","Only an agreement called a \"treaty\"","Any agreement registered with the UN"],"a":1,"e":"Art. 2(1)(a) VCLT. Conventions, protocols, covenants, charters and exchanges of notes are all treaties if they meet this definition."},{"id":"pil-29","t":"Sources","q":"The ICJ observed that some obligations, such as the prohibition of genocide and slavery, are owed to the international community as a whole, so every State has an interest in their protection. This concept of obligations erga omnes comes from:","o":["Barcelona Traction Case (1970)","Island of Palmas Case","Luther v. Sagor","Mortensen v. Peters"],"a":0,"e":"Barcelona Traction, Light and Power Co. (Belgium v. Spain, 1970): the Court distinguished obligations erga omnes from obligations owed to particular States in diplomatic protection."},{"id":"pil-30","t":"Sources","q":"Thailand had for years accepted a map showing the Preah Vihear temple in Cambodia, and later objected. The ICJ held Thailand was precluded from denying the boundary. This applied the general principle of:","o":["Estoppel (Temple of Preah Vihear Case, 1962)","Jus cogens","Opinio juris","Rebus sic stantibus"],"a":0,"e":"Temple of Preah Vihear (Cambodia v. Thailand, 1962): acquiescence and estoppel, general principles of law, bound Thailand to the map line."},{"id":"pil-31","t":"Sources","q":"Can a party in a later case before the ICJ insist that the Court is bound by its own earlier judgment?","o":["Yes, stare decisis applies","No; under Art. 59 a decision has no binding force except between the parties and in respect of that case, though the Court follows its earlier decisions in practice","Yes, if the earlier case was unanimous","Only if the Security Council agrees"],"a":1,"e":"Art. 59 of the ICJ Statute excludes binding precedent, but decisions are highly persuasive and are used as subsidiary means under Art. 38(1)(d)."},{"id":"pil-32","t":"Sources","q":"A General Assembly resolution declares certain principles of friendly relations among States. Its legal status is:","o":["Binding law for all States","Recommendatory (\"soft law\"), but it may be evidence of State practice and opinio juris and may crystallise custom","A treaty","Jus cogens automatically"],"a":1,"e":"General Assembly resolutions are not binding (except on internal matters), but the ICJ in Nicaragua v. USA (1986) used them as evidence of opinio juris."},{"id":"pil-33","t":"Sources","q":"In the Diversion of Water from the Meuse case (1937), Judge Hudson applied which source in his individual opinion?","o":["Equity, as a part of international law","Jus cogens","Regional custom","Soft law"],"a":0,"e":"Judge Manley Hudson applied principles of equity (such as \"he who seeks equity must do equity\") as general principles of law."},{"id":"pil-34","t":"Relationship","q":"A monist would say that a rule of international law:","o":["Needs a statute before a national court can apply it","Forms part of one single legal system with municipal law and applies directly, with international law supreme","Can never be applied by national courts","Is subordinate to all national laws"],"a":1,"e":"Monism (Kelsen, Wright, Duguit) treats international and municipal law as parts of one legal order; dualism (Triepel, Anzilotti) treats them as separate systems."},{"id":"pil-35","t":"Relationship","q":"Triepel and Anzilotti argued that international and municipal law are two distinct systems because they differ in:","o":["Nothing","Their sources, their subjects and their subject-matter","Only their language","Only their enforcement"],"a":1,"e":"Dualism: international law arises from the common will of States and regulates relations between States, whereas municipal law arises from the will of a State and regulates individuals; hence international law must be transformed to apply domestically."},{"id":"pil-36","t":"Relationship","q":"India ratifies a human rights treaty but passes no legislation. A litigant asks a court to apply the treaty directly. Under the transformation theory, the court should:","o":["Apply the treaty directly","Hold that the treaty becomes part of municipal law only when transformed by legislation, though it may be used to interpret existing law","Strike down the treaty","Refer the question to the ICJ"],"a":1,"e":"The transformation (specific adoption) theory requires an act of the State to make a treaty part of domestic law. Indian courts, however, read treaties into domestic law where there is no conflict (Vishaka; Gramophone Co.)."},{"id":"pil-37","t":"Relationship","q":"In English law, customary international law is automatically treated as part of the law of the land unless it conflicts with statute. This is the doctrine of:","o":["Transformation","Incorporation (Blackstone; Trendtex Trading v. Central Bank of Nigeria, 1977)","Delegation","Harmonisation"],"a":1,"e":"Under the doctrine of incorporation, customary rules are part of English law without legislation; the Trendtex case applied the modern restrictive rule of State immunity as changed custom."},{"id":"pil-38","t":"Relationship","q":"A Danish captain was convicted under a Scottish statute for trawling in the Moray Firth beyond the three-mile limit, although international law would not have allowed the prosecution. The court held:","o":["International law prevails","A clear Act of Parliament binds the court even if it conflicts with international law (Mortensen v. Peters, 1906)","The conviction was void","The matter must go to the ICJ"],"a":1,"e":"Mortensen v. Peters (1906) illustrates that, in Britain, statute prevails over inconsistent international law before domestic courts."},{"id":"pil-39","t":"Relationship","q":"The UK government signs a treaty that would change private rights of citizens. For it to take effect in British courts:","o":["Nothing further is needed","An Act of Parliament must be passed to give it domestic effect","The House of Lords alone must approve","The Crown must issue a proclamation"],"a":1,"e":"Treaty-making is a Crown prerogative, but a treaty that alters domestic law or affects private rights requires enabling legislation; otherwise courts will not apply it."},{"id":"pil-40","t":"Relationship","q":"Which provision of the Indian Constitution tells the State to foster respect for international law and treaty obligations?","o":["Article 51(c)","Article 73","Article 253","Article 372"],"a":0,"e":"Article 51(c), a Directive Principle, directs the State to foster respect for international law and treaty obligations in the dealings of organised peoples with one another."},{"id":"pil-41","t":"Relationship","q":"India signs a convention on a subject that is in the State List. Can Parliament legislate to implement it?","o":["No, only State legislatures can","Yes; Article 253 empowers Parliament to make any law for implementing any treaty, agreement or convention, notwithstanding the distribution of legislative powers","Only with the consent of all States","Only through an ordinance"],"a":1,"e":"Article 253 (read with Entry 14 of List I) allows Parliament to legislate for the whole or any part of India to implement international agreements, even on State subjects."},{"id":"pil-42","t":"Relationship","q":"There was no Indian law on sexual harassment at the workplace. The Supreme Court framed guidelines relying on CEDAW, holding that international conventions consistent with fundamental rights can be read into them. The case is:","o":["Vishaka v. State of Rajasthan (1997)","Kesavananda Bharati v. State of Kerala","A.K. Gopalan v. State of Madras","Golak Nath v. State of Punjab"],"a":0,"e":"Vishaka (1997): in the absence of domestic law, international conventions and norms are significant for interpreting the guarantee of gender equality under Articles 14, 15, 19(1)(g) and 21."},{"id":"pil-43","t":"Relationship","q":"In Gramophone Co. of India v. Birendra Bahadur Pandey (1984), the Supreme Court said that rules of international law:","o":["Can never be applied by Indian courts","May be accommodated in municipal law even without express legislative sanction, provided they do not conflict with Acts of Parliament","Override the Constitution","Apply only to treaties ratified by Parliament"],"a":1,"e":"The Court held that the comity of nations requires incorporation of international law into national law unless it conflicts with statute; in case of conflict, national law prevails."},{"id":"pil-44","t":"Relationship","q":"India agreed to transfer part of Berubari to Pakistan under the Nehru-Noon Agreement. The Supreme Court advised that this required:","o":["Only an executive order","A constitutional amendment under Article 368, since cession of Indian territory alters the First Schedule","An ordinary law of Parliament","A UN resolution"],"a":1,"e":"In re Berubari Union (1960) led to the Constitution (Ninth Amendment) Act, 1960. The same reasoning required the 100th Amendment (2015) for the India-Bangladesh enclave exchange."},{"id":"pil-45","t":"Relationship","q":"A judgment-debtor is sought to be jailed under S.51 CPC merely because he cannot pay. In Jolly George Varghese v. Bank of Cochin (1980), the Supreme Court read into the section:","o":["The UN Charter","Article 11 of the ICCPR: no one shall be imprisoned merely for inability to fulfil a contractual obligation","CEDAW","The Geneva Conventions"],"a":1,"e":"Justice Krishna Iyer held that S.51 CPC must be read in harmony with Article 11 of the International Covenant on Civil and Political Rights and Article 21; arrest requires some element of bad faith or means to pay."},{"id":"pil-46","t":"Relationship","q":"The Rann of Kutch award gave some territory to Pakistan. In Maganbhai Ishwarbhai Patel v. UOI (1969) the Supreme Court held that implementing it:","o":["Needed a constitutional amendment","Could be done by executive action, because it settled a boundary dispute and did not cede Indian territory or change the law; legislation is needed only where a treaty restricts citizens' rights or modifies the law","Was unconstitutional","Needed Parliament's approval by two-thirds majority"],"a":1,"e":"Maganbhai (1969) distinguished Berubari: a boundary settlement that merely determines existing frontiers can be implemented by the executive under Article 73."},{"id":"pil-47","t":"Subjects","q":"Under the traditional (realist) view, who alone are the subjects of international law?","o":["Individuals","States","International organisations","Multinational companies"],"a":1,"e":"The realist theory treats States as the only subjects; individuals are mere objects whose rights are protected through their State."},{"id":"pil-48","t":"Subjects","q":"Kelsen argued that since a State acts only through human beings, the real subjects of international law are individuals. This is the:","o":["Realist theory","Fictional theory","Functional theory","Positivist theory"],"a":1,"e":"Under the fictional theory, the State is a legal fiction; the duties and rights of States are ultimately those of the individuals who compose them."},{"id":"pil-49","t":"Subjects","q":"The modern, generally accepted view is that the subjects of international law include:","o":["Only States","Only individuals","States, international organisations and, to a limited extent, individuals (the functional theory)","Only the United Nations"],"a":2,"e":"The functional theory recognises that while States remain the primary subjects, international organisations and individuals also possess rights and duties under international law."},{"id":"pil-50","t":"Subjects","q":"After the assassination of UN mediator Count Bernadotte in Jerusalem, could the UN itself claim reparation from Israel, which was not then a member?","o":["No, only Sweden could claim","Yes; the ICJ advised that the UN has international legal personality and can bring a claim even against a non-member (Reparation for Injuries, 1949)","No, the UN is not a State","Only through the Security Council"],"a":1,"e":"Reparation for Injuries Suffered in the Service of the United Nations (Advisory Opinion, 1949) established the objective international personality of the UN."},{"id":"pil-51","t":"Subjects","q":"Nazi leaders argued at Nuremberg that only the German State, not individuals, could be responsible for violations of international law. The Tribunal held:","o":["The argument was correct","Crimes against international law are committed by men, not by abstract entities, and individuals can be punished; official position is no defence","Only the Head of State could be tried","The matter was for German courts"],"a":1,"e":"The Nuremberg judgment (1946) is the foundation of individual criminal responsibility under international law."},{"id":"pil-52","t":"Subjects","q":"In the Danzig Railway Officials case (PCIJ 1928), the Court held that a treaty:","o":["Can never create rights for individuals","May directly create rights and obligations for individuals enforceable in national courts if that was the intention of the parties","Binds only the UN","Is void if it mentions individuals"],"a":1,"e":"This advisory opinion is an early recognition that individuals can derive rights directly from international agreements."},{"id":"pil-53","t":"Subjects","q":"Which of the following does NOT ordinarily possess international legal personality?","o":["A State","The United Nations","A private multinational company","The Holy See"],"a":2,"e":"Companies act internationally through the State of their nationality (Barcelona Traction). States, international organisations, belligerents and the Holy See are recognised international persons."},{"id":"pil-54","t":"State","q":"An entity has a population, a defined territory and a functioning government, and conducts its own foreign relations. Under which instrument does it qualify as a State?","o":["Vienna Convention, 1969","Montevideo Convention on the Rights and Duties of States, 1933, Art. 1","UN Charter","Hague Convention, 1907"],"a":1,"e":"Art. 1 of the Montevideo Convention lists the four elements: permanent population, defined territory, government and capacity to enter into relations with other States."},{"id":"pil-55","t":"State","q":"Which of the following is NOT required for statehood under the Montevideo Convention?","o":["Permanent population","Defined territory","Membership of the United Nations","Capacity to enter into relations with other States"],"a":2,"e":"UN membership and recognition by other States are not elements of statehood; Art. 3 says the political existence of a State is independent of recognition."},{"id":"pil-56","t":"State","q":"\"Sovereignty in the relations between States signifies independence; independence in regard to a portion of the globe is the right to exercise therein the functions of a State.\" This statement comes from:","o":["Island of Palmas Case (Max Huber, 1928)","Lotus Case","Corfu Channel Case","Montevideo Convention"],"a":0,"e":"Max Huber's award in Island of Palmas gives the classic definition of territorial sovereignty."},{"id":"pil-57","t":"Recognition","q":"State X declares that it acknowledges the new State of Y and will deal with it as a State. This act is called:","o":["Succession","Recognition","Cession","Accession"],"a":1,"e":"Recognition is the act by which an existing State acknowledges that a new entity possesses the attributes of statehood (or that a new regime is the government) and signifies willingness to enter into relations with it."},{"id":"pil-58","t":"Recognition","q":"Under the constitutive theory, an entity that satisfies all the Montevideo criteria but is recognised by no State:","o":["Is a State with full rights","Is not an international person at all; recognition creates statehood","Is a State for treaty purposes only","Is automatically a UN member"],"a":1,"e":"The constitutive theory (Hegel, Anzilotti, Oppenheim, Holland) makes statehood depend on recognition. It is criticised because an entity could be a State for some countries and not for others."},{"id":"pil-59","t":"Recognition","q":"Under the declaratory theory, recognition:","o":["Creates the State","Merely acknowledges an existing fact; statehood exists once the factual criteria are met (Hall, Brierly, Fisher, Pitt Cobbett)","Is a legal duty under the UN Charter","Is prohibited"],"a":1,"e":"The declaratory (evidentiary) theory is supported by Art. 3 of the Montevideo Convention and by the practice of courts treating unrecognised States as existing."},{"id":"pil-60","t":"Recognition","q":"Lauterpacht's view on recognition is that:","o":["It is purely political and discretionary","It is constitutive, but States are under a legal duty to recognise an entity that satisfies the conditions of statehood","It is unnecessary","Only the UN can recognise"],"a":1,"e":"Lauterpacht tried to reconcile the theories: recognition constitutes statehood, but it is not a matter of discretion once the facts exist."},{"id":"pil-61","t":"Recognition","q":"A new government has taken effective control of a country, but its stability is uncertain. Another State wants to deal with it while waiting to see if it lasts. The appropriate form of recognition is:","o":["De jure","De facto, which is provisional and can be withdrawn","Collective","Conditional"],"a":1,"e":"De facto recognition is given when the authority has effective control but its permanence is doubtful; de jure recognition is given when the State or government is firmly established and fulfils all requirements."},{"id":"pil-62","t":"Recognition","q":"Which of the following can be claimed only by a government recognised de jure, and not by one recognised merely de facto?","o":["Immunity from suit in foreign courts","The right to claim State property situated in the recognising State and full diplomatic representation","Validity of its internal legislative acts","Recognition of its courts' decisions"],"a":1,"e":"Haile Selassie v. Cable and Wireless (1939): only the de jure government can claim State assets abroad. Both de facto and de jure governments enjoy immunity and have their internal acts recognised (Luther v. Sagor)."},{"id":"pil-63","t":"Recognition","q":"In 1920 the Soviet government nationalised timber; the UK recognised that government de facto in 1921. An English court was asked whether the 1920 decree should be given effect. It held:","o":["No, because the decree predated recognition","Yes; recognition is retroactive to the date the government came into power, and de facto recognition suffices for giving effect to its internal acts (Luther v. Sagor, 1921)","No, only de jure recognition would do","The question was non-justiciable"],"a":1,"e":"Luther v. Sagor (1921) established both the retroactive effect of recognition and the equivalence of de facto and de jure recognition as to internal acts."},{"id":"pil-64","t":"Recognition","q":"During the Spanish Civil War, a ship requisitioned by Franco's Nationalist government (recognised de facto by the UK) was sued in England. The House of Lords held:","o":["The ship could be seized","The de facto government was a sovereign State for that part of Spain and was entitled to immunity (The Arantzazu Mendi, 1939)","Only the Republican government had immunity","Ships have no immunity"],"a":1,"e":"The Arantzazu Mendi (1939): a government recognised de facto enjoys sovereign immunity in respect of the territory it controls."},{"id":"pil-65","t":"Recognition","q":"After Japan set up Manchukuo in occupied Manchuria in 1932, the US declared that it would not recognise situations brought about by means contrary to the Kellogg-Briand Pact. This is the:","o":["Stimson Doctrine","Estrada Doctrine","Tobar Doctrine","Drago Doctrine"],"a":0,"e":"The Stimson Doctrine of non-recognition is now reflected in the rule that territorial acquisitions by illegal use of force are not recognised (Friendly Relations Declaration, 1970)."},{"id":"pil-66","t":"Recognition","q":"Mexico announced in 1930 that it would no longer pronounce on the legitimacy of new foreign governments but simply continue or withdraw its diplomats. This policy is the:","o":["Stimson Doctrine","Estrada Doctrine","Tobar Doctrine","Monroe Doctrine"],"a":1,"e":"Named after Foreign Minister Genaro Estrada, the doctrine treats express recognition of governments as an insulting practice interfering in internal affairs."},{"id":"pil-67","t":"Recognition","q":"The Tobar Doctrine (1907) proposed that governments which come to power by revolution:","o":["Should be recognised immediately","Should not be recognised until constitutionally confirmed by the people","Should be expelled from the UN","Should be recognised only de facto"],"a":1,"e":"Carlos Tobar of Ecuador proposed the doctrine of legitimacy; the opposite approach is the Estrada Doctrine."},{"id":"pil-68","t":"Recognition","q":"When a new State is admitted to the United Nations, this is often described as:","o":["Conditional recognition","Collective recognition","De facto recognition","Recognition of belligerency"],"a":1,"e":"Admission under Art. 4 of the Charter is treated as collective recognition of statehood, though it does not legally oblige each member to recognise the new State bilaterally."},{"id":"pil-69","t":"Recognition","q":"State A has never issued a statement recognising State B, but it concludes a bilateral trade treaty with B and exchanges ambassadors. Has A recognised B?","o":["No, recognition must be express","Yes, impliedly; entering into bilateral treaties and establishing diplomatic relations implies recognition","Only if the UN agrees","Only after five years"],"a":1,"e":"Recognition may be express or implied from conduct such as a bilateral treaty, exchange of diplomatic representatives or granting exequatur to consuls. Attending a multilateral conference does not imply recognition."},{"id":"pil-70","t":"Recognition","q":"Rebels control a substantial part of a country, fight under a responsible command and observe the laws of war. A third State may recognise them as:","o":["A State","Belligerents, which gives them the rights and duties of a belligerent under the laws of war and imposes neutrality on the recognising State","Insurgents only","Terrorists"],"a":1,"e":"Recognition of belligerency requires an armed conflict of general character, occupation of substantial territory, a responsible authority and observance of the laws of war; Britain so recognised the Confederacy in 1861."},{"id":"pil-71","t":"Recognition","q":"Can recognition be withdrawn?","o":["Never","De facto recognition can be withdrawn if the authority fails to consolidate; de jure recognition is generally final, though recognition of a government lapses when it is replaced","Only by the UN","Only de jure recognition can be withdrawn"],"a":1,"e":"De facto recognition is provisional; de jure recognition is treated as irrevocable, though a State may recognise a new government in place of the old."},{"id":"pil-72","t":"Recognition","q":"France recognised the United States in 1778 while the American colonies were still fighting Britain. Britain treated this as:","o":["Lawful","Premature recognition amounting to unlawful intervention, and a cause of war","Collective recognition","Recognition of belligerency only"],"a":1,"e":"Recognising a seceding entity before the parent State has abandoned the struggle or the new entity has established stable control is premature and constitutes intervention in the parent State's affairs."},{"id":"pil-73","t":"Succession","q":"\"The replacement of one State by another in the responsibility for the international relations of territory\" is the definition of:","o":["Recognition","State succession (Art. 2, Vienna Convention on Succession of States in respect of Treaties, 1978)","Cession","Annexation"],"a":1,"e":"State succession occurs through merger, dismemberment, secession, cession or decolonisation, and raises questions about which treaties, property, debts and memberships pass to the successor."},{"id":"pil-74","t":"Succession","q":"A newly independent former colony says it is not bound by treaties concluded by the colonial power for its territory. Which doctrine supports it?","o":["Uti possidetis","The clean slate (tabula rasa) doctrine, embodied in Art. 16 of the 1978 Convention","Universal succession","Pacta sunt servanda"],"a":1,"e":"Art. 16 of the Vienna Convention on Succession of States in respect of Treaties, 1978: a newly independent State is not bound to maintain in force any treaty by reason only of its having been in force for the territory under the predecessor."},{"id":"pil-75","t":"Succession","q":"A new State emerges and argues that it is not bound by the boundary treaty the predecessor made with its neighbour. International law says:","o":["It is correct; all treaties lapse","Boundary and territorial regimes established by treaty continue to bind the successor (Arts. 11-12 of the 1978 Convention)","It is bound only if it ratifies the treaty afresh","Boundaries are redrawn by the ICJ"],"a":1,"e":"Dispositive or \"real\" treaties (boundaries, rights of transit, servitudes) pass to the successor; personal and political treaties (alliance, neutrality) do not."},{"id":"pil-76","t":"Succession","q":"The two Germanys merged in 1990 and Czechoslovakia split in 1993. These are examples of:","o":["Partial succession","Universal (total) succession, where the predecessor State ceases to exist","Recognition","Cession"],"a":1,"e":"Universal succession occurs when the predecessor State is extinguished by merger, absorption or dismemberment; partial succession occurs when only part of the territory passes."},{"id":"pil-77","t":"Succession","q":"After Britain annexed the Transvaal, a gold-mining company sued the Crown for money the former Boer government had seized. The court held:","o":["Britain must pay","A conquering State does not succeed to the obligations of the conquered State; there is no succession to torts or unliquidated claims (West Rand Central Gold Mining Co. v. R, 1905)","The company must sue in the ICJ","The claim passed to South Africa"],"a":1,"e":"The same rule was applied in the Robert E. Brown Claim (US v. UK, 1923)."},{"id":"pil-78","t":"Succession","q":"The Tinoco regime seized power in Costa Rica, granted concessions to British companies, and was then overthrown. Britain was not among the States that had recognised Tinoco. The arbitrator (Taft CJ) held:","o":["The concessions were void","The Tinoco regime, having been in effective control, was the government of Costa Rica and its obligations bound the restored government; non-recognition was evidence but not conclusive","Britain had no standing because it had not recognised Tinoco","Costa Rica ceased to exist"],"a":1,"e":"Tinoco Arbitration (1923) distinguishes succession of governments from succession of States: the State continues and remains bound by acts of a de facto government."},{"id":"pil-79","t":"Succession","q":"On the partition of 1947, which State continued the UN membership of British India?","o":["Both India and Pakistan automatically","India, as the continuing State; Pakistan was admitted as a new member","Pakistan","Neither; both applied afresh"],"a":1,"e":"India was treated as the continuation of the predecessor State; Pakistan was admitted to the UN on 30 September 1947. Russia similarly continued the USSR's seat in 1991."},{"id":"pil-80","t":"Territory","q":"A State plants its flag on an uninhabited island that belongs to no one and establishes administration there. The mode of acquisition is:","o":["Cession","Occupation of terra nullius","Prescription","Accretion"],"a":1,"e":"Occupation is the acquisition of territory belonging to no State (terra nullius) by effective possession with intention to act as sovereign."},{"id":"pil-81","t":"Territory","q":"Spain discovered the island of Palmas in the 16th century; the Netherlands later exercised peaceful authority there for two centuries. The arbitrator held:","o":["Spain's discovery gave it full title","Discovery gave only an inchoate title which could not prevail over continuous and peaceful display of sovereignty by the Netherlands (Island of Palmas, 1928, Max Huber)","Both States owned it jointly","The island was terra nullius"],"a":1,"e":"Title must be maintained by effective occupation; a mere discovery not followed by effective possession is lost to a State displaying real authority."},{"id":"pil-82","t":"Territory","q":"Denmark's claim to Eastern Greenland rested on very little actual activity in a thinly populated Arctic region. The PCIJ (1933) held:","o":["Denmark had no title","Denmark had title; in thinly populated or uninhabited areas very little actual exercise of sovereign rights suffices, and Norway was also bound by the Ihlen Declaration of its Foreign Minister","Norway had title","The area was terra nullius"],"a":1,"e":"Legal Status of Eastern Greenland (1933): the degree of effective control required depends on the nature of the territory; an oral declaration by a Foreign Minister can bind his State."},{"id":"pil-83","t":"Territory","q":"France proclaimed sovereignty over the uninhabited Clipperton Island in 1858 and did nothing more for decades; Mexico later claimed it. The arbitrator held:","o":["Mexico owned it","France owned it: for an uninhabited island, the taking of possession and proclamation of sovereignty was sufficient effective occupation (Clipperton Island Case, 1931)","It was terra nullius","It belonged to Spain"],"a":1,"e":"The Clipperton award shows that the requirement of effective occupation is relative to the nature of the territory."},{"id":"pil-84","t":"Territory","q":"Was Western Sahara \"terra nullius\" when Spain colonised it in 1884, given that it was inhabited by nomadic tribes with social and political organisation?","o":["Yes","No; the ICJ (Advisory Opinion, 1975) held that territory inhabited by organised tribes was not terra nullius, so it could not be acquired by occupation","Yes, because the tribes had no State","The question was political"],"a":1,"e":"Western Sahara (1975): the Court also found that neither Morocco nor Mauritania had ties of territorial sovereignty with the territory."},{"id":"pil-85","t":"Territory","q":"State A has openly and peacefully exercised sovereignty for a very long period over territory that originally belonged to State B, which never protested. A's title is based on:","o":["Occupation","Prescription","Accretion","Conquest"],"a":1,"e":"Prescription is acquisition through long, continuous, peaceful and undisturbed possession of territory of another State, with the acquiescence of that State."},{"id":"pil-86","t":"Territory","q":"A river gradually deposits silt and a new island forms within a State's waters. The State acquires the new land by:","o":["Prescription","Accretion","Cession","Avulsion"],"a":1,"e":"Accretion is the gradual addition of territory by natural causes. The Chamizal Arbitration (US v. Mexico, 1911) distinguished gradual accretion from sudden avulsion, which does not shift a boundary."},{"id":"pil-87","t":"Territory","q":"The USA bought Alaska from Russia in 1867 by treaty. This mode of acquiring territory is:","o":["Accretion","Cession","Annexation","Occupation"],"a":1,"e":"Cession is the peaceful transfer of sovereignty by agreement, e.g., Alaska (1867), the Louisiana Purchase (1803), or the transfer of French settlements such as Pondicherry to India."},{"id":"pil-88","t":"Territory","q":"A State invades its neighbour and annexes a province. Under present law its title is:","o":["Valid by conquest","Invalid; acquisition of territory by threat or use of force is prohibited by Art. 2(4) of the UN Charter and is not to be recognised","Valid if the UN does not object within a year","Valid after 50 years"],"a":1,"e":"Conquest was once a recognised mode of acquisition, but Art. 2(4) of the Charter and the Friendly Relations Declaration (1970) deny legal title to acquisitions by force."},{"id":"pil-89","t":"Territory","q":"On independence, Burkina Faso and Mali accepted their former French colonial administrative line as their international boundary. The ICJ (1986) applied the principle of:","o":["Terra nullius","Uti possidetis juris: the boundaries existing at the moment of independence are retained","Rebus sic stantibus","Prescription"],"a":1,"e":"Uti possidetis juris freezes territorial title at the moment of independence to avoid fratricidal struggles over boundaries; it applies in Latin America, Africa and the former Yugoslavia."},{"id":"pil-90","t":"Territory","q":"India and Bangladesh exchanged enclaves under the Land Boundary Agreement. Because this involved transfer of Indian territory, it was implemented by:","o":["An executive notification","The Constitution (100th Amendment) Act, 2015","An ordinary Act of Parliament","A UN resolution"],"a":1,"e":"Following the Berubari reasoning, cession of territory required amendment of the First Schedule by the Constitution (One Hundredth Amendment) Act, 2015."},{"id":"pil-91","t":"Jurisdiction","q":"Pirates attack a ship on the high seas and are captured by an Indian warship. India can try them even though neither the pirates nor the ship is Indian because of the:","o":["Territorial principle","Nationality principle","Protective principle","Universality principle"],"a":3,"e":"Piracy jure gentium is the oldest example of universal jurisdiction: any State may try the offender regardless of the place of the crime or the nationality of the offender or victim. War crimes, genocide and crimes against humanity are modern examples."},{"id":"pil-92","t":"Jurisdiction","q":"State A prosecutes a foreigner for murdering an A national abroad. A is asserting jurisdiction under the:","o":["Territorial principle","Nationality (active personality) principle","Passive personality principle","Universality principle"],"a":2,"e":"The passive personality principle bases jurisdiction on the nationality of the victim. It was controversial (Lotus; Cutting case) but is now accepted especially for terrorist offences."},{"id":"pil-93","t":"Jurisdiction","q":"A foreigner counterfeits Indian currency in another country. India claims jurisdiction because the act threatens its vital interests. This is the:","o":["Territorial principle","Protective (security) principle","Passive personality principle","Universality principle"],"a":1,"e":"The protective principle covers acts abroad that threaten the security, integrity or financial interests of the State, e.g., counterfeiting, espionage and treason (Joyce v. DPP, 1946)."},{"id":"pil-94","t":"Jurisdiction","q":"Israel abducted Adolf Eichmann from Argentina and tried him for crimes committed in Europe before Israel existed. The Israeli courts justified jurisdiction mainly on:","o":["The territorial principle","The universality and protective (linking-point) principles","A treaty with Germany","Argentina's consent"],"a":1,"e":"Attorney-General of Israel v. Eichmann (1961-62): crimes against humanity and the Jewish people attract universal jurisdiction, and the illegal abduction did not deprive the court of jurisdiction (male captus bene detentus)."},{"id":"pil-95","t":"Jurisdiction","q":"A French public armed vessel entered a US port and an American claimed it as his former property. Chief Justice Marshall held the ship was immune from US courts. The case is:","o":["The Schooner Exchange v. McFaddon (1812)","Paquete Habana","Luther v. Sagor","Pinochet"],"a":0,"e":"The Schooner Exchange (1812) is the origin of the doctrine of sovereign immunity: a sovereign is understood to waive jurisdiction over the public vessels of a friendly foreign sovereign."},{"id":"pil-96","t":"Jurisdiction","q":"A foreign State's trading corporation is sued in London over an ordinary commercial contract. Under the restrictive theory of immunity, the State:","o":["Is fully immune","Is not immune, because immunity covers only sovereign acts (jure imperii), not commercial acts (jure gestionis)","Is immune only if it pleads immunity","Is immune only in criminal cases"],"a":1,"e":"The restrictive theory was adopted in Trendtex Trading v. Central Bank of Nigeria (1977) and the UK State Immunity Act, 1978; absolute immunity has largely been abandoned."},{"id":"pil-97","t":"Jurisdiction","q":"A diplomat posted in Delhi is accused of a serious crime. Indian courts:","o":["Can try him like anyone else","Cannot try him; a diplomatic agent enjoys immunity from the criminal jurisdiction of the receiving State under Art. 31 of the Vienna Convention on Diplomatic Relations, 1961, though he may be declared persona non grata or his immunity waived by his State","Can try him only after conviction in his own country","Can try him only for traffic offences"],"a":1,"e":"The VCDR 1961 (implemented in India by the Diplomatic Relations (Vienna Convention) Act, 1972) gives diplomatic agents inviolability (Art. 29) and immunity from criminal jurisdiction (Art. 31)."},{"id":"pil-98","t":"Jurisdiction","q":"Spain sought the extradition of Chile's former head of State, Augusto Pinochet, from the UK for torture. The House of Lords held:","o":["A former head of State is absolutely immune","A former head of State has no immunity for torture, an international crime, committed after the relevant States became parties to the Torture Convention; torture cannot be an official function (Pinochet No. 3, 1999)","Chile alone could try him","Torture is not a crime"],"a":1,"e":"The Pinochet case limited immunity ratione materiae for international crimes."},{"id":"pil-99","t":"Responsibility","q":"Which instrument is treated as the authoritative statement of the rules on State responsibility?","o":["UN Charter","ILC Articles on Responsibility of States for Internationally Wrongful Acts, 2001","Montevideo Convention","Statute of the ICJ"],"a":1,"e":"The ILC adopted the Draft Articles (ARSIWA) in 2001 and the General Assembly took note of them in Resolution 56/83; they are widely treated as reflecting customary law."},{"id":"pil-100","t":"Responsibility","q":"Under the ILC Articles, a State is internationally responsible when:","o":["Any damage occurs in its territory","Conduct consisting of an act or omission is attributable to the State and constitutes a breach of its international obligation","It is found guilty by the Security Council","It has signed a treaty"],"a":1,"e":"Art. 2 ARSIWA sets out the two elements: attribution and breach. Fault and damage are not separate general requirements."},{"id":"pil-101","t":"Responsibility","q":"Poland expropriated a German-owned factory in Upper Silesia contrary to treaty. The PCIJ laid down that the breach of an international engagement involves an obligation to make reparation that should wipe out all consequences of the illegal act. The case is:","o":["Chorzow Factory Case (1928)","Lotus Case","Reparation Case","Paquete Habana"],"a":0,"e":"Chorzow Factory (Germany v. Poland, 1928) is the leading authority on reparation: restitution in kind or, if impossible, payment corresponding to its value."},{"id":"pil-102","t":"Responsibility","q":"British warships were damaged by mines in Albanian waters. Albania was held responsible because it must have known of the minefield and failed to warn. The ICJ stated that every State has an obligation not to allow knowingly its territory to be used for acts contrary to the rights of other States. The case is:","o":["Corfu Channel Case (UK v. Albania, 1949), the first contentious case of the ICJ","Asylum Case","Nottebohm Case","Lotus Case"],"a":0,"e":"Corfu Channel (1949) is also notable for holding that the UK's subsequent minesweeping operation violated Albanian sovereignty."},{"id":"pil-103","t":"Responsibility","q":"Sulphur fumes from a Canadian smelter damaged farms in Washington State. The arbitral tribunal held that no State may use or permit the use of its territory so as to cause injury in another State's territory. The case is:","o":["Trail Smelter Arbitration (1941)","Corfu Channel Case","Rainbow Warrior Arbitration","Chorzow Factory Case"],"a":0,"e":"Trail Smelter (US v. Canada) is the foundation of the international law of transboundary environmental harm."},{"id":"pil-104","t":"Responsibility","q":"Switzerland brought a claim against the USA on behalf of a Swiss company before the company had finished litigating in US courts. The ICJ held the claim inadmissible because:","o":["Switzerland was not a State","Local remedies had not been exhausted (Interhandel Case, 1959)","The company was American","The ICJ has no jurisdiction over companies"],"a":1,"e":"The rule of exhaustion of local remedies gives the respondent State a chance to redress the wrong within its own legal system before an international claim is brought (also Ambatielos Arbitration, 1956)."},{"id":"pil-105","t":"Responsibility","q":"A Latin American State inserts in its contracts with foreign companies a clause under which the company agrees to rely only on local courts and not to seek diplomatic protection. This is a:","o":["Drago clause","Calvo clause","Stimson clause","Most-favoured-nation clause"],"a":1,"e":"The Calvo Doctrine (Carlos Calvo, Argentina) asserts that aliens are entitled only to national treatment and must not invoke diplomatic intervention; the validity of the clause under international law is contested (North American Dredging Co., 1926)."},{"id":"pil-106","t":"Responsibility","q":"When European powers blockaded Venezuela to collect public debts in 1902, Argentina's Foreign Minister declared that public debt cannot justify armed intervention. This is the:","o":["Calvo Doctrine","Drago Doctrine","Monroe Doctrine","Estrada Doctrine"],"a":1,"e":"The Drago Doctrine was partly adopted in the Hague Convention II of 1907 (Porter Convention), which prohibits force to recover contract debts unless arbitration is refused."},{"id":"pil-107","t":"Responsibility","q":"French agents sank the Greenpeace ship Rainbow Warrior in Auckland harbour, and France later removed its agents from Hao island in breach of an agreement with New Zealand. The arbitral award (1990) is important for:","o":["Fishing rights","State responsibility and the circumstances precluding wrongfulness, such as force majeure and distress","Recognition of governments","Territorial acquisition"],"a":1,"e":"Rainbow Warrior (New Zealand v. France, 1990): France's pleas of force majeure and distress were examined and largely rejected; France was held in breach."},{"id":"pil-108","t":"Nationality","q":"Nottebohm, a German, obtained Liechtenstein nationality in 1939 while living in Guatemala. Liechtenstein sued Guatemala on his behalf. The ICJ held:","o":["Liechtenstein could protect him","Liechtenstein could not exercise diplomatic protection because there was no genuine and effective link between Nottebohm and Liechtenstein (Nottebohm Case, 1955)","Guatemala must pay damages","Dual nationality is prohibited"],"a":1,"e":"Nottebohm established the \"genuine link\" test for nationality to be opposable to other States for the purpose of diplomatic protection."},{"id":"pil-109","t":"Nationality","q":"A fugitive flees to a country with which his home State has no extradition treaty. Is that country bound under customary international law to hand him over?","o":["Yes, always","No; there is no general duty to extradite in the absence of a treaty or reciprocity; extradition rests on treaties and municipal law (in India, the Extradition Act, 1962)","Yes, for all political offences","Only if the UN orders it"],"a":1,"e":"Extradition is governed by treaties and national legislation; political offenders are usually excluded, and the principle of double criminality applies."},{"id":"pil-110","t":"Nationality","q":"V.D. Savarkar escaped from a British ship at Marseilles and was recaptured on French soil with the help of a French policeman. France demanded his return. The Permanent Court of Arbitration (1911) held:","o":["Britain must return him","Britain was not bound to restore Savarkar; the irregularity of his recapture did not create a duty to return him","France had jurisdiction to try him","Savarkar was entitled to asylum"],"a":1,"e":"The Savarkar Case illustrates that an irregular arrest on foreign soil does not by itself oblige the arresting State to return the fugitive."},{"id":"pil-111","t":"Nationality","q":"\"Everyone has the right to seek and to enjoy in other countries asylum from persecution\" is found in:","o":["Article 14 of the Universal Declaration of Human Rights, 1948","Article 2(4) of the UN Charter","Article 38 of the ICJ Statute","The Montevideo Convention"],"a":0,"e":"Art. 14 UDHR recognises the right to seek asylum. Granting territorial asylum is a right of the State; diplomatic asylum in embassies is not generally recognised outside Latin America (Asylum Case, 1950)."},{"id":"pil-112","t":"UN","q":"The United Nations Charter was signed at San Francisco on 26 June 1945 and came into force on:","o":["26 June 1945","24 October 1945","10 December 1948","1 January 1946"],"a":1,"e":"24 October 1945 is celebrated as United Nations Day. The Charter has 111 Articles in 19 Chapters; the Statute of the ICJ is annexed to it."},{"id":"pil-113","t":"UN","q":"How many judges sit on the International Court of Justice, and for what term?","o":["9 judges for 15 years","15 judges for 9 years, one-third retiring every 3 years","11 judges for 5 years","15 judges for life"],"a":1,"e":"Arts. 3 and 13 of the ICJ Statute: fifteen judges, no two nationals of the same State, elected by the General Assembly and Security Council; they may be re-elected."},{"id":"pil-114","t":"UN","q":"An NGO wants to sue a State before the ICJ for environmental damage. Can it?","o":["Yes","No; only States may be parties in contentious cases before the ICJ (Art. 34 of the Statute)","Yes, with the Secretary-General's permission","Yes, if the State consents"],"a":1,"e":"Art. 34(1): only States may be parties in cases before the Court. UN organs and specialised agencies may request advisory opinions under Art. 65."},{"id":"pil-115","t":"UN","q":"The court that preceded the ICJ at The Hague, set up under the League of Nations Covenant, was the:","o":["Permanent Court of Arbitration","Permanent Court of International Justice (1922-1946)","International Criminal Court","European Court of Justice"],"a":1,"e":"The PCIJ was created under Art. 14 of the League Covenant and sat from 1922 to 1946; the ICJ replaced it in 1946 as the principal judicial organ of the UN (Art. 92 of the Charter)."},{"id":"pil-116","t":"UN","q":"India has filed a declaration accepting the ICJ's jurisdiction as compulsory in disputes with any other State accepting the same obligation, subject to reservations. This is a declaration under:","o":["Art. 36(2) of the Statute (the optional clause)","Art. 38","Art. 59","Art. 65"],"a":0,"e":"Art. 36(2): States may declare that they recognise as compulsory ipso facto and without special agreement the jurisdiction of the Court in legal disputes with any other State accepting the same obligation."},{"id":"pil-117","t":"UN","q":"Which of the following is a subsidiary body, not one of the six principal organs of the United Nations?","o":["Security Council","Economic and Social Council","International Law Commission","Trusteeship Council"],"a":2,"e":"Art. 7 of the Charter lists the General Assembly, Security Council, ECOSOC, Trusteeship Council, ICJ and Secretariat. The ILC, created by the General Assembly in 1947 for codification of international law, is a subsidiary organ."}]}]};
