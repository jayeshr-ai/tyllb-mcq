nt which the Magistrate is competent to inflict as punishment for the offence otherwise than as imprisonment in default of fine."},{"id":"bnss-44","t":"Powers","q":"An accused is convicted at one trial of three offences, each carrying 10 years, and the sentences are ordered to run consecutively. Under the BNSS the total period cannot exceed:","o":["10 years","14 years","20 years","30 years"],"a":2,"e":"S.25(2): the aggregate of consecutive sentences passed at one trial shall not exceed twenty years (fourteen under the CrPC), and shall not exceed twice the punishment the court is competent to inflict for a single offence."},{"id":"bnss-45","t":"Powers","q":"A person is convicted of several offences at one trial. Unless the court orders otherwise, the sentences will:","o":["Run concurrently","Run one after the other (consecutively)","Be limited to the heaviest sentence","Be suspended"],"a":1,"e":"S.25(1): the court may sentence the offender to the several punishments, which shall commence one after the expiration of the other unless the court directs that they run concurrently."},{"id":"bnss-46","t":"Powers","q":"A Magistrate who passed an order is transferred. Can his successor continue the proceedings?","o":["No, the case must start afresh","Yes; the powers and duties of a Judge or Magistrate may be exercised by his successor-in-office","Only with the High Court's permission","Only in summons-cases"],"a":1,"e":"S.29: subject to the other provisions of the Sanhita, the powers and duties of a Judge or Magistrate may be exercised or performed by his successor-in-office."},{"id":"bnss-47","t":"Aid","q":"A police officer chasing a thief shouts to a passer-by to help stop him. Is the passer-by legally bound to help?","o":["No, only police can act","Yes; every person is bound to assist a Magistrate or police officer reasonably demanding aid in taking or preventing the escape of a person they are authorised to arrest","Only if paid","Only if he is a government servant"],"a":1,"e":"S.31: every person is bound to assist a Magistrate or police officer reasonably demanding his aid (a) in taking or preventing the escape of a person whom they are authorised to arrest, (b) in preventing a breach of the peace, and (c) in preventing injury to public property."},{"id":"bnss-48","t":"Aid","q":"A village resident learns that a murder is being planned. Under the BNSS he is bound to:","o":["Keep quiet","Forthwith give information to the nearest Magistrate or police officer","Inform the Sarpanch only","Inform the newspaper"],"a":1,"e":"S.33(1): every person aware of the commission of, or of the intention of any other person to commit, specified offences under the BNS (including offences affecting life) shall forthwith give information to the nearest Magistrate or police officer."},{"id":"bnss-49","t":"Arrest","q":"A police officer receives credible information that X committed an offence punishable with 5 years' imprisonment. Can the officer arrest X without warrant merely because the offence is cognizable?","o":["Yes, automatically","No; for offences punishable up to 7 years the officer must also be satisfied that arrest is necessary (to prevent further offence, for proper investigation, to prevent tampering with evidence or threatening witnesses, or to ensure presence in court) and must record reasons","Only after a court order","Only if X has a criminal record"],"a":1,"e":"S.35(1)(b): the officer must have reason to believe the person committed the offence and be satisfied that arrest is necessary for one of the listed reasons, recording reasons in writing. Arnesh Kumar v. State of Bihar (2014) requires strict compliance, failing which the officer faces departmental and contempt action."},{"id":"bnss-50","t":"Arrest","q":"Instead of arresting a person accused of an offence punishable with 4 years, the police officer serves a notice directing him to appear at the police station. The person complies. Can he still be arrested?","o":["Yes, at any time","Not unless the officer records reasons why arrest is necessary","Only on Sundays","Only after the charge-sheet"],"a":1,"e":"S.35(3)-(5): where arrest is not required, the officer issues a notice of appearance; a person who complies shall not be arrested unless, for reasons to be recorded, the officer is of the opinion that he ought to be arrested. Non-compliance may lead to arrest (S.35(6))."},{"id":"bnss-51","t":"Arrest","q":"A police officer wishes to arrest a 65-year-old man for an offence punishable with 2 years' imprisonment. What does the BNSS require?","o":["Nothing special","Prior permission of an officer not below the rank of Deputy Superintendent of Police","A warrant from the High Court","Permission of the District Magistrate"],"a":1,"e":"S.35(7) (new): no arrest shall be made without prior permission of an officer not below the rank of DSP in case of an offence punishable with imprisonment of less than three years, where the person is infirm or above sixty years of age."},{"id":"bnss-52","t":"Arrest","q":"A person is accused of a non-cognizable offence. Without a warrant or order of a Magistrate, can the police arrest him?","o":["Yes, if the complainant insists","No, except in the situation where he refuses to give his name and residence to an officer in whose presence he committed the offence","Yes, if the offence is serious","Yes, between sunrise and sunset"],"a":1,"e":"S.35(2): subject to S.39, no person concerned in a non-cognizable offence shall be arrested except under a warrant or order of a Magistrate. S.39 allows arrest where such a person refuses to give his name and residence or gives one believed to be false."},{"id":"bnss-53","t":"Arrest","q":"During an arrest, the police officer wears no name tag, prepares no memorandum, and does not tell the arrested man that a relative can be informed. Which legal requirements have been breached?","o":["None","All three duties under S.36: visible identification, a memorandum of arrest attested by a witness and countersigned by the arrestee, and informing him of the right to have a relative or friend told","Only the name-tag rule","Only the memorandum rule"],"a":1,"e":"S.36 (based on D.K. Basu guidelines, formerly S.41B CrPC) imposes all three duties on every police officer making an arrest."},{"id":"bnss-54","t":"Arrest","q":"The memorandum of arrest must be attested by:","o":["Two police officers","At least one witness who is a family member of the arrested person or a respectable member of the locality, and countersigned by the arrested person","The Magistrate","The Public Prosecutor"],"a":1,"e":"S.36(b): the memorandum shall be attested by at least one witness who is a member of the family of the person arrested or a respectable member of the locality, and countersigned by the person arrested."},{"id":"bnss-55","t":"Arrest","q":"Where can a relative find out whether a person has been arrested and for what offence?","o":["Only by filing a habeas corpus petition","From the police control room in every district and at State level, where names and addresses of arrested persons and the nature of the offence are displayed, including digitally","Only from the court","From the Public Prosecutor"],"a":1,"e":"S.37: the State Government establishes a police control room in every district and at State level and designates an officer not below the rank of Assistant Sub-Inspector to maintain and prominently display this information, including in digital mode."},{"id":"bnss-56","t":"Arrest","q":"The officer designated under S.37 to maintain information about arrests must be at least of the rank of:","o":["Head Constable","Assistant Sub-Inspector","Inspector","Deputy Superintendent of Police"],"a":1,"e":"S.37(b): a police officer not below the rank of Assistant Sub-Inspector is designated in every district and police station for this purpose."},{"id":"bnss-57","t":"Arrest","q":"An arrested person asks for his lawyer to be present while the police question him. The police say the lawyer may be present only for part of the questioning. Is this lawful?","o":["No, the lawyer must be present throughout","Yes; the arrested person is entitled to meet an advocate of his choice during interrogation, though not throughout the interrogation","No, lawyers are not allowed at all","Only if the offence is bailable"],"a":1,"e":"S.38 (formerly S.41D CrPC): when any person is arrested and interrogated by the police, he shall be entitled to meet an advocate of his choice during interrogation, though not throughout the interrogation."},{"id":"bnss-58","t":"Arrest","q":"A man commits a non-cognizable offence in front of a constable and, when asked, refuses to give his name and address. The constable may:","o":["Do nothing","Arrest him to ascertain his name and residence","Shoot him","Fine him on the spot"],"a":1,"e":"S.39(1): when a person accused of committing a non-cognizable offence in the presence of a police officer refuses on demand to give his name and residence, or gives one the officer believes to be false, he may be arrested so that his name or residence may be ascertained."},{"id":"bnss-59","t":"Arrest","q":"A person arrested under S.39 for refusing to give his name still does not give a true name and address. Within what time must he be sent to a Magistrate?","o":["6 hours","12 hours","24 hours from the arrest","48 hours"],"a":2,"e":"S.39(3): if the true name and residence are not ascertained within twenty-four hours from the time of arrest, or he fails to execute a bond, he shall be forwarded to the nearest Magistrate having jurisdiction."},{"id":"bnss-60","t":"Arrest","q":"A shopkeeper catches a man who has just snatched a chain from a customer in front of him. Can the shopkeeper lawfully arrest him?","o":["No, only police can arrest","Yes; any private person may arrest a person who in his presence commits a non-bailable and cognizable offence, or a proclaimed offender","Only if the man confesses","Only if the police are more than 5 km away"],"a":1,"e":"S.40(1): any private person may arrest or cause to be arrested any person who in his presence commits a non-bailable and cognizable offence, or any proclaimed offender, and hand him over to the police."},{"id":"bnss-61","t":"Arrest","q":"After a citizen's arrest under S.40, within what time must the arrested person be handed to the police?","o":["Immediately, and in any case within six hours","Within 12 hours","Within 24 hours","Within 48 hours"],"a":0,"e":"S.40(1): the private person shall, without unnecessary delay but within six hours from such arrest, make over the arrested person to a police officer or take him to the nearest police station. The six-hour limit is new in the BNSS."},{"id":"bnss-62","t":"Arrest","q":"A Judicial Magistrate sees an assault taking place outside her court in her jurisdiction. Can she arrest the assailant herself?","o":["No, Magistrates cannot arrest","Yes; when an offence is committed in the presence of a Magistrate (Executive or Judicial) within his local jurisdiction, he may himself arrest or order any person to arrest the offender","Only if a police officer is absent","Only Executive Magistrates can"],"a":1,"e":"S.41(1): when any offence is committed in the presence of a Magistrate, whether Executive or Judicial, within his local jurisdiction, he may himself arrest or order any person to arrest the offender, and may commit him to custody."},{"id":"bnss-63","t":"Arrest","q":"An Army officer is accused of an act done in the discharge of his official duties. He can be arrested for it:","o":["By any police officer","Only after obtaining the consent of the Central Government","Only after obtaining the consent of the State Government","Never"],"a":1,"e":"S.42(1): no member of the Armed Forces of the Union shall be arrested for anything done or purported to be done in the discharge of his official duties except after obtaining the consent of the Central Government."},{"id":"bnss-64","t":"Arrest","q":"A police officer tells X, \"You are under arrest.\" X says \"All right\" and walks with him. Was X validly arrested even though the officer never touched him?","o":["No, physical touch is essential","Yes; arrest is made by actually touching or confining the body unless there is submission to custody by word or action","No, a warrant was needed","Only if witnesses were present"],"a":1,"e":"S.43(1): in making an arrest the police officer shall actually touch or confine the body of the person to be arrested, unless there be a submission to the custody by word or action."},{"id":"bnss-65","t":"Arrest","q":"A woman is to be arrested. The BNSS provides that, unless circumstances indicate otherwise, a male police officer:","o":["May touch her to effect arrest","Shall not touch her; her submission to custody on oral intimation is presumed","Must handcuff her","Must obtain a court order first"],"a":1,"e":"Proviso to S.43(1): where a woman is to be arrested, unless the circumstances indicate to the contrary, her submission to custody on an oral intimation of arrest shall be presumed and the police officer shall not touch her unless the officer is a female."},{"id":"bnss-66","t":"Arrest","q":"Police want to arrest a woman at 11 pm. What does the law require?","o":["Nothing special","Save in exceptional circumstances, no woman shall be arrested after sunset and before sunrise; where exceptional circumstances exist, a woman police officer must obtain prior written permission of the Judicial Magistrate of the first class","Permission of the Superintendent of Police","Permission of the High Court"],"a":1,"e":"S.43(5): no woman shall be arrested after sunset and before sunrise save in exceptional circumstances, and then the woman police officer shall, by making a written report, obtain the prior permission of the Judicial Magistrate of the first class within whose local jurisdiction the offence is committed or the arrest is to be made."},{"id":"bnss-67","t":"Arrest","q":"Police handcuff an accused who has escaped from custody earlier and is charged with organised crime. Is this permitted?","o":["No, handcuffing is always illegal","Yes; S.43(3) permits handcuffs, keeping in view the nature and gravity of the offence, for a habitual or repeat offender who escaped from custody, or for offences such as organised crime, terrorism, drugs, arms, murder, rape, acid attack, human trafficking or offences against the State","Only with a court order","Only for foreigners"],"a":1,"e":"S.43(3) is new. Earlier, Prem Shankar Shukla v. Delhi Administration (1980) treated routine handcuffing as inhuman and required it to be the exception; the BNSS now lists the categories in which it may be used."},{"id":"bnss-68","t":"Arrest","q":"During arrest for a theft (punishable with 3 years), the police use force that kills the accused as he tries to flee. Was the use of lethal force justified under S.43?","o":["Yes, any force may be used to arrest","No; nothing in S.43 gives a right to cause the death of a person who is not accused of an offence punishable with death or imprisonment for life","Yes, if he resisted","Yes, if he was a repeat offender"],"a":1,"e":"S.43(4): nothing in this section gives a right to cause the death of a person who is not accused of an offence punishable with death or with imprisonment for life."},{"id":"bnss-69","t":"Arrest","q":"A person to be arrested has locked himself in a house. The police announce their authority and demand entry but are refused. They may:","o":["Not enter without a search warrant","Break open any outer or inner door or window to effect entry, after notifying their authority and purpose and demanding admittance","Enter only through the Magistrate","Wait until the person comes out"],"a":1,"e":"S.44(2): if ingress cannot be obtained after notification of authority and purpose and demand of admittance, the officer may break open any outer or inner door or window of the house. If the room is occupied by a woman in purdah, notice must be given and she must be given facility to withdraw."},{"id":"bnss-70","t":"Arrest","q":"A thief escapes from a police officer in Maharashtra and runs into Goa. Can the Maharashtra officer follow and arrest him there?","o":["No, he must inform Goa police and wait","Yes; a police officer may pursue a person whom he is authorised to arrest without warrant into any place in India","Only within 30 km","Only with a warrant"],"a":1,"e":"S.45: a police officer may, for the purpose of arresting without warrant any person whom he is authorised to arrest, pursue such person into any place in India."},{"id":"bnss-71","t":"Arrest","q":"An arrested person who is co-operating fully is tightly bound with ropes. This violates the rule that:","o":["Arrest must be in uniform","The person arrested shall not be subjected to more restraint than is necessary to prevent his escape","Ropes are prohibited","Only handcuffs may be used"],"a":1,"e":"S.46 (formerly S.49 CrPC): the person arrested shall not be subjected to more restraint than is necessary to prevent his escape."},{"id":"bnss-72","t":"Arrest","q":"A man is arrested without warrant for a bailable offence. What must the police officer tell him at once?","o":["Only the name of the police station","Full particulars of the offence and the grounds of arrest, and that he is entitled to be released on bail and may arrange sureties","Nothing until the charge-sheet","Only his right to silence"],"a":1,"e":"S.47: every police officer arresting without warrant shall forthwith communicate full particulars of the offence or other grounds for the arrest, and where the offence is bailable, inform the person that he is entitled to be released on bail. This gives effect to Article 22(1) of the Constitution."},{"id":"bnss-73","t":"Arrest","q":"An arrested person is told the grounds of arrest only orally. In which case did the Supreme Court hold that the grounds of arrest must be furnished in writing?","o":["Pankaj Bansal v. Union of India (2023)","D.K. Basu v. State of W.B.","Kiran Singh v. Chaman Paswan","Hakam Singh v. Gammon"],"a":0,"e":"Pankaj Bansal v. Union of India (2023), followed in Prabir Purkayastha v. State (NCT of Delhi) (2024), held that grounds of arrest must be communicated in writing so that the arrested person can seek legal advice and bail meaningfully."},{"id":"bnss-74","t":"Arrest","q":"After arresting a person, the police must inform someone about the arrest and the place of custody. Whom?","o":["Only the Magistrate","A friend, relative or other person nominated by the arrested person, and the designated police officer of the district; the fact must be entered in the police station book","The media","The Public Prosecutor"],"a":1,"e":"S.48 (formerly S.50A CrPC): the officer shall forthwith give information regarding the arrest and place of detention to any friend, relative or nominated person, inform the arrested person of this right, and record the entry in the book kept in the police station. The BNSS adds the designated police officer of the district."},{"id":"bnss-75","t":"Arrest","q":"A woman is arrested and must be searched. Who may conduct the search?","o":["Any police officer","Another female, with strict regard to decency","The Magistrate","A doctor"],"a":1,"e":"S.49(2): whenever it is necessary to cause a female to be searched, the search shall be made by another female with strict regard to decency."},{"id":"bnss-76","t":"Arrest","q":"A person is arrested on a charge of rape. The police want him medically examined for evidence. Who should examine him?","o":["Any police officer","A registered medical practitioner employed in a Government or local-authority hospital, or in his absence any other registered medical practitioner within 16 km","The Magistrate","Only a forensic laboratory"],"a":1,"e":"S.52(1): where there are reasonable grounds for believing that an examination will afford evidence, a registered medical practitioner employed in a hospital run by the Government or a local authority (or, in his absence, any other registered medical practitioner within a radius of sixteen kilometres) shall examine the arrested person at the request of a police officer."},{"id":"bnss-77","t":"Arrest","q":"A woman is arrested and must be medically examined soon after arrest. The examination must be conducted:","o":["By any doctor","By or under the supervision of a female medical officer (or a female registered medical practitioner if none is available)","By the woman police officer","By a male doctor in the presence of her lawyer"],"a":1,"e":"S.53(1) proviso: where the arrested person is a female, the examination of the body shall be made only by or under the supervision of a female medical officer, or a female registered medical practitioner if none is available."},{"id":"bnss-78","t":"Arrest","q":"Police want an eyewitness who is visually impaired to identify the arrested accused. What does the BNSS require for the identification?","o":["Nothing special","It shall take place under the supervision of a Judicial Magistrate, with steps to ensure the person identifies the accused in a suitable manner, and the process is video-graphed","It cannot be done","It must be done by the police alone"],"a":1,"e":"S.54: the Court may direct identification on request of the officer in charge; where the identifying person is mentally or physically disabled, the identification takes place under the supervision of a Judicial Magistrate and is video-graphed."},{"id":"bnss-79","t":"Arrest","q":"An arrested person in police custody falls seriously ill. Whose duty is it to look after his health and safety?","o":["His family","The person having custody of the accused, who must take reasonable care of his health and safety","The Public Prosecutor","The court only"],"a":1,"e":"S.56: it shall be the duty of the person having the custody of an accused to take reasonable care of the health and safety of the accused."},{"id":"bnss-80","t":"Arrest","q":"A person is arrested without warrant at 10 am on Monday. Excluding travel time, by when must he be produced before a Magistrate unless a Magistrate orders otherwise?","o":["Within 12 hours","By 10 am on Tuesday (24 hours)","Within 48 hours","Within 7 days"],"a":1,"e":"S.58 (and Article 22(2)): no police officer shall detain a person arrested without warrant for more than twenty-four hours, exclusive of the time necessary for the journey from the place of arrest to the Magistrate's court, in the absence of a special order of a Magistrate under S.187."},{"id":"bnss-81","t":"Arrest","q":"After arresting a person without warrant, the officer must take him without unnecessary delay before:","o":["The High Court","A Magistrate having jurisdiction or the officer in charge of a police station","The Sessions Judge","The District Collector only"],"a":1,"e":"S.57: a police officer making an arrest without warrant shall, without unnecessary delay and subject to the provisions as to bail, take or send the arrested person before a Magistrate having jurisdiction or before the officer in charge of a police station."},{"id":"bnss-82","t":"Arrest","q":"To whom must officers in charge of police stations report all arrests made without warrant in their area?","o":["The High Court","The District Magistrate, or the Sub-divisional Magistrate if the DM so directs","The Public Prosecutor","The Sessions Judge"],"a":1,"e":"S.59: officers in charge of police stations shall report to the District Magistrate, or if he so directs, to the Sub-divisional Magistrate, the cases of all persons arrested without warrant within their local limits, whether admitted to bail or otherwise."},{"id":"bnss-83","t":"Arrest","q":"A police officer wants to release a person arrested without warrant. He may do so only:","o":["On the arrested person's own bond, on bail, or under the special order of a Magistrate","On the complainant's request","After 24 hours automatically","On payment of a fine"],"a":0,"e":"S.60: no person who has been arrested by a police officer shall be discharged except on his own bond, or on bail, or under the special order of a Magistrate."},{"id":"bnss-84","t":"Arrest","q":"Which principle is stated in S.62 of the BNSS?","o":["Arrest may be made in any manner","No arrest shall be made except in accordance with the provisions of the Sanhita or any other law providing for arrest","Arrest always requires a warrant","Only Inspectors can arrest"],"a":1,"e":"S.62 (formerly S.60A CrPC) requires that every arrest be made strictly in accordance with the Sanhita or other law in force."},{"id":"bnss-85","t":"Arrest","q":"Which Supreme Court case laid down the detailed requirements for arrest and detention (identification of officers, arrest memo, informing a relative, medical examination) that were later written into the Code?","o":["D.K. Basu v. State of West Bengal (1997)","Maneka Gandhi v. Union of India","Kiran Singh v. Chaman Paswan","Lalita Kumari v. State of U.P."],"a":0,"e":"D.K. Basu laid down eleven requirements for arrest and custody; most were incorporated in Ss. 41B-41D CrPC by the 2009 amendment and now appear in Ss. 36-38 BNSS."},{"id":"bnss-86","t":"Arrest","q":"\"No arrest can be made because it is lawful for the police officer to do so; the existence of the power is one thing, the justification for exercising it is another.\" This observation is from:","o":["Joginder Kumar v. State of U.P. (1994)","Kiran Singh v. Chaman Paswan","Hakam Singh v. Gammon","Secretary of State v. Mask"],"a":0,"e":"Joginder Kumar v. State of U.P. (1994) held that arrest should not be made routinely on mere allegation; the officer must be satisfied that arrest is necessary and justified."},{"id":"bnss-87","t":"Arrest","q":"Arnesh Kumar v. State of Bihar (2014) is important because it:","o":["Abolished arrest in dowry cases","Directed police not to arrest automatically in offences punishable up to 7 years, to apply the S.41 (now S.35) checklist and record reasons, with departmental action and contempt for non-compliance","Allowed handcuffing","Made all offences bailable"],"a":1,"e":"Arnesh Kumar was decided in the context of S.498A IPC but applies to all offences punishable up to seven years; Magistrates must also check that the arrest was justified before authorising detention."},{"id":"bnss-88","t":"Summons","q":"A court issues a summons to an accused by e-mail bearing the image of the court's seal. Is this a valid form of summons?","o":["No, summons must be on paper","Yes; the BNSS allows summons in an encrypted or other form of electronic communication bearing the image of the seal of the Court or digital signature","Only with the accused's consent","Only in summons-cases"],"a":1,"e":"S.63: every summons shall be in writing, in duplicate, signed by the presiding officer and bear the seal of the Court, or be in an encrypted or any other form of electronic communication bearing the image of the seal of the Court or digital signature."},{"id":"bnss-89","t":"Summons","q":"Who may serve a summons issued by a criminal court?","o":["Only the complainant","A police officer, or subject to State rules, an officer of the Court issuing it or other public servant","Only the Public Prosecutor","Only a court bailiff"],"a":1,"e":"S.64(1): every summons shall be served by a police officer, or subject to such rules as the State Government may make, by an officer of the Court issuing it or other public servant."},{"id":"bnss-90","t":"Summons","q":"The serving officer meets the person summoned. How is personal service effected?","o":["By reading the summons aloud","By delivering or tendering to him one of the duplicates of the summons","By pasting it on his shirt","By sending it to his employer"],"a":1,"e":"S.64(2): the summons shall, if practicable, be served personally on the person summoned by delivering or tendering to him one of the duplicates of the summons."},{"id":"bnss-91","t":"Summons","q":"After receiving the summons, the person is asked to sign a receipt. Where is the receipt taken?","o":["On a separate stamp paper","On the back of the other duplicate of the summons","In the police station diary","On the charge-sheet"],"a":1,"e":"S.64(3): every person on whom a summons is so served shall, if so required by the serving officer, sign a receipt therefor on the back of the other duplicate."},{"id":"bnss-92","t":"Summons","q":"A summons is to be served on a private limited company. On whom can it be served?","o":["Any shareholder","The Director, Manager, Secretary or other officer of the company, or by registered post addressed to such officer at the principal office in India","Any employee at the gate","The company's auditor"],"a":1,"e":"S.65(1): service on a company or corporation may be effected by serving it on the Director, Manager, Secretary or other officer, or by letter sent by registered post addressed to the chief officer at the principal office in India; service is deemed effected when the letter would arrive in the ordinary course of post."},{"id":"bnss-93","t":"Summons","q":"A summons is to be served on a partnership firm. It may be served on:","o":["Any partner of the firm, or by registered post addressed to such partner","All partners together only","The Registrar of Firms","The firm's bank"],"a":0,"e":"S.65(2): service on a firm or other association of individuals may be effected by serving it on any partner of the firm, or by letter sent by registered post addressed to such partner."},{"id":"bnss-94","t":"Summons","q":"The person summoned cannot be found despite due diligence. His adult sister, who lives with him, is at home. Can the summons be left with her?","o":["No, only an adult male member of the family can receive it","Yes; the BNSS allows leaving the duplicate with some adult member of his family residing with him, male or female","No, only the police can hold it","Only if she signs an affidavit"],"a":1,"e":"S.66: where the person summoned cannot, by exercise of due diligence, be found, the summons may be served by leaving one of the duplicates with some adult member of his family residing with him. The CrPC's requirement of a \"male\" member has been dropped. A servant is not a member of the family."},{"id":"bnss-95","t":"Summons","q":"No one at the accused's house will accept the summons and he cannot be found. What should the serving officer do?","o":["Return it unserved and close the case","Affix one of the duplicates to some conspicuous part of the house in which the person ordinarily resides; the Court may then declare it duly served or order fresh service","Publish it in a newspaper","Arrest the accused"],"a":1,"e":"S.67: if service cannot be effected under Ss. 64, 65 or 66, the serving officer shall affix one of the duplicates to some conspicuous part of the house or homestead in which the person summoned ordinarily resides, and the Court, after inquiry, may declare the summons duly served or order fresh service."},{"id":"bnss-96","t":"Summons","q":"A summons is to be served on a government clerk at his workplace. The ordinary mode is to send it in duplicate to:","o":["The police station","The head of the office in which he is employed, who serves it and returns it with his signature","The District Magistrate","The Chief Secretary"],"a":1,"e":"S.68: the Court shall ordinarily send the summons in duplicate to the head of the office in which such person is employed, who shall cause it to be served in the manner provided by S.64 and return it to the Court with his signature as endorsement."},{"id":"bnss-97","t":"Summons","q":"A Pune court needs to serve a summons on a witness living in Lucknow. It should ordinarily send the summons in duplicate to:","o":["The Lucknow police commissioner","A Magistrate within whose local jurisdiction the person resides","The Allahabad High Court","The Sessions Judge at Lucknow"],"a":1,"e":"S.69: when a Court desires that a summons be served outside its local jurisdiction, it shall ordinarily send it in duplicate to a Magistrate within whose local jurisdiction the person summoned resides, or is, to be there served."},{"id":"bnss-98","t":"Summons","q":"The serving officer is not present at the hearing. How can the court be satisfied that the summons was served?","o":["It cannot; the case must be adjourned","By an affidavit purporting to be made before a Magistrate that the summons was served, together with a duplicate endorsed by the person served; the statements are deemed correct unless disproved","By the complainant's word","By a telephone call to the accused"],"a":1,"e":"S.70(1): an affidavit purporting to be made before a Magistrate that the summons has been served, and a duplicate purporting to be endorsed by the person served, are admissible in evidence and deemed correct unless the contrary is proved."},{"id":"bnss-99","t":"Summons","q":"A summons served electronically under the BNSS is:","o":["Of no legal effect","Considered duly served, and an attested copy is kept as proof of service","Valid only if the accused replies by e-mail","Valid only with the Magistrate's special order"],"a":1,"e":"S.70(2): service of summons by electronic communication under Ss. 64 to 71 shall be considered as duly served, and a copy of such summons shall be attested and kept as a proof of service."},{"id":"bnss-100","t":"Summons","q":"Besides the ordinary modes, how may a court additionally serve a summons on a witness?","o":["By public announcement","By electronic communication, or by registered post addressed to the witness at his place of residence or business","Through the accused","Through the complainant's lawyer"],"a":1,"e":"S.71(1): a Court issuing a summons to a witness may, in addition to the usual modes, direct a copy to be served by electronic communication or by registered post addressed to the witness at the place where he ordinarily resides, carries on business or works for gain."},{"id":"bnss-101","t":"Summons","q":"A witness refuses to accept the registered letter containing the summons and the postman endorses the refusal. The Court may:","o":["Issue a warrant immediately","Declare that the summons has been duly served","Drop the witness","Fine the postman"],"a":1,"e":"S.71(2): when an acknowledgment purporting to be signed by the witness, or an endorsement by a postal employee that the witness refused to take delivery, is received, the Court may declare that the summons has been duly served."},{"id":"bnss-102","t":"Warrants","q":"Which of the following is NOT a requirement for a valid warrant of arrest issued by a Court?","o":["It must be in writing","It must be signed by the presiding officer of the Court","It must bear the seal of the Court","It must be countersigned by the Public Prosecutor"],"a":3,"e":"S.72(1): every warrant of arrest issued by a Court shall be in writing, signed by the presiding officer and bear the seal of the Court. No countersignature by the prosecutor is required."},{"id":"bnss-103","t":"Warrants","q":"A warrant of arrest was issued two years ago and never executed. Is it still valid?","o":["No, warrants lapse after one year","Yes; a warrant remains in force until it is cancelled by the Court which issued it or until it is executed","No, warrants lapse after 30 days","Only if renewed every six months"],"a":1,"e":"S.72(2): every such warrant shall remain in force until it is cancelled by the Court which issued it, or until it is executed."},{"id":"bnss-104","t":"Warrants","q":"The court issuing a warrant endorses on it that the accused may be released if he executes a bond with two sureties of Rs 20,000 each. This is a:","o":["Non-bailable warrant","Bailable warrant under S.73","Proclamation","Summons"],"a":1,"e":"S.73(1): any Court issuing a warrant may direct by endorsement that if the person executes a bond with sufficient sureties for his attendance before the Court at a specified time, the officer shall take such security and release him from custody."},{"id":"bnss-105","t":"Warrants","q":"A warrant of arrest is ordinarily directed to:","o":["One or more police officers","The complainant","The Public Prosecutor","The jail superintendent"],"a":0,"e":"S.74(1): a warrant of arrest shall ordinarily be directed to one or more police officers; but where immediate execution is necessary and no police officer is available, the Court may direct it to any other person or persons."},{"id":"bnss-106","t":"Warrants","q":"A proclaimed offender is hiding in a village where there is no police officer nearby. A Magistrate of the first class may direct the warrant to:","o":["Only the Director General of Police","Any person within his local jurisdiction, in the case of an escaped convict, proclaimed offender, or person accused of a non-bailable offence evading arrest","No one but a police officer","The accused himself"],"a":1,"e":"S.75(1): the Chief Judicial Magistrate or a Magistrate of the first class may direct a warrant to any person within his local jurisdiction for the arrest of any escaped convict, proclaimed offender, or person accused of a non-bailable offence who is evading arrest."},{"id":"bnss-107","t":"Warrants","q":"A warrant is directed to Inspector A. He endorses the name of Sub-Inspector B on it. Can B execute it?","o":["No, only A can","Yes; a warrant directed to a police officer may be executed by any other police officer whose name is endorsed upon the warrant","Only if B is senior to A","Only with the Magistrate's fresh order"],"a":1,"e":"S.76: a warrant directed to any police officer may also be executed by any other police officer whose name is endorsed upon the warrant by the officer to whom it is directed or endorsed."},{"id":"bnss-108","t":"Warrants","q":"When executing a warrant, the police officer is bound to:","o":["Keep the contents secret","Notify the substance of the warrant to the person to be arrested and, if required, show him the warrant","Hand over the original to the accused permanently","Read out the entire charge-sheet"],"a":1,"e":"S.77: the police officer or other person executing a warrant of arrest shall notify the substance thereof to the person to be arrested, and, if so required, shall show him the warrant."},{"id":"bnss-109","t":"Warrants","q":"A person is arrested under a warrant. Within what time must he be produced before the Court that issued it (excluding journey time)?","o":["12 hours","24 hours","48 hours","7 days"],"a":1,"e":"S.78: the person arrested shall, without unnecessary delay, be brought before the Court before which he is required by law to be produced; such delay shall not in any case exceed twenty-four hours exclusive of the time necessary for the journey."},{"id":"bnss-110","t":"Warrants","q":"A warrant issued by a court in Kerala can be executed:","o":["Only in Kerala","Only in South India","At any place in India","Only within the sessions division"],"a":2,"e":"S.79: a warrant of arrest may be executed at any place in India."},{"id":"bnss-111","t":"Warrants","q":"A warrant is to be executed outside the jurisdiction of the issuing court. Instead of giving it to its own police officer, the court may forward it by post to:","o":["Any Executive Magistrate, District Superintendent of Police or Commissioner of Police within whose jurisdiction it is to be executed","The High Court","The Director General of Police only","The Governor"],"a":0,"e":"S.80(1): the Court may forward the warrant by post or otherwise to any Executive Magistrate or District Superintendent of Police or Commissioner of Police within whose local jurisdiction it is to be executed, who shall endorse his name and cause it to be executed."},{"id":"bnss-112","t":"Warrants","q":"A person is arrested in District B under a warrant issued by a court in District A, 200 km away. Before whom must he first be taken?","o":["Directly before the court in District A","Before the Executive Magistrate, District Superintendent of Police or Commissioner of Police in District B, unless the issuing court is within 30 km of the place of arrest or security is taken under S.73","Before the High Court","Before the nearest Judicial Magistrate in District B"],"a":1,"e":"S.82(2): unless the Court which issued the warrant is within thirty kilometres of the place of arrest, or is nearer than the Executive Magistrate/DSP/Commissioner, or security is taken under S.73, the arrested person shall be taken before such Magistrate or officer."},{"id":"bnss-113","t":"Warrants","q":"The person arrested is brought before the District SP of the arresting district. The offence is bailable and he offers bail. The SP:","o":["Must refuse bail","Shall take the bail or security and forward the bond to the Court which issued the warrant","Must send him to jail","Must try the case"],"a":1,"e":"S.83(2): if the offence is bailable and such person is ready and willing to give bail, or an endorsement under S.73 has been made, the Executive Magistrate, DSP or Commissioner shall take such bail or security and forward the bond to the Court which issued the warrant."},{"id":"bnss-114","t":"Proclamation","q":"A warrant has been issued against X but he has fled and cannot be found. What is the next step available to the court?","o":["Dismiss the case","Publish a written proclamation requiring X to appear at a specified place and time not less than 30 days from publication","Issue another warrant only","Convict X in absentia at once"],"a":1,"e":"S.84(1): if a Court has reason to believe that a person against whom a warrant has been issued has absconded or is concealing himself so that the warrant cannot be executed, it may publish a written proclamation requiring him to appear at a specified place and time not less than thirty days from the date of publishing."},{"id":"bnss-115","t":"Proclamation","q":"A court issues a proclamation requiring the absconder to appear within 20 days of publication. The proclamation is:","o":["Valid","Defective, because the time fixed must be not less than 30 days from the date of publication","Valid if the accused is a proclaimed offender","Valid in summons-cases"],"a":1,"e":"S.84(1) requires the appearance date to be not less than thirty days from the date of publishing the proclamation."},{"id":"bnss-116","t":"Proclamation","q":"Which of the following is required for valid publication of a proclamation?","o":["Public reading in a conspicuous place of the town or village where the person ordinarily resides","Affixing to a conspicuous part of the house in which he ordinarily resides","Affixing a copy to a conspicuous part of the Court-house","All three; the Court may also direct publication in a daily newspaper"],"a":3,"e":"S.84(2)(i) requires all three steps; S.84(2)(ii) permits the Court, in addition, to direct publication in a daily newspaper circulating in the place where the person ordinarily resides."},{"id":"bnss-117","t":"Proclamation","q":"After a proclamation, the Court records in writing that it was duly published on a specified day. The absconder later claims it was not. The Court's written statement is:","o":["Rebuttable","Conclusive evidence that the requirements of S.84 were complied with","Of no evidentiary value","Prima facie evidence only"],"a":1,"e":"S.84(3): a statement in writing by the Court issuing the proclamation that it was duly published on a specified day in the prescribed manner shall be conclusive evidence that the requirements have been complied with."},{"id":"bnss-118","t":"Proclamation","q":"X is accused of an offence punishable with 12 years' imprisonment and does not appear after proclamation. The Court may:","o":["Only issue another proclamation","Pronounce him a \"proclaimed offender\" after inquiry, since the offence is punishable with 10 years or more","Do nothing further","Declare him an absconder only if the offence is under the IPC"],"a":1,"e":"S.84(4): where the proclamation relates to a person accused of an offence punishable with imprisonment of ten years or more, life imprisonment or death, and he fails to appear, the Court may, after inquiry, pronounce him a proclaimed offender. The CrPC limited this to specific IPC sections."},{"id":"bnss-119","t":"Proclamation","q":"Immediately after issuing a proclamation, can the court attach the absconder's property?","o":["No, it must wait 30 days","Yes; the Court may order attachment at any time after issuing the proclamation, and even simultaneously if satisfied by affidavit that the person is about to dispose of or remove the property","Only after conviction","Only movable property"],"a":1,"e":"S.85(1): the Court may, for reasons recorded, at any time after the issue of the proclamation order attachment of any property belonging to the proclaimed person; the proviso allows simultaneous attachment where the person is about to dispose of or remove property from the jurisdiction."},{"id":"bnss-120","t":"Proclamation","q":"The absconder's property is agricultural land paying revenue to the State. Attachment is made:","o":["By the police taking possession","Through the Collector of the district in which the land is situate","By the Sessions Judge","By the Tehsildar personally"],"a":1,"e":"S.85(4): if the property is land paying revenue to the State Government, the attachment shall be made through the Collector of the district; in other cases by taking possession, appointing a receiver, prohibiting payment of rent, or a combination of these."},{"id":"bnss-121","t":"Proclamation","q":"The attached property consists of cattle and fresh vegetables. The Court may:","o":["Destroy them","Order immediate sale, the proceeds to abide the order of the Court","Hand them to the complainant","Keep them until trial"],"a":1,"e":"S.85(6): if the property ordered to be attached consists of live-stock or is of a perishable nature, the Court may, if it thinks it expedient, order it to be sold at once, and the proceeds shall abide the order of the Court."},{"id":"bnss-122","t":"Proclamation","q":"A proclaimed offender has property in a foreign country. What new provision of the BNSS allows action against it?","o":["None","On the written request of a police officer not below the rank of Superintendent of Police or Commissioner of Police, the Court may request assistance from a court or authority in the contracting State to identify, attach and forfeit the property","The Court may seize it directly","Interpol seizes it automatically"],"a":1,"e":"S.86 (new): the Court may initiate the process of requesting assistance from a Court or authority in a contracting State for identification, attachment and forfeiture of property belonging to a proclaimed person, in accordance with Chapter VIII."},{"id":"bnss-123","t":"Proclamation","q":"A third party claims that the attached property actually belongs to her and not to the absconder. Within what time must she object?","o":["30 days from attachment","3 months","6 months from the date of attachment","1 year"],"a":2,"e":"S.87(1): any person other than the proclaimed person whose property is attached may, within six months from the date of attachment, make a claim or objection on the ground that the claimant has an interest in the property and it is not liable to attachment."},{"id":"bnss-124","t":"Proclamation","q":"The absconder appears before the Court within the time stated in the proclamation. What happens to his attached property?","o":["It is sold","The Court shall make an order releasing it from attachment","It is forfeited to the State","It is given to the complainant"],"a":1,"e":"S.88(1): if the proclaimed person appears within the time specified in the proclamation, the Court shall make an order releasing the property from the attachment."},{"id":"bnss-125","t":"Proclamation","q":"The absconder does not appear. How soon can the attached (non-perishable) property be sold?","o":["Immediately","After 6 months from the date of attachment and after any claims or objections under S.87 are disposed of","After 30 days","After 2 years"],"a":1,"e":"S.88(2): the property shall not be sold until the expiration of six months from the date of attachment and until any claim or objection has been disposed of, unless it is perishable or the Court considers sale beneficial to the owner."},{"id":"bnss-126","t":"Proclamation","q":"Eighteen months after attachment the absconder is arrested and proves that he was abroad, never absconded and had no notice of the proclamation. He is entitled to:","o":["Nothing","Delivery of the property or the net proceeds of its sale, since he appeared within 2 years and proved he did not abscond","Only half the property","Compensation from the complainant"],"a":1,"e":"S.88(3): if within two years from the date of attachment the person appears voluntarily or is apprehended and proves that he did not abscond or conceal himself and had no notice of the proclamation, the property or the net proceeds of sale shall be delivered to him."},{"id":"bnss-127","t":"Proclamation","q":"The Court rejects an application for restoration of attached property. The aggrieved person may:","o":["Not appeal at all","Appeal to the Court to which appeals ordinarily lie from the sentences of that Court","Only file a writ petition","Only file a review"],"a":1,"e":"S.89: any person aggrieved by an order rejecting his application under S.88(3) may appeal to the Court to which appeals ordinarily lie from the sentences of the first-mentioned Court."},{"id":"bnss-128","t":"Correspondence","q":"Which CrPC provisions are merged into S.35 of the BNSS?","o":["Ss. 41 and 41A (arrest without warrant and notice of appearance)","S.46 (arrest how made)","S.50 (grounds of arrest)","S.57 (24-hour rule)"],"a":0,"e":"S.35 BNSS combines S.41 CrPC (when police may arrest without warrant) and S.41A (notice of appearance)."},{"id":"bnss-129","t":"Correspondence","q":"Which of the following is a change made by the BNSS compared with the CrPC in the chapter on arrest?","o":["A private person must hand over the arrested person within six hours","Prior permission of a DSP is needed to arrest an infirm person or a person above 60 for offences punishable with less than 3 years","Specific categories in which handcuffs may be used are listed","All of the above"],"a":3,"e":"All three are new: S.40 (six hours), S.35(7) (DSP permission) and S.43(3) (handcuffs)."},{"id":"bnss-130","t":"Correspondence","q":"Which statement about the BNSS provisions on proclamation is correct compared with the CrPC?","o":["The declaration of \"proclaimed offender\" is now possible for any offence punishable with 10 years or more, life or death, rather than only listed IPC sections","Proclamation now requires 60 days","Attachment of property has been abolished","Newspaper publication is now compulsory"],"a":0,"e":"S.84(4) BNSS broadens the proclaimed-offender declaration; the 30-day minimum, modes of publication and attachment provisions otherwise follow Ss. 82-86 CrPC, with S.86 BNSS adding assistance from foreign courts."}]},{"key":"labour","name":"Labour Law II","short":"Labour","scope":"Social Security Code 2020, Ss. 59-72 (maternity benefit)","topics":["Background","Definitions","S.59","S.60","S.61","S.62","S.63","S.64","S.65","S.66","S.67","S.68","S.69","S.70","S.71","S.72","Cases","Numbers"],"questions":[{"id":"labour-1","t":"Background","q":"A woman employee in a Mumbai factory claims paid leave for childbirth in 2026. The governing law is:","o":["The Maternity Benefit Act, 1961, which still stands alone","Chapter VI (Ss. 59-72) of the Code on Social Security, 2020, which has replaced the Maternity Benefit Act","The Factories Act, 1948","The Industrial Disputes Act, 1947"],"a":1,"e":"The Code on Social Security, 2020 subsumes the Maternity Benefit Act, 1961 (as amended in 2017). Chapter VI of the Code (Ss. 59-72) reproduces its scheme."},{"id":"labour-2","t":"Background","q":"The Code on Social Security, 2020 brings together how many earlier central laws?","o":["Four","Nine","Thirteen","Twenty-nine"],"a":1,"e":"Nine laws were merged: EPF Act 1952, ESI Act 1948, Employees' Compensation Act 1923, Maternity Benefit Act 1961, Payment of Gratuity Act 1972, Cine-Workers Welfare Fund Act 1981, Building and Other Construction Workers' Welfare Cess Act 1996, Unorganised Workers' Social Security Act 2008 and the Employment Exchanges (Compulsory Notification of Vacancies) Act 1959."},{"id":"labour-3","t":"Background","q":"Before 2017, how long was paid maternity leave in India, and what did the 2017 amendment do?","o":["6 weeks, raised to 12","12 weeks, raised to 26 weeks for the first two children; adoptive and commissioning mothers, work from home and creches were added","16 weeks, raised to 26","12 weeks, unchanged"],"a":1,"e":"The Maternity Benefit (Amendment) Act, 2017 raised the period to 26 weeks (12 weeks for a woman with two or more surviving children) and added the other provisions, all of which the Code carries forward."},{"id":"labour-4","t":"Background","q":"Which Directive Principle of the Constitution asks the State to make provision for maternity relief?","o":["Article 39","Article 41","Article 42","Article 43"],"a":2,"e":"Article 42: the State shall make provision for securing just and humane conditions of work and for maternity relief."},{"id":"labour-5","t":"Background","q":"An employer argues that giving paid leave only to women is discriminatory under Article 14. The strongest constitutional answer is:","o":["Article 14 does not apply to private employers","Article 15(3) expressly permits the State to make special provisions for women and children","Article 19(1)(g) protects the employer","Maternity benefit is not a law"],"a":1,"e":"Article 15(3) allows special provisions for women; combined with Article 42, it justifies protective legislation such as maternity benefit."},{"id":"labour-6","t":"Background","q":"A boutique employs 8 persons on all days of the year. Must it give maternity benefit under Chapter VI of the Code?","o":["Yes, every shop is covered","No; a shop or establishment is covered only if 10 or more employees are employed, or were employed on any day of the preceding 12 months","Yes if it is in a city","Only if registered under the Shops Act"],"a":1,"e":"Under the First Schedule, Chapter VI applies to every factory, mine or plantation (including Government establishments) and to every shop or establishment in which ten or more employees are employed, or were employed on any day of the preceding twelve months. A smaller shop is outside the Code (State law may still apply)."},{"id":"labour-7","t":"Background","q":"Which ILO Convention sets the international standard on maternity protection?","o":["Convention No. 87 (freedom of association)","Convention No. 100 (equal remuneration)","Convention No. 183 (Maternity Protection Convention, 2000)","Convention No. 138 (minimum age)"],"a":2,"e":"ILO Convention No. 183 of 2000 (revising Nos. 3 and 103) prescribes a minimum of 14 weeks of maternity leave and protection against dismissal."},{"id":"labour-8","t":"Definitions","q":"A pregnancy ends naturally in the 24th week. For the purposes of maternity benefit this is a:","o":["Delivery","Miscarriage, since expulsion of the contents of the uterus prior to or during the 26th week is a miscarriage","Medical termination of pregnancy","Premature birth"],"a":1,"e":"The Code defines miscarriage as expulsion of the contents of a pregnant uterus at any period prior to or during the twenty-sixth week of pregnancy, excluding any miscarriage the causing of which is punishable under the penal law."},{"id":"labour-9","t":"Definitions","q":"A woman gives birth to a stillborn child after 30 weeks. Is this a \"delivery\" entitling her to maternity benefit?","o":["No, only a live birth counts","Yes; \"delivery\" means the birth of a child, and \"child\" includes a stillborn child","Only if she has worked 240 days","Only miscarriage leave applies"],"a":1,"e":"Under S.2 of the Code, \"child\" for the purposes of Chapter VI includes a stillborn child, and \"delivery\" means the birth of a child. So she gets full maternity benefit, not merely miscarriage leave."},{"id":"labour-10","t":"Definitions","q":"A woman whose egg was used to create an embryo implanted in a surrogate is called, under the Code, a:","o":["Adoptive mother","Commissioning mother","Foster mother","Surrogate"],"a":1,"e":"The Code defines commissioning mother as a biological mother who uses her egg to create an embryo implanted in any other woman; she gets 12 weeks' maternity benefit from the date the child is handed over (S.60(4))."},{"id":"labour-11","t":"Definitions","q":"When the Code speaks of \"medical termination of pregnancy\", it means termination permissible under:","o":["The Indian Penal Code","The Medical Termination of Pregnancy Act, 1971","The Surrogacy (Regulation) Act, 2021","The Factories Act, 1948"],"a":1,"e":"The definition refers to termination of pregnancy permissible under the Medical Termination of Pregnancy Act, 1971."},{"id":"labour-12","t":"Definitions","q":"A woman complains that her employer has withheld maternity benefit. The officer under the Code who can inquire and direct payment is the:","o":["Labour Inspector","Inspector-cum-Facilitator","Conciliation Officer","Welfare Officer"],"a":1,"e":"The Code replaces the \"Inspector\" of the old Acts with the Inspector-cum-Facilitator, who both enforces and advises on compliance; under S.72 this officer directs payment of maternity benefit improperly withheld."},{"id":"labour-13","t":"S.59","q":"A woman wants to return to work three weeks after delivery to earn wages. The employer, knowing this, lets her work. Who has contravened the Code?","o":["Only the woman","Both: the employer must not knowingly employ a woman during the six weeks after delivery, and the woman must not work in any establishment during that period","Only the employer","Neither, as it was voluntary"],"a":1,"e":"S.59(1): no employer shall knowingly employ a woman in any establishment during the six weeks immediately following the day of her delivery, miscarriage or medical termination of pregnancy. S.59(2): no woman shall work in any establishment during those six weeks."},{"id":"labour-14","t":"S.59","q":"The six-week prohibition on employment after an event applies after:","o":["Delivery only","Delivery or miscarriage only","Delivery, miscarriage or medical termination of pregnancy","Tubectomy only"],"a":2,"e":"S.59(1) and (2) cover the six weeks immediately following the day of delivery, miscarriage or medical termination of pregnancy."},{"id":"labour-15","t":"S.59","q":"A pregnant worker asks to be moved from a job that requires standing for eight hours. The employer refuses. Is the refusal lawful?","o":["Yes, the employer decides work allocation","No; on her request, a pregnant woman must not be required to do work of an arduous nature, involving long hours of standing, or likely to interfere with her pregnancy or the normal development of the foetus, during the protected period","Yes unless a doctor certifies","Only if she agrees to a pay cut"],"a":1,"e":"S.59(3): no pregnant woman shall, on a request being made by her, be required to do any work which is of an arduous nature or involves long hours of standing or is likely to interfere with her pregnancy or the normal development of the foetus or cause miscarriage or otherwise adversely affect her health."},{"id":"labour-16","t":"S.59","q":"For how long before delivery does the protection against arduous work under S.59(3) apply?","o":["The whole pregnancy","The one month immediately preceding the six weeks before the expected delivery, plus any part of those six weeks for which she does not take leave","Only the last week","Only after she gives notice"],"a":1,"e":"S.59(4): the period is (a) the one month immediately preceding the period of six weeks before the date of her expected delivery, and (b) any period during the said six weeks for which she does not avail of leave under S.62."},{"id":"labour-17","t":"S.60","q":"A woman joined on 1 January and her expected delivery date is 15 September of the same year. She worked on 95 days during that time. Is she eligible for maternity benefit?","o":["No, she needs one year of service","Yes; she has actually worked for not less than 80 days in the 12 months immediately preceding the expected date of delivery","No, she needs 240 days","Only if she is a permanent employee"],"a":1,"e":"S.60(2): the only qualifying condition is actual work for not less than eighty days in the twelve months immediately preceding the date of expected delivery. Permanency is not required (Municipal Corporation of Delhi v. Female Workers, 2000)."},{"id":"labour-18","t":"S.60","q":"In counting the 80 days of actual work, which of these days are included?","o":["Only days physically present","Days actually worked plus days of lay-off and paid holidays declared under any law","Only days paid in cash","Only the last month's working days"],"a":1,"e":"Explanation to S.60(2): the days on which a woman has actually worked include days for which she has been laid off or was on holidays declared under any law with wages during the preceding twelve months."},{"id":"labour-19","t":"S.60","q":"A woman with one child is expecting her second. For how long is she entitled to maternity benefit, and how much of it can be taken before delivery?","o":["12 weeks, 6 before","26 weeks, of which not more than 8 weeks before the expected date of delivery","26 weeks, all after delivery","18 weeks, 9 before"],"a":1,"e":"S.60(3): the maximum period is twenty-six weeks, of which not more than eight weeks shall precede the date of expected delivery. The reduced 12-week limit applies only to a woman with two or more surviving children."},{"id":"labour-20","t":"S.60","q":"A woman already has two surviving children and is expecting her third. Her maternity benefit is:","o":["26 weeks","12 weeks, of which not more than 6 weeks before the expected date of delivery","8 weeks","Nil"],"a":1,"e":"Proviso to S.60(3): the maximum period for a woman having two or more surviving children shall be twelve weeks, of which not more than six weeks shall precede the date of her expected delivery."},{"id":"labour-21","t":"S.60","q":"A woman has two children, one of whom has died. For her next pregnancy she gets:","o":["12 weeks, because she has had two children","26 weeks, because the 12-week limit applies only when there are two or more surviving children","8 weeks","18 weeks"],"a":1,"e":"The proviso to S.60(3) refers to \"two or more surviving children\". With only one surviving child, the full 26 weeks apply."},{"id":"labour-22","t":"S.60","q":"A woman dies two weeks into her maternity benefit period, before delivery. The employer's liability is:","o":["For the full 26 weeks","Only for the days up to and including the day of her death","Nil","For 12 weeks"],"a":1,"e":"Second proviso to S.60(3): where a woman dies during the period, the maternity benefit is payable only for the days up to and including the day of her death."},{"id":"labour-23","t":"S.60","q":"A woman dies during delivery, leaving the child alive. The employer must pay maternity benefit for:","o":["Only up to the day of her death","The entire period","Six weeks","Nothing"],"a":1,"e":"Second proviso to S.60(3): where the woman, having been delivered of a child, dies during her delivery or during the period immediately following, leaving behind the child, the employer is liable for the entire period; if the child also dies, up to and including the day of the child's death."},{"id":"labour-24","t":"S.60","q":"A woman legally adopts a 2-month-old baby. She is entitled to maternity benefit for:","o":["26 weeks","12 weeks from the date the child is handed over to her","6 weeks","No benefit, as she did not give birth"],"a":1,"e":"S.60(4): a woman who legally adopts a child below the age of three months, or a commissioning mother, is entitled to maternity benefit for twelve weeks from the date the child is handed over."},{"id":"labour-25","t":"S.60","q":"A woman adopts a child aged 5 months. Under the Code she is entitled to:","o":["12 weeks of maternity benefit","No maternity benefit under S.60(4), because the adopted child must be below three months of age","26 weeks","6 weeks"],"a":1,"e":"S.60(4) applies only where the adopted child is below the age of three months."},{"id":"labour-26","t":"S.60","q":"Maternity benefit is paid at what rate?","o":["The minimum wage","Half the average daily wage","The average daily wage for the period of her actual absence","Basic pay only, excluding allowances"],"a":2,"e":"S.60(1): every woman is entitled to maternity benefit at the rate of the average daily wage for the period of her actual absence, i.e., the period immediately preceding the day of delivery, the day of delivery, and the period immediately following."},{"id":"labour-27","t":"S.60","q":"How is \"average daily wage\" worked out?","o":["Wages of the last week divided by 7","The average of wages payable for the days she worked during the three calendar months immediately preceding the date of absence, subject to the minimum wage under the Code on Wages, 2019","Annual salary divided by 365","The highest wage in the year"],"a":1,"e":"Explanation to S.60(1): average daily wage means the average of the woman's wages payable for the days on which she worked during the three calendar months immediately preceding the date from which she absents herself on account of maternity, subject to the minimum rate of wage fixed under the Code on Wages, 2019."},{"id":"labour-28","t":"S.60","q":"A woman's computed average daily wage is lower than the statutory minimum wage. She must be paid maternity benefit at:","o":["The computed lower rate","At least the minimum rate of wage fixed under the Code on Wages, 2019","Half the minimum wage","The ESI rate"],"a":1,"e":"The average daily wage is \"subject to the minimum rate of wage fixed or revised under the Code on Wages, 2019\", so the minimum wage acts as a floor."},{"id":"labour-29","t":"S.60","q":"After her 26 weeks, a software developer asks to work from home for a few more months. The Code:","o":["Prohibits it","Allows the employer to permit work from home, where the nature of work permits, on conditions mutually agreed between the employer and the woman","Makes it compulsory for the employer","Allows it only for government employees"],"a":1,"e":"S.60(5): where the nature of work assigned to a woman is such that she may work from home, the employer may allow her to do so after availing the maternity benefit, for such period and on such conditions as may be mutually agreed."},{"id":"labour-30","t":"S.61","q":"A woman is entitled to maternity benefit under Chapter VI. ESI (Chapter IV) becomes applicable to her factory the next month. Does she lose her claim against the employer?","o":["Yes, immediately","No; she continues to be entitled under Chapter VI until she becomes qualified to claim maternity benefit under S.32 (ESI)","Yes, unless she opts out of ESI","She loses it only if her wages exceed the ESI ceiling"],"a":1,"e":"S.61: every woman entitled to maternity benefit under this Chapter shall, notwithstanding the application of Chapter IV to the establishment, continue to be so entitled until she becomes qualified to claim maternity benefit under S.32."},{"id":"labour-31","t":"S.62","q":"To claim maternity benefit, what should a woman give the employer?","o":["A court order","A notice in writing in the prescribed form stating that the benefit be paid to her or her nominee and that she will not work in any establishment during the benefit period","A medical certificate only","Nothing; it is automatic"],"a":1,"e":"S.62(1): the notice in writing states that maternity benefit and any other amount may be paid to her or her nominee, and that she will not work in any establishment during the period for which she receives maternity benefit."},{"id":"labour-32","t":"S.62","q":"A pregnant woman's notice must state the date from which she will be absent. That date cannot be earlier than:","o":["Four weeks before the expected delivery","Eight weeks before the expected date of delivery","Twelve weeks before","The date of delivery itself"],"a":1,"e":"S.62(2): in the case of a pregnant woman the notice shall state the date from which she will be absent from work, not being a date earlier than eight weeks from the date of her expected delivery."},{"id":"labour-33","t":"S.62","q":"A woman delivers a baby before she could give any notice. Can she still claim?","o":["No, notice before delivery is compulsory","Yes; a woman who has not given notice while pregnant may give it as soon as possible after delivery","Only within 48 hours","Only through the trade union"],"a":1,"e":"S.62(3): any woman who has not given the notice when she was pregnant may give such notice as soon as possible after the delivery."},{"id":"labour-34","t":"S.62","q":"When should the employer pay the portion of maternity benefit relating to the period before the expected delivery?","o":["After delivery","In advance, on production of proof that the woman is pregnant","At the end of the financial year","Only after the baby is born"],"a":1,"e":"S.62(5): the amount of maternity benefit for the period preceding the date of her expected delivery shall be paid in advance by the employer on production of such proof as may be prescribed that the woman is pregnant."},{"id":"labour-35","t":"S.62","q":"The woman produces proof of delivery on Monday morning. The balance maternity benefit must be paid by:","o":["The same day","Within 48 hours of production of proof of delivery","Within 7 days","Within 30 days"],"a":1,"e":"S.62(5): the amount due for the subsequent period shall be paid by the employer within forty-eight hours of production of such proof as may be prescribed that the woman has been delivered of a child."},{"id":"labour-36","t":"S.62","q":"A woman never gave the written notice. The employer refuses maternity benefit for that reason alone. Is the refusal valid?","o":["Yes","No; failure to give notice does not disentitle a woman who is otherwise entitled, and the Inspector-cum-Facilitator may order payment","Yes unless she had a lawyer","Yes if she is a casual worker"],"a":1,"e":"S.62(6): the failure to give notice shall not disentitle a woman to maternity benefit or any other amount if she is otherwise entitled; the Inspector-cum-Facilitator may order payment within such period as may be prescribed."},{"id":"labour-37","t":"S.63","q":"A woman entitled to maternity benefit dies before receiving it. The employer must pay the amount to:","o":["The State Government","The person nominated in her notice, and if there is no nominee, her legal representative","The employer keeps it","The ESI Corporation"],"a":1,"e":"S.63: if a woman entitled to maternity benefit or any other amount dies before receiving it, the employer shall pay it to the person nominated by her in the notice under S.62, and if there is no such nominee, to her legal representative."},{"id":"labour-38","t":"S.64","q":"The employer provides no free pre-natal or post-natal care. In addition to maternity benefit, the woman is entitled to a medical bonus of:","o":["Rs 1,000","Rs 2,500","Rs 3,500, or such amount as the Central Government notifies","Rs 10,000"],"a":2,"e":"S.64: every woman entitled to maternity benefit shall also be entitled to receive from her employer a medical bonus of three thousand five hundred rupees, or such amount as may be notified by the Central Government, if no pre-natal confinement and post-natal care is provided by the employer free of charge."},{"id":"labour-39","t":"S.64","q":"The employer runs a free hospital that provides full pre-natal and post-natal care to women workers. Must it also pay the medical bonus?","o":["Yes, always","No; the medical bonus is payable only where no pre-natal confinement and post-natal care is provided free of charge","Yes, at half the rate","Only to women with two children"],"a":1,"e":"S.64 makes the medical bonus conditional on the employer not providing free pre-natal confinement and post-natal care."},{"id":"labour-40","t":"S.65","q":"A woman suffers a miscarriage. On producing proof she is entitled to leave with wages at the rate of maternity benefit for:","o":["Two weeks","Four weeks","Six weeks immediately following the day of miscarriage","Twelve weeks"],"a":2,"e":"S.65(1): in case of miscarriage or medical termination of pregnancy, a woman is entitled, on production of prescribed proof, to leave with wages at the rate of maternity benefit for six weeks immediately following the day of her miscarriage or termination."},{"id":"labour-41","t":"S.65","q":"A woman undergoes a tubectomy operation. She is entitled to leave with wages for:","o":["One week","Two weeks immediately following the operation","Four weeks","Six weeks"],"a":1,"e":"S.65(2): in case of tubectomy operation, a woman shall, on production of prescribed proof, be entitled to leave with wages at the rate of maternity benefit for a period of two weeks immediately following the day of her tubectomy operation."},{"id":"labour-42","t":"S.65","q":"After delivery a woman develops an illness arising out of the delivery and needs more time off. Beyond her 26 weeks she can get additional leave with wages for a maximum of:","o":["Two weeks","One month","Two months","Six months"],"a":1,"e":"S.65(3): a woman suffering from illness arising out of pregnancy, delivery, premature birth, miscarriage, medical termination of pregnancy or tubectomy operation is entitled, in addition to the other periods, to leave with wages at the rate of maternity benefit for a maximum period of one month."},{"id":"labour-43","t":"S.66","q":"A woman returns to work after delivery. Besides the usual rest interval, how many nursing breaks is she entitled to each day, and until when?","o":["One break until the child is 6 months","Two breaks of prescribed duration until the child attains the age of 15 months","Three breaks until the child is 1 year","Unlimited breaks until the child is 2"],"a":1,"e":"S.66: every woman delivered of a child who returns to duty shall, in addition to the interval for rest allowed to her, be allowed in the course of her daily work two breaks of the prescribed duration for nursing the child until the child attains the age of fifteen months."},{"id":"labour-44","t":"S.67","q":"An IT company employs 60 people. Must it provide a creche?","o":["No, creches are only for factories","Yes; every establishment covered by Chapter VI with 50 employees (or such number as prescribed) must provide a creche within the prescribed distance, separately or along with common facilities","Only if 20 of them are women","Only if the employees demand it"],"a":1,"e":"S.67(1): every establishment to which this Chapter applies, in which fifty employees or such number as may be prescribed by the Central Government are employed, shall have the facility of creche within the prescribed distance, either separately or along with common facilities."},{"id":"labour-45","t":"S.67","q":"A mother working in an establishment with a creche asks to visit her baby during the day. The employer must allow:","o":["One visit","Two visits","Four visits a day, including the interval for rest","Visits only during lunch"],"a":2,"e":"Proviso to S.67(1): the employer shall allow four visits a day to the creche by the woman, which shall also include the interval for rest allowed to her."},{"id":"labour-46","t":"S.67","q":"When must an establishment tell a newly joined woman employee about the maternity benefits available to her?","o":["Only when she becomes pregnant","At the time of her initial appointment, in writing and electronically","Only on the notice board","Only if she asks"],"a":1,"e":"S.67(2): every establishment shall intimate in writing and electronically to every woman at the time of her initial appointment regarding every benefit available under this Chapter."},{"id":"labour-47","t":"S.68","q":"An employer serves a notice of termination on a woman on maternity leave, expiring during her leave. The notice is:","o":["Valid","Unlawful; it is unlawful to discharge or dismiss her during or on account of such absence, or to give notice expiring during it, or to vary her service conditions to her disadvantage","Valid if one month's pay is given","Valid if she is a probationer"],"a":1,"e":"S.68(1) makes all three unlawful: discharge or dismissal during or on account of the absence, a notice of discharge or dismissal expiring during such absence, and varying the conditions of service to her disadvantage."},{"id":"labour-48","t":"S.68","q":"A woman is dismissed while pregnant for an ordinary lapse (not gross misconduct). Does she still get maternity benefit and medical bonus?","o":["No, dismissal ends all rights","Yes; discharge or dismissal during pregnancy does not deprive her of maternity benefit or medical bonus, unless it is for gross misconduct as prescribed","Only maternity benefit, not the bonus","Only if she is reinstated"],"a":1,"e":"S.68(2): the discharge or dismissal of a woman during her pregnancy shall not have the effect of depriving her of the maternity benefit or medical bonus; the proviso allows the employer, by written order, to deprive her of either or both only where the dismissal is for gross misconduct as prescribed by the Central Government."},{"id":"labour-49","t":"S.68","q":"A woman is deprived of maternity benefit by a written order alleging gross misconduct. Within what time may she appeal, and to whom?","o":["30 days, to the civil court","60 days from communication of the order, to the authority prescribed","90 days, to the Labour Court","There is no appeal"],"a":1,"e":"S.68(3): any woman deprived of maternity benefit or medical bonus, or discharged or dismissed during or on account of her absence, may within sixty days from the date the order is communicated appeal to such authority as may be prescribed, whose decision is final."},{"id":"labour-50","t":"S.69","q":"A woman is given lighter work during pregnancy and takes nursing breaks after returning. The employer deducts wages for both. The deduction is:","o":["Permitted","Prohibited; no deduction from her normal and usual daily wages can be made by reason only of the nature of work assigned under S.59(3) or the nursing breaks under S.66","Permitted for breaks but not lighter work","Permitted with notice"],"a":1,"e":"S.69: no deduction from the normal and usual daily wages of a woman shall be made by reason only of the nature of the work assigned to her under S.59(3), or breaks for nursing the child allowed under S.66."},{"id":"labour-51","t":"S.70","q":"During her authorised maternity absence a woman takes up paid work at another establishment. The consequence is:","o":["Imprisonment","She forfeits her claim to maternity benefit for the period during which she so works","Dismissal is automatic","Nothing"],"a":1,"e":"S.70: if a woman works in any establishment for remuneration during any period for which she has been permitted by the employer to absent herself under S.62, she shall forfeit her claim to the maternity benefit for such period."},{"id":"labour-52","t":"S.71","q":"What must an employer display in every part of the establishment where women are employed?","o":["The wage register","An abstract of the provisions of Chapter VI and the rules, in the language or languages of the locality, in a conspicuous place","The attendance register","Photographs of creche facilities"],"a":1,"e":"S.71: an abstract of the provisions of this Chapter and the rules relating thereto, in the language or languages of the locality, shall be exhibited in a conspicuous place by the employer in every part of the establishment in which women are employed."},{"id":"labour-53","t":"S.72","q":"A woman's maternity benefit is improperly withheld. To whom can she complain, and what can that officer do?","o":["Only the civil court, which can award damages","The Inspector-cum-Facilitator
