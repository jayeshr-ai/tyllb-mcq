 of the person to be arrested unless:","o":["The person is a woman","There is a submission to the custody by word or action","The offence is bailable","A warrant has been issued"],"a":1,"e":"S.43(1): the officer shall actually touch or confine the body unless there be a submission to the custody by word or action. For a woman, unless circumstances indicate otherwise, her submission on oral intimation is presumed and the officer shall not touch her unless he is a woman officer."},{"id":"bnss-70","t":"Arrest","q":"Under S.43(3), handcuffs may be used, keeping in view the nature and gravity of the offence, in the case of:","o":["A habitual or repeat offender who escaped from custody","A person accused of organised crime, terrorist act, murder, rape, acid attack or offences against the State","Both (a) and (b)","Any accused"],"a":2,"e":"S.43(3) is new: handcuffs may be used for a habitual or repeat offender who escaped from custody, or a person who committed organised crime, terrorist act, drug-related crime, illegal possession of arms, murder, rape, acid attack, counterfeiting, human trafficking, sexual offences against children or offences against the State."},{"id":"bnss-71","t":"Arrest","q":"Under S.43(4), the police officer has no right to cause the death of a person who is not accused of an offence punishable with:","o":["Imprisonment of 7 years","Death or imprisonment for life","Fine","Imprisonment of 3 years"],"a":1,"e":"S.43(4): nothing in the section gives a right to cause the death of a person who is not accused of an offence punishable with death or with imprisonment for life."},{"id":"bnss-72","t":"Arrest","q":"Ordinarily no woman shall be arrested:","o":["On a public holiday","After sunset and before sunrise","Without a lawyer present","Without permission of the High Court"],"a":1,"e":"S.43(5): save in exceptional circumstances, no woman shall be arrested after sunset and before sunrise. Where such circumstances exist, a woman police officer shall obtain prior permission in writing of the Judicial Magistrate of the first class within whose local jurisdiction the offence is committed or the arrest is to be made."},{"id":"bnss-73","t":"Arrest","q":"Under S.44, a police officer with authority to arrest may break open a door or window to enter a place if:","o":["He has a warrant only","Free ingress cannot otherwise be obtained after notification of authority and demand for admittance","The owner is absent","The offence is cognizable"],"a":1,"e":"S.44(2): if ingress cannot be obtained after notifying his authority and purpose and duly demanding admittance, the officer may break open any outer or inner door or window. Apartments of a woman in purdah require notice and reasonable facility to withdraw."},{"id":"bnss-74","t":"Arrest","q":"Under S.45, a police officer may pursue a person whom he is authorised to arrest without warrant:","o":["Only within the police station limits","Only within the district","Into any place in India","Only within the State"],"a":2,"e":"S.45: a police officer may, for the purpose of arresting without warrant any person whom he is authorised to arrest, pursue such person into any place in India."},{"id":"bnss-75","t":"Arrest","q":"S.46 of the BNSS provides that the person arrested shall not be subjected to:","o":["Interrogation","More restraint than is necessary to prevent his escape","Medical examination","Identification parade"],"a":1,"e":"S.46 (old S.49 CrPC): the person arrested shall not be subjected to more restraint than is necessary to prevent his escape."},{"id":"bnss-76","t":"Arrest","q":"The person arrested must be informed of the grounds of arrest and right to bail under:","o":["S.43","S.47","S.53","S.58"],"a":1,"e":"S.47 (old S.50 CrPC): every police officer arresting without warrant shall forthwith communicate full particulars of the offence and grounds of arrest, and inform a person arrested for a bailable offence that he is entitled to be released on bail. This reflects Article 22(1)."},{"id":"bnss-77","t":"Arrest","q":"The Supreme Court held that the grounds of arrest must be furnished to the arrested person in writing in:","o":["Pankaj Bansal v. Union of India (2023)","D.K. Basu v. State of W.B.","Kiran Singh v. Chaman Paswan","Hakam Singh v. Gammon"],"a":0,"e":"Pankaj Bansal v. Union of India (2023), followed in Prabir Purkayastha v. State (NCT of Delhi) (2024), held that grounds of arrest must be communicated in writing to make the right under Article 22(1) meaningful."},{"id":"bnss-78","t":"Arrest","q":"Under S.48, the police officer must inform about the arrest and the place of detention to:","o":["Only the Magistrate","A friend, relative or person nominated by the arrested person, and the designated police officer of the district","The media","The Public Prosecutor"],"a":1,"e":"S.48 (old S.50A CrPC): the officer shall forthwith give information of the arrest and place of detention to any friend, relative or nominated person, inform the arrested person of this right, and record the fact in the police station book. The BNSS adds informing the designated police officer in the district."},{"id":"bnss-79","t":"Arrest","q":"Under S.49, the search of a female arrested person shall be made by:","o":["Any police officer","Another female, with strict regard to decency","The Magistrate","A doctor"],"a":1,"e":"S.49(2): whenever it is necessary to cause a female to be searched, the search shall be made by another female with strict regard to decency."},{"id":"bnss-80","t":"Arrest","q":"Under S.52, a person accused of rape shall be examined by:","o":["A police officer","A registered medical practitioner employed in a hospital run by the Government or local authority (or, in his absence, any other registered medical practitioner)","The Magistrate","A forensic expert only"],"a":1,"e":"S.52(1): when a person is arrested on a charge of rape and there are reasonable grounds for believing that an examination will afford evidence, a registered medical practitioner employed in a Government or local-authority hospital (or any other registered medical practitioner within a radius of sixteen kilometres if none is available) shall examine him at the request of a police officer."},{"id":"bnss-81","t":"Arrest","q":"Under S.53, soon after arrest, the arrested person shall be examined by a medical officer in the service of the Government, and a female arrestee shall be examined:","o":["By or under the supervision of a female medical officer","By a police officer","By a male doctor only","Not at all"],"a":0,"e":"S.53(1) proviso: where the arrested person is a female, the examination of the body shall be made only by or under the supervision of a female medical officer (or a female registered medical practitioner if none is available)."},{"id":"bnss-82","t":"Arrest","q":"Under S.54, identification of the arrested person (test identification) may be directed by:","o":["The Court, on the request of the officer in charge of the police station","The Public Prosecutor","The complainant","The jail superintendent"],"a":0,"e":"S.54: where identification by any person is considered necessary, the Court having jurisdiction may, on request of the officer in charge of a police station, direct the identification in such manner as it thinks fit. If the identifying person is mentally or physically disabled, it is done under supervision of a Judicial Magistrate and video-graphed."},{"id":"bnss-83","t":"Arrest","q":"Under S.56, the person having custody of the accused is required to:","o":["Take reasonable care of the health and safety of the accused","Provide a lawyer","Release him within 12 hours","Take him to a hospital daily"],"a":0,"e":"S.56 (old S.55A CrPC): it shall be the duty of the person having the custody of an accused to take reasonable care of the health and safety of the accused."},{"id":"bnss-84","t":"Arrest","q":"A person arrested without warrant cannot be detained by the police for more than:","o":["12 hours","24 hours exclusive of journey time","48 hours","72 hours"],"a":1,"e":"S.58 (old S.57 CrPC): no police officer shall detain in custody a person arrested without warrant for a longer period than is reasonable; in the absence of a special order of a Magistrate under S.187, it shall not exceed twenty-four hours exclusive of the time necessary for the journey to the Magistrate. This reflects Article 22(2)."},{"id":"bnss-85","t":"Arrest","q":"Under S.57, a person arrested without warrant shall be taken before:","o":["A Magistrate having jurisdiction or the officer in charge of a police station, without unnecessary delay","The High Court","The Sessions Judge only","The District Magistrate only"],"a":0,"e":"S.57: a police officer making an arrest without warrant shall, without unnecessary delay and subject to the provisions as to bail, take or send the person arrested before a Magistrate having jurisdiction or before the officer in charge of a police station."},{"id":"bnss-86","t":"Arrest","q":"Under S.59, officers in charge of police stations shall report cases of all persons arrested without warrant to:","o":["The High Court","The District Magistrate, or if he so directs, the Sub-divisional Magistrate","The Public Prosecutor","The Sessions Judge"],"a":1,"e":"S.59 (old S.58 CrPC): officers in charge of police stations shall report to the District Magistrate (or, if he so directs, the SDM) the cases of all persons arrested without warrant within their local limits, whether admitted to bail or otherwise."},{"id":"bnss-87","t":"Arrest","q":"Under S.60, a person arrested by a police officer shall be discharged only:","o":["On his own bond, on bail, or under the special order of a Magistrate","On the order of the Sessions Judge","After 24 hours automatically","On payment of fine"],"a":0,"e":"S.60 (old S.59 CrPC): no person who has been arrested by a police officer shall be discharged except on his own bond, or on bail, or under the special order of a Magistrate."},{"id":"bnss-88","t":"Arrest","q":"S.62 of the BNSS provides that:","o":["Arrest may be made in any manner","No arrest shall be made except in accordance with the provisions of the Sanhita","Arrest requires a warrant always","Arrest can be made only by Inspectors"],"a":1,"e":"S.62 (old S.60A CrPC): no arrest shall be made except in accordance with the provisions of this Sanhita or any other law for the time being in force providing for arrest."},{"id":"bnss-89","t":"Arrest","q":"Guidelines to be followed at the time of arrest were laid down by the Supreme Court in:","o":["D.K. Basu v. State of West Bengal","Maneka Gandhi v. Union of India","Kiran Singh v. Chaman Paswan","Lalita Kumari v. State of U.P."],"a":0,"e":"D.K. Basu v. State of West Bengal (1997) laid down eleven requirements (identification of officers, arrest memo, informing a relative, medical examination, etc.), many of which were later incorporated into Ss. 41B-41D CrPC and now Ss. 36-38 BNSS."},{"id":"bnss-90","t":"Arrest","q":"In which case did the Supreme Court hold that no arrest should be made merely because it is lawful to do so, and that the police must justify the arrest?","o":["Joginder Kumar v. State of U.P. (1994)","Kiran Singh v. Chaman Paswan","Hakam Singh v. Gammon","Secretary of State v. Mask"],"a":0,"e":"Joginder Kumar v. State of U.P. (1994): no arrest can be made because it is lawful for the police officer to do so; the existence of the power is one thing, the justification for exercising it is quite another."},{"id":"bnss-91","t":"Arrest","q":"Arnesh Kumar v. State of Bihar (2014) is a landmark on:","o":["Handcuffing","Avoiding automatic arrest in offences punishable up to seven years and use of notice of appearance","Bail in dowry death cases","Confessions"],"a":1,"e":"In Arnesh Kumar the Supreme Court directed that police must not arrest automatically in cases under S.498A IPC or other offences punishable up to seven years, must satisfy themselves under S.41 CrPC (now S.35 BNSS) and record reasons, failing which they face departmental action and contempt."},{"id":"bnss-92","t":"Arrest","q":"Handcuffing of an undertrial as a routine was condemned by the Supreme Court in:","o":["Prem Shankar Shukla v. Delhi Administration","Joginder Kumar v. State of U.P.","Arnesh Kumar v. State of Bihar","Sheela Barse v. State of Maharashtra"],"a":0,"e":"Prem Shankar Shukla v. Delhi Administration (1980): handcuffing is prima facie inhuman and should be the exception, justified only where there is a clear danger of escape."},{"id":"bnss-93","t":"Summons","q":"Under S.63, a summons issued by a court shall be:","o":["Oral","In writing, in duplicate, signed and sealed, or in encrypted electronic form","In triplicate","Signed by the Public Prosecutor"],"a":1,"e":"S.63: every summons shall be in writing, in duplicate, signed by the presiding officer (or an officer authorised by the High Court) and bear the seal of the Court, or be in an encrypted or any other form of electronic communication bearing the image of the seal of the Court or digital signature."},{"id":"bnss-94","t":"Summons","q":"Under S.64, a summons is served by:","o":["Only a police officer","A police officer, or an officer of the court issuing it, or other public servant, subject to rules","Only the complainant","Only through the Magistrate"],"a":1,"e":"S.64(1): every summons shall be served by a police officer, or subject to rules made by the State Government, by an officer of the Court issuing it or other public servant. S.64(2) adds service by electronic communication in the prescribed form."},{"id":"bnss-95","t":"Summons","q":"Under S.64(2), the summons shall, if practicable, be served personally by:","o":["Reading it aloud","Delivering or tendering to him one of the duplicates","Pasting it on the door","Sending it to his employer"],"a":1,"e":"S.64(2): the summons shall, if practicable, be served personally on the person summoned by delivering or tendering to him one of the duplicates of the summons."},{"id":"bnss-96","t":"Summons","q":"Under S.64(3), the person served must, if the serving officer so requires:","o":["Pay a fee","Sign a receipt on the back of the other duplicate","Appear immediately","Give a bond"],"a":1,"e":"S.64(3): every person on whom a summons is so served shall, if so required by the serving officer, sign a receipt therefor on the back of the other duplicate."},{"id":"bnss-97","t":"Summons","q":"Service of summons on a company may be effected on:","o":["Any shareholder","The Director, Manager, Secretary or other officer","Any employee","The auditor"],"a":1,"e":"S.65(1): service on a company or corporation may be effected by serving it on the Director, Manager, Secretary or other officer, or by registered post addressed to such officer at the principal office in India; service is deemed effected when the letter would arrive in ordinary course of post."},{"id":"bnss-98","t":"Summons","q":"Under S.65(2), service of summons on a firm or association of persons may be effected on:","o":["Any partner of the firm or by registered post to the partner","Only all partners","The registrar of firms","A customer"],"a":0,"e":"S.65(2): service on a firm or other association of individuals may be effected by serving it on any partner of such firm or association, or by letter sent by registered post addressed to such partner."},{"id":"bnss-99","t":"Summons","q":"Where the person summoned cannot be found, summons may be left with:","o":["Any adult male member of the family only","Some adult member of his family residing with him","His servant","His neighbour"],"a":1,"e":"S.66: where the person summoned cannot by exercise of due diligence be found, the summons may be served by leaving one of the duplicates with some adult member of his family residing with him. The CrPC said \"adult male member\"; the BNSS drops \"male\". A servant is not a member of the family."},{"id":"bnss-100","t":"Summons","q":"Under S.67, where service cannot be effected as provided in Ss. 64, 65 and 66, the serving officer shall:","o":["Return the summons to the court unserved","Affix one of the duplicates to some conspicuous part of the house in which the person ordinarily resides","Publish it in a newspaper","Arrest the person"],"a":1,"e":"S.67: the serving officer shall affix one of the duplicates of the summons to some conspicuous part of the house or homestead in which the person summoned ordinarily resides; the Court may then declare the summons duly served or order fresh service."},{"id":"bnss-101","t":"Summons","q":"Summons to a Government servant is ordinarily sent to:","o":["The police station","The head of the office in which he is employed","The District Magistrate","His residence only"],"a":1,"e":"S.68: the Court shall ordinarily send the summons in duplicate to the head of the office in which such person is employed, who shall cause it to be served in the manner provided in S.64 and return it with his signature as endorsement."},{"id":"bnss-102","t":"Summons","q":"Under S.69, when a court desires a summons to be served outside its local jurisdiction, it shall ordinarily send it in duplicate to:","o":["The High Court","A Magistrate within whose local jurisdiction the person resides or is","The Director General of Police","The Sessions Judge"],"a":1,"e":"S.69: the Court shall ordinarily send such summons in duplicate to a Magistrate within whose local jurisdiction the person summoned resides, or is, to be there served."},{"id":"bnss-103","t":"Summons","q":"Under S.70, where the serving officer is not present at the hearing, service may be proved by:","o":["An affidavit before a Magistrate and a duplicate endorsed by the person to whom the summons was delivered","Oral statement of the complainant","A telephone call","A newspaper cutting"],"a":0,"e":"S.70(1): an affidavit purporting to be made before a Magistrate that the summons has been served, and a duplicate purporting to be endorsed by the person to whom it was delivered, is admissible in evidence and the statements are deemed correct unless the contrary is proved."},{"id":"bnss-104","t":"Summons","q":"Under S.70(2), a summons served by electronic communication under Ss. 64 to 71 is:","o":["Invalid","Considered as duly served, and a copy attested is kept as proof","Valid only with the consent of the accused","Valid only in summons-cases"],"a":1,"e":"S.70(2): the service of summons in electronic communication under Ss. 64 to 71 shall be considered as duly served and a copy of such summons shall be attested and kept as a proof of service."},{"id":"bnss-105","t":"Summons","q":"Under S.71, a summons to a witness may, in addition to the usual mode, be served by:","o":["Electronic communication or registered post","Only through the police","Only through the complainant","Telephone only"],"a":0,"e":"S.71(1): a Court may, in addition to the modes in Ss. 64-69, direct a copy of the summons to a witness to be served by electronic communication or by registered post addressed to the witness at his place of residence or business."},{"id":"bnss-106","t":"Summons","q":"Under S.71(2), where the witness refuses to take delivery of the registered post, the Court may:","o":["Issue a warrant","Declare that the summons has been duly served","Dismiss the case","Send it again by courier"],"a":1,"e":"S.71(2): when an acknowledgment purporting to be signed by the witness, or an endorsement by a postal employee that the witness refused delivery, is received, the Court may declare that the summons has been duly served."},{"id":"bnss-107","t":"Warrants","q":"Under S.72, every warrant of arrest issued by a Court shall be:","o":["Oral","In writing, signed by the presiding officer and bearing the seal of the Court","Signed by the police officer","Published in the Gazette"],"a":1,"e":"S.72(1): every warrant of arrest issued by a Court under this Sanhita shall be in writing, signed by the presiding officer of such Court and shall bear the seal of the Court."},{"id":"bnss-108","t":"Warrants","q":"A warrant of arrest remains in force until:","o":["30 days from issue","One year from issue","It is cancelled by the issuing court or executed","The trial ends"],"a":2,"e":"S.72(2): every such warrant shall remain in force until it is cancelled by the Court which issued it, or until it is executed."},{"id":"bnss-109","t":"Warrants","q":"A \"bailable warrant\" under S.73 means a warrant in which the Court directs by endorsement that:","o":["The person be released on executing a bond with sufficient sureties for his attendance","The person be kept in custody","No bail be granted","The police may use handcuffs"],"a":0,"e":"S.73(1): any Court issuing a warrant may direct by endorsement that if the person executes a bond with sufficient sureties for his attendance before the Court at a specified time, the officer shall take such security and release him from custody."},{"id":"bnss-110","t":"Warrants","q":"Under S.74, a warrant of arrest shall ordinarily be directed to:","o":["One or more police officers","The complainant","The Public Prosecutor","The jail superintendent"],"a":0,"e":"S.74(1): a warrant of arrest shall ordinarily be directed to one or more police officers; where no police officer is immediately available, the Court may direct it to any other person(s)."},{"id":"bnss-111","t":"Warrants","q":"Under S.75, a Chief Judicial Magistrate or a Magistrate of the first class may direct a warrant to any person for the arrest of:","o":["Any accused","An escaped convict, a proclaimed offender, or a person accused of a non-bailable offence who is evading arrest","Only a proclaimed offender","A witness"],"a":1,"e":"S.75(1): the CJM or JMFC may direct a warrant to any person within his local jurisdiction for the arrest of any escaped convict, proclaimed offender or person accused of a non-bailable offence who is evading arrest."},{"id":"bnss-112","t":"Warrants","q":"Under S.76, a warrant directed to a police officer may be executed by:","o":["Only that officer","Any other police officer whose name is endorsed on the warrant by the officer to whom it is directed","Any private person","The complainant"],"a":1,"e":"S.76: a warrant directed to any police officer may also be executed by any other police officer whose name is endorsed upon the warrant by the officer to whom it is directed or endorsed."},{"id":"bnss-113","t":"Warrants","q":"Under S.77, the police officer executing a warrant shall:","o":["Notify the substance of the warrant to the person to be arrested and show him the warrant if required","Keep the warrant secret","Hand over the warrant to the accused permanently","Read the entire charge-sheet"],"a":0,"e":"S.77: the officer or other person executing a warrant shall notify the substance thereof to the person to be arrested, and, if so required, shall show him the warrant."},{"id":"bnss-114","t":"Warrants","q":"Under S.78, a person arrested under a warrant shall be brought before the Court without unnecessary delay, which shall not exceed:","o":["12 hours","24 hours exclusive of journey time","48 hours","7 days"],"a":1,"e":"S.78: subject to S.73 as to security, the person arrested shall without unnecessary delay be brought before the Court before which he is required to be produced; such delay shall not, in any case, exceed twenty-four hours exclusive of the time necessary for the journey."},{"id":"bnss-115","t":"Warrants","q":"A warrant of arrest may be executed:","o":["Only within the district","Only within the State","At any place in India","Only within the sessions division"],"a":2,"e":"S.79: a warrant of arrest may be executed at any place in India."},{"id":"bnss-116","t":"Warrants","q":"Under S.80, when a warrant is to be executed outside the local jurisdiction of the issuing Court, it may be forwarded to:","o":["An Executive Magistrate, District Superintendent of Police or Commissioner of Police within whose jurisdiction it is to be executed","The High Court","The Director General of Police only","The Governor"],"a":0,"e":"S.80(1): the Court may, instead of directing the warrant to a police officer, forward it by post or otherwise to any Executive Magistrate or District Superintendent of Police or Commissioner of Police within whose local jurisdiction it is to be executed."},{"id":"bnss-117","t":"Warrants","q":"When a warrant is executed outside the district, the arrested person must be taken before the Executive Magistrate, District SP or Commissioner of Police unless the issuing court is within:","o":["10 kilometres","30 kilometres","50 kilometres","100 kilometres"],"a":1,"e":"S.82(2): unless the Court which issued the warrant is within thirty kilometres of the place of arrest, or is nearer than the Executive Magistrate/DSP/Commissioner, or security is taken under S.73, the person shall be taken before such Magistrate or officer."},{"id":"bnss-118","t":"Warrants","q":"Under S.83, when the arrested person is brought before the Executive Magistrate, District SP or Commissioner, and the offence is bailable and he is ready to give bail, that authority:","o":["Shall take the bail and forward the bond to the issuing Court","Must refuse bail","Must send him to jail","Must try the case"],"a":0,"e":"S.83(2): if the offence is bailable and such person is ready and willing to give bail, or a bailable-warrant endorsement under S.73 is made, the Magistrate, DSP or Commissioner shall take such bail or security and forward the bond to the Court which issued the warrant."},{"id":"bnss-119","t":"Proclamation","q":"A proclamation under S.84 can be issued when a Court has reason to believe that a person against whom a warrant has been issued:","o":["Is a foreigner","Has absconded or is concealing himself so that the warrant cannot be executed","Is ill","Is a minor"],"a":1,"e":"S.84(1): if any Court has reason to believe (whether after taking evidence or not) that a person against whom a warrant has been issued has absconded or is concealing himself so that the warrant cannot be executed, it may publish a written proclamation."},{"id":"bnss-120","t":"Proclamation","q":"A proclamation under S.84 must require the person to appear at a time not less than ____ from the date of publication:","o":["15 days","30 days","60 days","90 days"],"a":1,"e":"S.84(1): the proclamation requires the person to appear at a specified place and at a specified time not less than thirty days from the date of publishing such proclamation."},{"id":"bnss-121","t":"Proclamation","q":"Under S.84(2), the proclamation shall be published by:","o":["Public reading in a conspicuous place of the town or village","Affixing to a conspicuous part of the house where the person ordinarily resides","Affixing a copy to a conspicuous part of the Court-house","All of the above"],"a":3,"e":"S.84(2)(i) requires all three modes; S.84(2)(ii) additionally allows the Court to direct publication in a daily newspaper circulating in the place where the person ordinarily resides."},{"id":"bnss-122","t":"Proclamation","q":"A person may be declared a \"proclaimed offender\" under S.84(4) if accused of an offence punishable with:","o":["Imprisonment of 3 years or more","Imprisonment of 7 years or more","Imprisonment of 10 years or more, life imprisonment or death","Any offence"],"a":2,"e":"S.84(4): where the proclamation relates to a person accused of an offence punishable with imprisonment of ten years or more, or imprisonment for life, or death, under the BNS or any other law, and he fails to appear, the Court may pronounce him a proclaimed offender. The CrPC limited this to specified IPC sections."},{"id":"bnss-123","t":"Proclamation","q":"Under S.84(3), a statement in writing by the Court that the proclamation was duly published on a specified day is:","o":["Not admissible","Conclusive evidence of compliance with S.84","Rebuttable by the accused","Only prima facie evidence"],"a":1,"e":"S.84(3): a statement in writing by the Court issuing the proclamation to the effect that it was duly published on a specified day in the prescribed manner shall be conclusive evidence that the requirements have been complied with."},{"id":"bnss-124","t":"Proclamation","q":"Attachment of property of a person absconding is provided under:","o":["S.84","S.85","S.87","S.89"],"a":1,"e":"S.85(1): the Court issuing a proclamation under S.84 may, for reasons recorded in writing, at any time after the issue of the proclamation, order attachment of any property, movable or immovable, belonging to the proclaimed person."},{"id":"bnss-125","t":"Proclamation","q":"Under S.85, attachment may be ordered simultaneously with the proclamation if the Court is satisfied that the person:","o":["Is about to dispose of the whole or part of his property","Is about to remove the property from the local jurisdiction","Either (a) or (b)","Is a foreigner"],"a":2,"e":"Proviso to S.85(1): where the Court is satisfied by affidavit or otherwise that the person is about to dispose of the property or remove it from the local jurisdiction, it may order attachment simultaneously with the issue of the proclamation."},{"id":"bnss-126","t":"Proclamation","q":"Under S.85, attachment of immovable property is made, where the property is land paying revenue to the State Government, through:","o":["The Collector of the district","The police","The Sessions Judge","The Tehsildar only"],"a":0,"e":"S.85(4): if the property is land paying revenue to the State Government, attachment shall be made through the Collector of the district in which the land is situate; in all other cases by taking possession, appointing a receiver, prohibiting payment of rent, or a combination of these."},{"id":"bnss-127","t":"Proclamation","q":"Under S.85(6), if the attached property is perishable or live-stock, the Court may:","o":["Destroy it","Order its immediate sale and hold the proceeds","Return it to the accused","Give it to the complainant"],"a":1,"e":"S.85(6): if the property ordered to be attached consists of live-stock or is of a perishable nature, the Court may order it to be sold at once, and the proceeds shall abide the order of the Court."},{"id":"bnss-128","t":"Proclamation","q":"Which section, new in the BNSS, provides for identification and attachment of property of a proclaimed person (including abroad)?","o":["S.84","S.86","S.88","S.89"],"a":1,"e":"S.86: the Court may, on a written request from a police officer not below the rank of Superintendent of Police or Commissioner of Police, initiate the process of requesting assistance from a Court or authority in a contracting State for identification, attachment and forfeiture of property belonging to a proclaimed person, in accordance with Chapter VIII."},{"id":"bnss-129","t":"Proclamation","q":"Claims and objections to attachment under S.87 must be preferred within ____ from the date of attachment:","o":["30 days","3 months","6 months","1 year"],"a":2,"e":"S.87(1): any person other than the proclaimed person whose property is attached may, within six months from the date of such attachment, make a claim or objection on the ground that the claimant has an interest in the property and it is not liable to attachment."},{"id":"bnss-130","t":"Proclamation","q":"Under S.88(1), if the proclaimed person appears within the time specified in the proclamation, the Court shall:","o":["Sell the property","Make an order releasing the property from attachment","Forfeit the property to the State","Impose a fine"],"a":1,"e":"S.88(1): if the proclaimed person appears within the time specified in the proclamation, the Court shall make an order releasing the property from the attachment."},{"id":"bnss-131","t":"Proclamation","q":"Under S.88(2), attached property shall not be sold until the expiry of ____ from the date of attachment:","o":["One month","Three months","Six months","Two years"],"a":2,"e":"S.88(2): the property shall not be sold until the expiration of six months from the date of attachment and until any claim or objection under S.87 has been disposed of, unless it is perishable or the Court considers sale beneficial to the owner."},{"id":"bnss-132","t":"Proclamation","q":"Under S.88, attached property or its net proceeds shall be restored if the person appears within ____ from the date of attachment and proves he did not abscond:","o":["6 months","1 year","2 years","3 years"],"a":2,"e":"S.88(3): if within two years from the date of attachment the person appears voluntarily or is apprehended and proves to the satisfaction of the Court that he did not abscond and had no notice of the proclamation, the property or the net proceeds of sale shall be delivered to him."},{"id":"bnss-133","t":"Proclamation","q":"An appeal from an order rejecting an application for restoration of attached property lies under:","o":["S.86","S.87","S.88","S.89"],"a":3,"e":"S.89: any person aggrieved by an order rejecting his application for restoration under S.88(3) may appeal to the Court to which appeals ordinarily lie from the sentences of the first-mentioned Court."},{"id":"bnss-134","t":"Correspondence","q":"S.35 of the BNSS corresponds to which sections of the CrPC?","o":["Ss. 41 and 41A","S.46","S.50","S.57"],"a":0,"e":"S.35 BNSS merges S.41 (when police may arrest without warrant) and S.41A (notice of appearance) of the CrPC."},{"id":"bnss-135","t":"Correspondence","q":"S.58 of the BNSS (detention not exceeding 24 hours) corresponds to which section of the CrPC?","o":["S.50","S.56","S.57","S.60A"],"a":2,"e":"S.58 BNSS corresponds to S.57 CrPC. Ss. 35-62 BNSS correspond to Ss. 41-60A CrPC."},{"id":"bnss-136","t":"Correspondence","q":"Proclamation for a person absconding under S.84 BNSS corresponds to which section of the CrPC?","o":["S.82","S.83","S.84","S.85"],"a":0,"e":"S.84 BNSS = S.82 CrPC (proclamation); S.85 BNSS = S.83 CrPC (attachment); S.87 BNSS = S.84 CrPC (claims and objections); S.88 BNSS = S.85 CrPC (release, sale and restoration)."}]},{"key":"labour","name":"Labour Law II","short":"Labour","scope":"Social Security Code 2020, Ss. 59-72 (maternity benefit)","topics":["Background","Definitions","S.59","S.60","S.61","S.62","S.63","S.64","S.65","S.66","S.67","S.68","S.69","S.70","S.71","S.72","Cases","Numbers"],"questions":[{"id":"labour-1","t":"Background","q":"Chapter VI of the Code on Social Security, 2020 deals with:","o":["Gratuity","Maternity benefit","Employees' compensation","Employees' State Insurance"],"a":1,"e":"Chapter VI (Ss. 59 to 72) of the Code on Social Security, 2020 contains the provisions on maternity benefit. Chapter V is gratuity, Chapter IV is ESI and Chapter VII is employee's compensation."},{"id":"labour-2","t":"Background","q":"Chapter VI of the Code corresponds to which repealed enactment?","o":["Payment of Gratuity Act, 1972","Maternity Benefit Act, 1961","Factories Act, 1948","Equal Remuneration Act, 1976"],"a":1,"e":"The Code subsumes nine central labour laws including the Maternity Benefit Act, 1961 (as amended in 2017); Chapter VI reproduces its scheme."},{"id":"labour-3","t":"Background","q":"The Code on Social Security, 2020 consolidates how many central labour laws?","o":["Four","Nine","Thirteen","Twenty-nine"],"a":1,"e":"The Code amalgamates nine laws: the EPF Act 1952, ESI Act 1948, Employees' Compensation Act 1923, Maternity Benefit Act 1961, Payment of Gratuity Act 1972, Cine-Workers Welfare Fund Act 1981, Building and Other Construction Workers' Welfare Cess Act 1996, Unorganised Workers' Social Security Act 2008 and the Employment Exchanges Act 1959."},{"id":"labour-4","t":"Background","q":"The Maternity Benefit (Amendment) Act, 2017 raised the period of maternity benefit from:","o":["6 weeks to 12 weeks","12 weeks to 26 weeks","12 weeks to 18 weeks","16 weeks to 26 weeks"],"a":1,"e":"The 2017 amendment increased paid maternity leave from 12 weeks to 26 weeks for the first two children, and introduced benefits for adoptive and commissioning mothers, work from home and creche facilities. The Code carries these forward."},{"id":"labour-5","t":"Background","q":"Which Article of the Constitution directs the State to make provision for maternity relief?","o":["Article 39","Article 41","Article 42","Article 43"],"a":2,"e":"Article 42 (a Directive Principle): the State shall make provision for securing just and humane conditions of work and for maternity relief."},{"id":"labour-6","t":"Background","q":"Maternity benefit legislation is also supported by which constitutional provision permitting special provisions for women?","o":["Article 14","Article 15(3)","Article 16(4)","Article 19(1)(g)"],"a":1,"e":"Article 15(3) allows the State to make special provisions for women and children, which justifies protective legislation such as maternity benefit."},{"id":"labour-7","t":"Background","q":"Under the First Schedule, Chapter VI applies to every shop or establishment in which ____ or more employees are employed, or were employed on any day of the preceding 12 months:","o":["5","10","20","50"],"a":1,"e":"Chapter VI applies to every establishment being a factory, mine or plantation (including Government establishments) and to every shop or establishment in which ten or more employees are employed or were employed on any day of the preceding twelve months."},{"id":"labour-8","t":"Background","q":"The ILO Convention dealing with maternity protection is:","o":["Convention No. 87","Convention No. 100","Convention No. 183 (2000)","Convention No. 138"],"a":2,"e":"ILO Maternity Protection Convention, 2000 (No. 183) revises the earlier Conventions Nos. 3 (1919) and 103 (1952) and prescribes a minimum of 14 weeks of maternity leave."},{"id":"labour-9","t":"Definitions","q":"\"Miscarriage\" means expulsion of the contents of a pregnant uterus at any period prior to or during the ____ week of pregnancy:","o":["12th","20th","26th","30th"],"a":2,"e":"The Code defines miscarriage as expulsion of the contents of a pregnant uterus at any period prior to or during the twenty-sixth week of pregnancy, but excludes any miscarriage the causing of which is punishable under the penal law."},{"id":"labour-10","t":"Definitions","q":"Under the Code, \"child\" includes:","o":["Only a living child","A stillborn child","Only an adopted child","None of these"],"a":1,"e":"S.2 of the Code: \"child\", for the purposes of Chapter VI, includes a stillborn child. \"Delivery\" means the birth of a child."},{"id":"labour-11","t":"Definitions","q":"A \"commissioning mother\" is:","o":["A woman who adopts a child","A biological mother who uses her egg to create an embryo implanted in any other woman","A woman working on commission basis","A surrogate"],"a":1,"e":"The Code defines commissioning mother as a biological mother who uses her egg to create an embryo implanted in any other woman (i.e., through surrogacy). She is entitled to 12 weeks of maternity benefit under S.60(4)."},{"id":"labour-12","t":"Definitions","q":"\"Medical termination of pregnancy\" under the Code means termination permissible under:","o":["The Indian Penal Code","The Medical Termination of Pregnancy Act, 1971","The Surrogacy Act, 2021","The Factories Act, 1948"],"a":1,"e":"The Code refers to termination of pregnancy permissible under the provisions of the Medical Termination of Pregnancy Act, 1971."},{"id":"labour-13","t":"Definitions","q":"The term used in the Code for the officer who enforces Chapter VI is:","o":["Labour Inspector","Inspector-cum-Facilitator","Welfare Officer","Conciliation Officer"],"a":1,"e":"The Code replaces the \"Inspector\" of the old Acts with the \"Inspector-cum-Facilitator\", who is also expected to advise employers and workers on compliance (S.122). Under S.72 this officer may direct payment of maternity benefit."},{"id":"labour-14","t":"S.59","q":"No employer shall knowingly employ a woman during the ____ immediately following the day of her delivery:","o":["Four weeks","Six weeks","Eight weeks","Twelve weeks"],"a":1,"e":"S.59(1): no employer shall knowingly employ a woman in any establishment during the six weeks immediately following the day of her delivery, miscarriage or medical termination of pregnancy."},{"id":"labour-15","t":"S.59","q":"S.59 prohibits employment of a woman following:","o":["Delivery only","Delivery or miscarriage only","Delivery, miscarriage or medical termination of pregnancy","Tubectomy only"],"a":2,"e":"S.59(1) and (2) cover the six weeks after delivery, miscarriage or medical termination of pregnancy. S.59(2) correspondingly prohibits the woman from working in any establishment during that period."},{"id":"labour-16","t":"S.59","q":"Under S.59(3), on a request made by a pregnant woman, the employer shall not require her to do:","o":["Any work at all","Work of an arduous nature, involving long hours of standing, or likely to interfere with her pregnancy or the normal development of the foetus","Night work only","Clerical work"],"a":1,"e":"S.59(3): no pregnant woman shall, on a request made by her, be required to do work which is of an arduous nature or involves long hours of standing or is likely to interfere with her pregnancy or the normal development of the foetus, or is likely to cause her miscarriage or otherwise adversely affect her health."},{"id":"labour-17","t":"S.59","q":"The protection under S.59(3) against arduous work applies during:","o":["The entire pregnancy","The one month immediately preceding the six weeks before expected delivery, and any part of those six weeks for which she does not avail leave","Only the last week of pregnancy","Six months after delivery"],"a":1,"e":"S.59(4): the period is (a) the one month immediately preceding the period of six weeks before the date of her expected delivery, and (b) any period during the said six weeks for which the woman does not avail of leave of absence under S.62."},{"id":"labour-18","t":"S.60","q":"To be entitled to maternity benefit, a woman must have actually worked in the establishment for not less than:","o":["80 days in the preceding 12 months","160 days in the preceding 12 months","240 days in the preceding 12 months","90 days in the preceding 6 months"],"a":0,"e":"S.60(2): no woman shall be entitled to maternity benefit unless she has actually worked in an establishment of the employer for a period of not less than eighty days in the twelve months immediately preceding the date of her expected delivery."},{"id":"labour-19","t":"S.60","q":"For computing the 80 days under S.60(2), which days are counted?","o":["Only days physically worked","Days actually worked plus days of lay-off and paid holidays","Only days on which wages were paid in cash","Only working days of the last month"],"a":1,"e":"Explanation to S.60(2): the days on which a woman has actually worked include days for which she has been laid off or was on holidays declared under any law with wages."},{"id":"labour-20","t":"S.60","q":"The maximum period for which a woman is entitled to maternity benefit is:","o":["12 weeks","18 weeks","26 weeks","52 weeks"],"a":2,"e":"S.60(3): the maximum period for which any woman shall be entitled to maternity benefit shall be twenty-six weeks, of which not more than eight weeks shall precede the expected date of delivery."},{"id":"labour-21","t":"S.60","q":"Out of 26 weeks of maternity benefit, not more than ____ shall precede the expected date of delivery:","o":["4 weeks","6 weeks","8 weeks","12 weeks"],"a":2,"e":"S.60(3): not more than eight weeks of the twenty-six shall precede the date of expected delivery; the balance is taken after delivery."},{"id":"labour-22","t":"S.60","q":"A woman having two or more surviving children is entitled to maternity benefit for:","o":["26 weeks","12 weeks","8 weeks","6 weeks"],"a":1,"e":"Proviso to S.60(3): the maximum period for a woman having two or more surviving children shall be twelve weeks, of which not more than six weeks shall precede the date of her expected delivery."},{"id":"labour-23","t":"S.60","q":"For a woman with two or more surviving children, not more than ____ of the 12 weeks may precede the expected delivery:","o":["2 weeks","4 weeks","6 weeks","8 weeks"],"a":2,"e":"Proviso to S.60(3): twelve weeks, of which not more than six weeks shall precede the date of her expected delivery."},{"id":"labour-24","t":"S.60","q":"If a woman dies during the maternity benefit period, the benefit is payable:","o":["For the entire 26 weeks","Only for the days up to and including the day of her death","Not at all","For 12 weeks only"],"a":1,"e":"Second proviso to S.60(3): where a woman dies during this period, the maternity benefit shall be payable only for the days up to and including the day of her death. If she dies during delivery or the period after, leaving the child, the employer is liable for the entire period; if the child also dies, up to and including the day of the child's death."},{"id":"labour-25","t":"S.60","q":"A woman who legally adopts a child below the age of ____ is entitled to maternity benefit for 12 weeks:","o":["Three months","Six months","One year","Two years"],"a":0,"e":"S.60(4): a woman who legally adopts a child below the age of three months, or a commissioning mother, is entitled to maternity benefit for twelve weeks from the date the child is handed over to her."},{"id":"labour-26","t":"S.60","q":"A \"commissioning mother\" is entitled to maternity benefit for:","o":["6 weeks","12 weeks from the date the child is handed over","26 weeks","No benefit"],"a":1,"e":"S.60(4): the twelve-week benefit for an adopting or commissioning mother runs from the date the child is handed over to her."},{"id":"labour-27","t":"S.60","q":"Maternity benefit is payable at the rate of:","o":["Minimum wage","Half of the average daily wage","The average daily wage for the period of actual absence","Basic wage only"],"a":2,"e":"S.60(1): every woman is entitled to, and her employer liable for, payment of maternity benefit at the rate of the average daily wage for the period of her actual absence (the period immediately preceding the day of delivery, the day of delivery, and the period immediately following)."},{"id":"labour-28","t":"S.60","q":"\"Average daily wage\" is calculated on wages payable for the days worked during the ____ immediately preceding the date of absence:","o":["One calendar month","Three calendar months","Six calendar months","Twelve calendar months"],"a":1,"e":"Explanation to S.60(1): average daily wage means the average of the woman's wages payable to her for the days on which she has worked during the three calendar months immediately preceding the date from which she absents herself on account of maternity."},{"id":"labour-29","t":"S.60","q":"The average daily wage for maternity benefit is subject to a floor of:","o":["Rs 100 per day","The minimum rate of wage fixed or revised under the Code on Wages, 2019","Rs 3,500","The ESI wage ceiling"],"a":1,"e":"Explanation to S.60(1): the average daily wage is subject to the minimum rate of wage fixed or revised under the Code on Wages, 2019."},{"id":"labour-30","t":"S.60","q":"The provision enabling \"work from home\" after availing maternity benefit is in:","o":["S.59","S.60(5)","S.66","S.70"],"a":1,"e":"S.60(5): where the nature of work assigned to a woman is such that she may work from home, the employer may allow her to do so after availing the maternity benefit, on conditions mutually agreed between the employer and the woman."},{"id":"labour-31","t":"S.61","q":"Under S.61, a woman entitled to maternity benefit under Chapter VI continues to be so entitled even after ESI becomes applicable to her establishment until:","o":["She resigns","She becomes qualified to claim maternity benefit under S.32 (ESI)","Her child is one year old","The employer decides"],"a":1,"e":"S.61: every woman entitled to maternity benefit under this Chapter shall, notwithstanding the application of Chapter IV (ESI) to the establishment, continue to be so entitled until she becomes qualified to claim maternity benefit under S.32."},{"id":"labour-32","t":"S.62","q":"Notice of claim for maternity benefit is given under:","o":["S.60","S.62","S.64","S.68"],"a":1,"e":"S.62 provides for the notice of claim for maternity benefit and the manner of its payment."},{"id":"labour-33","t":"S.62","q":"The notice under S.62 must state that:","o":["The woman will not work in any establishment during the period for which she receives maternity benefit","The benefit may be paid to her or her nominee","Both (a) and (b)","She has resigned"],"a":2,"e":"S.62(1): the notice states that maternity benefit and any other amount may be paid to her or to such person as she nominates, and that she will not work in any establishment during the period for which she receives maternity benefit."},{"id":"labour-34","t":"S.62","q":"Under S.62(2), a pregnant woman giving notice shall state the date from which she will be absent, not being earlier than ____ from the expected date of delivery:","o":["Four weeks","Six weeks","Eight weeks","Twelve weeks"],"a":2,"e":"S.62(2): in the case of a woman who is pregnant, the notice shall state the date from which she will be absent from work, not being a date earlier than eight weeks from the date of her expected delivery."},{"id":"labour-35","t":"S.62","q":"A woman who has not given notice while pregnant may give it:","o":["Never","As soon as possible after the delivery","Only within 7 days of delivery","Only through the Inspector-cum-Facilitator"],"a":1,"e":"S.62(3): any woman who has not given the notice when she was pregnant may give such notice as soon as possible after the delivery."},{"id":"labour-36","t":"S.62","q":"Under S.62(5), the amount of maternity benefit for the period preceding the expected delivery is paid:","o":["After delivery","In advance, on production of proof of pregnancy","Only at the end of 26 weeks","Through the ESI Corporation"],"a":1,"e":"S.62(5): the amount for the period preceding the date of her expected delivery shall be paid in advance by the employer on production of such proof as may be prescribed that the woman is pregnant."},{"id":"labour-37","t":"S.62","q":"The amount of maternity benefit for the period after delivery shall be paid within ____ of production of proof of delivery:","o":["24 hours","48 hours","7 days","30 days"],"a":1,"e":"S.62(5): the amount due for the subsequent period shall be paid by the employer within forty-eight hours of production of proof that the woman has been delivered of a child."},{"id":"labour-38","t":"S.62","q":"Failure to give notice of claim under S.62:","o":["Disentitles the woman to maternity benefit","Does not disentitle her to maternity benefit","Results in a fine","Results in dismissal"],"a":1,"e":"S.62(6): the failure to give notice shall not disentitle a woman to maternity benefit if she is otherwise entitled; the Inspector-cum-Facilitator may order payment within the prescribed period."},{"id":"labour-39","t":"S.63","q":"If a woman entitled to maternity benefit dies, the amount is paid to:","o":["The State Government","Her nominee, or if none, her legal representative","The employer","The Inspector-cum-Facilitator"],"a":1,"e":"S.63: if a woman entitled to maternity benefit or any other amount dies before receiving it, the employer shall pay it to the person nominated in the notice under S.62, and if there is no such nominee, to her legal representative."},{"id":"labour-40","t":"S.64","q":"The medical bonus under S.64 is:","o":["Rs 1,000","Rs 2,500","Rs 3,500","Rs 5,000"],"a":2,"e":"S.64: every woman entitled to maternity benefit shall also be entitled to receive from her employer a medical bonus of three thousand five hundred rupees, or such amount as may be notified by the Central Government."},{"id":"labour-41","t":"S.64","q":"Medical bonus is payable when:","o":["The woman has more than two children","No pre-natal confinement and post-natal care is provided by the employer free of charge","The woman is covered by ESI","The delivery is by surgery"],"a":1,"e":"S.64: the medical bonus is payable if no pre-natal confinement and post-natal care is provided for by the employer free of charge."},{"id":"labour-42","t":"S.65","q":"In case of miscarriage, a woman is entitled to leave with wages for:","o":["2 weeks","4 weeks","6 weeks","12 weeks"],"a":2,"e":"S.65(1): in case of miscarriage or medical termination of pregnancy, a woman shall, on production of prescribed proof, be entitled to leave with wages at the rate of maternity benefit for a period of six weeks immediately following the day of her miscarriage or termination."},{"id":"labour-43","t":"S.65","q":"Leave with wages for a tubectomy operation is:","o":["One week","Two weeks","Four weeks","Six weeks"],"a":1,"e":"S.65(2): in case of tubectomy operation, a woman shall, on production of proof, be entitled to leave with wages at the rate of maternity benefit for a period of two weeks immediately following the day of her tubectomy operation."},{"id":"labour-44","t":"S.65","q":"Additional leave for illness arising out of pregnancy, delivery, premature birth or miscarriage is up to a maximum of:","o":["Two weeks","One month","Two months","Three months"],"a":1,"e":"S.65(3): a woman suffering from illness arising out of pregnancy, delivery, premature birth of child, miscarriage, medical termination of pregnancy or tubectomy operation shall, on production of proof, be entitled, in addition to the period of absence allowed under Ss. 60 and 65(1)-(2), to leave with wages at the rate of maternity benefit for a maximum period of one month."},{"id":"labour-45","t":"S.66","q":"Nursing breaks under S.66 are allowed until the child attains the age of:","o":["6 months","12 months","15 months","24 months"],"a":2,"e":"S.66: every woman delivered of a child who returns to duty after such delivery shall, in addition to the interval for rest allowed to her, be allowed in the course of her daily work two breaks of the prescribed duration for nursing the child until the child attains the age of fifteen months."},{"id":"labour-46","t":"S.66","q":"The number of nursing breaks allowed in the course of daily work is:","o":["One","Two","Three","Four"],"a":1,"e":"S.66 allows two breaks of the prescribed duration for nursing the child, in addition to the interval for rest."},{"id":"labour-47","t":"S.67","q":"A creche facility is mandatory in every establishment having:","o":["10 employees","20 employees","50 employees","100 employees"],"a":2,"e":"S.67(1): every establishment to which this Chapter applies, in which fifty employees or such number as may be prescribed by the Central Government are employed, shall have the facility of creche within such distance as may be prescribed, either separately or along with common facilities."},{"id":"labour-48","t":"S.67","q":"The employer shall allow ____ visits a day to the creche by the woman:","o":["Two","Three","Four","Unlimited"],"a":2,"e":"Proviso to S.67(1): the employer shall allow four visits a day to the creche by the woman, which shall also include the interval for rest allowed to her."},{"id":"labour-49","t":"S.67","q":"Under S.67(2), every establishment shall intimate the benefits available under Chapter VI to every woman:","o":["At the time of her initial appointment, in writing and electronically","Only when she becomes pregnant","On the notice board only","Through the trade union"],"a":0,"e":"S.67(2): every establishment shall intimate in writing and electronically to every woman at the time of her initial appointment regarding every benefit available under this Chapter."},{"id":"labour-50","t":"S.68","q":"Under S.68, when a woman absents herself from work in accordance with Chapter VI, it is unlawful for the employer to:","o":["Discharge or dismiss her during or on account of such absence","Give notice of discharge or dismissal expiring during such absence","Vary her conditions of service to her disadvantage","All of the above"],"a":3,"e":"S.68(1) makes all three unlawful: discharge or dismissal during or on account of the absence, notice expiring during the absence, and varying the conditions of service to her disadvantage."},{"id":"labour-51","t":"S.68","q":"A woman may be deprived of maternity benefit and medical bonus on dismissal for:","o":["Absence due to pregnancy","Gross misconduct as prescribed by the Central Government","Poor performance","Union activities"],"a":1,"e":"Proviso to S.68(2): where the dismissal is for any gross misconduct as may be prescribed by the Central Government, the employer may, by order in writing communicated to the woman, deprive her of the maternity benefit or medical bonus or both."},{"id":"labour-52","t":"S.68","q":"An appeal against an order depriving a woman of maternity benefit under S.68 lies within:","o":["30 days","45 days","60 days","90 days"],"a":2,"e":"S.68(3): any woman deprived of maternity benefit or medical bonus, or discharged or dismissed during or on account of her absence, may within sixty days from the date the order is communicated appeal to the prescribed authority, whose decision is final."},{"id":"labour-53","t":"S.69","q":"Deduction from wages by reason only of nursing breaks or lighter work assigned is prohibited by:","o":["S.66","S.68","S.69","S.70"],"a":2,"e":"S.69: no deduction from the normal and usual daily wages of a woman shall be made by reason only of the nature of work assigned to her under S.59(3) or the breaks for nursing the child allowed under S.66."},{"id":"labour-54","t":"S.70","q":"A woman who works for remuneration during her authorised maternity absence:","o":["Is liable to imprisonment","Forfeits her claim to maternity benefit for that period","Gets double wages","Is dismissed"],"a":1,"e":"S.70: if a woman works in any establishment for remuneration during the period she has been permitted by the employer to absent herself under S.62, she shall forfeit her claim to the maternity benefit for such period."},{"id":"labour-55","t":"S.71","q":"The abstract of the provisions of Chapter VI must be exhibited by the employer under:","o":["S.67","S.69","S.71","S.72"],"a":2,"e":"S.71: an abstract of the provisions of this Chapter and the rules relating thereto, in the language or languages of the locality, shall be exhibited in a conspicuous place by the employer in every part of the establishment in which women are employed."},{"id":"labour-56","t":"S.72","q":"Under S.72, the power to direct payment of maternity benefit improperly withheld vests in:","o":["The Labour Court","The Inspector-cum-Facilitator","The Civil Court","The employer"],"a":1,"e":"S.72(1): any woman claiming that maternity benefit or any other amount has been improperly withheld, or that she has been discharged or dismissed during her absence, may make a complaint to the Inspector-cum-Facilitator, who may also act suo motu, inquire and direct payment."},{"id":"labour-57","t":"S.72","q":"An appeal against the decision of the Inspector-cum-Facilitator under S.72 lies within:","o":["15 days","30 days","60 days","90 days"],"a":1,"e":"S.72(2): any person aggrieved by the decision of the Inspector-cum-Facilitator may, within thirty days from the date on which the decision is communicated, appeal to the authority prescribed."},{"id":"labour-58","t":"S.72","q":"Under S.72(3), where no appeal is preferred, the decision of the Inspector-cum-Facilitator is:","o":["Void","Final","Subject to revision by the civil court","Advisory"],"a":1,"e":"S.72(3): the decision of the prescribed authority where an appeal is preferred, or of the Inspector-cum-Facilitator where no appeal is preferred, shall be final."},{"id":"labour-59","t":"S.72","q":"Under S.72(4), any amount payable under Chapter VI is recoverable:","o":["Only by civil suit","In the manner prescribed (as an arrear of land revenue)","Through the police","Through the ESI Corporation"],"a":1,"e":"S.72(4): any amount payable under this Chapter shall be recoverable by the Inspector-cum-Facilitator in the manner prescribed, which includes recovery as an arrear of land revenue."},{"id":"labour-60","t":"Cases","q":"Maternity benefit is available to women employed on daily wages. Held in:","o":["Air India v. Nergesh Meerza","Municipal Corporation of Delhi v. Female Workers (Muster Roll)","Vishaka v. State of Rajasthan","Bandhua Mukti Morcha v. Union of India"],"a":1,"e":"Municipal Corporation of Delhi v. Female Workers (Muster Roll) (2000): the Supreme Court extended the benefits of the Maternity Benefit Act to casual and daily-wage women workers, relying on Articles 42 and 15(3) and the Universal Declaration of Human Rights."},{"id":"labour-61","t":"Cases","q":"Sundays are to be included in computing maternity benefit. Held in:","o":["B. Shah v. Presiding Officer, Labour Court","Deepika Singh v. CAT","Air India v. Nergesh Meerza","D.K. Basu v. State of W.B."],"a":0,"e":"B. Shah v. Presiding Officer, Labour Court, Coimbatore (1978): \"week\" means a cycle of seven days including Sundays, so maternity benefit must be computed for all seven days of each week, not only working days. The Act is beneficial legislation to be construed liberally."},{"id":"labour-62","t":"Cases","q":"In Air India v. Nergesh Meerza (1981), the Supreme Court struck down:","o":["The retirement age of pilots","Termination of air hostesses on first pregnancy as arbitrary and violative of Article 14","The ESI contribution","The creche rule"],"a":1,"e":"Air India v. Nergesh Meerza (1981): the regulation requiring air hostesses to retire on first pregnancy was held to be unreasonable, arbitrary and violative of Article 14."},{"id":"labour-63","t":"Cases","q":"Deepika Singh v. Central Administrative Tribunal (2022) held that:","o":["Maternity leave cannot be claimed by government servants","Maternity leave cannot be denied merely because the woman has stepchildren from her husband's earlier marriage; the family is to be understood in its diverse forms","Maternity benefit requires 240 days of service","Only biological mothers get leave"],"a":1,"e":"Deepika Singh v. CAT (2022): the Supreme Court granted maternity leave to a woman for her first biological child, holding that the earlier grant of child-care leave for her stepchildren could not disentitle her, and that atypical families deserve equal protection."},{"id":"labour-64","t":"Numbers","q":"Which of the following statements is correct about the maternity benefit period under the Code?","o":["26 weeks, of which not more than 8 weeks before expected delivery","26 weeks, of which not more than 12 weeks before delivery","12 weeks, of which not more than 8 weeks before delivery","24 weeks, of which not more than 6 weeks before delivery"],"a":0,"e":"S.60(3): twenty-six weeks, of which not more than eight shall precede the expected date of delivery. For a woman with two or more surviving children: twelve weeks, of which not more than six precede delivery."},{"id":"labour-65","t":"Numbers","q":"Match the correct limitation period: appeal under S.68 and appeal under S.72 respectively are:","o":["30 days and 60 days","60 days and 30 days","30 days and 30 days","60 days and 60 days"],"a":1,"e":"S.68(3): sixty days to appeal against deprivation of maternity benefit or dismissal. S.72(2): thirty days to appeal against the decision of the Inspector-cum-Facilitator."},{"id":"labour-66","t":"Numbers","q":"Which of the following leave periods is NOT correctly stated?","o":["Miscarriage: 6 weeks","Tubectomy: 2 weeks","Illness arising out of pregnancy: up to 1 month","Medical termination of pregnancy: 12 weeks"],"a":3,"e":"Leave after medical termination of pregnancy is six weeks (S.65(1)), the same as for miscarriage; the other three are correctly stated."}]},{"key":"pil","name":"Public International Law","short":"PIL","scope":"Units I and II","topics":["Nature","Basis","Sources","Relationship","Subjects","State","Recognition","Succession","Territory","Jurisdiction","Responsibility","Nationality","UN"],"questions":[{"id":"pil-1","t":"Nature","q":"The term \"international law\" was coined by:","o":["Hugo Grotius","Jeremy Bentham","Oppenheim","John Austin"],"a":1,"e":"Jeremy Bentham coined the term \"international law\" in his Introduction to the Principles of Morals and Legislation (1780, published 1789). Earlier it was called the \"law of nations\" (jus gentium)."},{"id":"pil-2","t":"Nature","q":"Who is regarded as the father of international law?","o":["Jeremy Bentham","Hugo Grotius","Vattel","Kelsen"],"a":1,"e":"Hugo Grotius, the Dutch jurist (1583-1645), is called the father of international law for systematising the subject in De Jure Belli ac Pacis (1625)."},{"id":"pil-3","t":"Nature","q":"\"De Jure Belli ac Pacis\" (1625) was written by:","o":["Pufendorf","Bynkershoek","Hugo Grotius","Oppenheim"],"a":2,"e":"De Jure Belli ac Pacis (On the Law of War and Peace), 1625, by Hugo Grotius, is the foundational treatise of modern international law."},{"id":"pil-4","t":"Nature","q":"\"Le Droit des Gens\" (The Law of Nations), 1758, was written by:","o":["Emmerich de Vattel","Grotius","Pufendorf","Gentili"],"a":0,"e":"Vattel's Le Droit des Gens (1758) was highly influential in the 18th and 19th centuries and strongly emphasised the sovereign equality of States."},{"id":"pil-5","t":"Nature","q":"Who described international law as \"positive morality\"?","o":["Austin","Holland","Starke","Brierly"],"a":0,"e":"John Austin, the English positivist, argued that law is the command of a sovereign backed by sanction; since international law has neither, he called it positive international morality."},{"id":"pil-6","t":"Nature","q":"\"International law is the vanishing point of jurisprudence\" was stated by:","o":["Austin","Holland","Oppenheim","Kelsen"],"a":1,"e":"T.E. Holland described international law as the vanishing point of jurisprudence because it lacks an arbiter and its rules rest on the consent of States."},{"id":"pil-7","t":"Nature","q":"Which jurist defined international law as the body of customary and conventional rules considered legally binding by civilised States in their intercourse with each other?","o":["Oppenheim","Starke","Brierly","Hall"],"a":0,"e":"This is Oppenheim's classic definition. It has been criticised for using the words \"civilised States\" and for ignoring international organisations and individuals."},{"id":"pil-8","t":"Nature","q":"The beginning of the modern State system and of modern international law is usually traced to:","o":["The Congress of Vienna, 1815","The Peace of Westphalia, 1648","The Treaty of Versailles, 1919","The UN Charter, 1945"],"a":1,"e":"The Peace of Westphalia (1648), which ended the Thirty Years' War, recognised the sovereignty and equality of States and is treated as the starting point of the modern system."},{"id":"pil-9","t":"Nature","q":"Which of the following distinguishes public international law from private international law?","o":["Public international law governs relations between States; private international law (conflict of laws) deals with cases involving a foreign element between private persons","There is no difference","Private international law is enacted by the UN","Public international law applies only to individuals"],"a":0,"e":"Public international law governs States and other international persons; private international law is part of municipal law and decides which law applies and which court has jurisdiction in cases with a foreign element."},{"id":"pil-10","t":"Nature","q":"Which writers regard international law as true law?","o":["Austin and Holland","Oppenheim, Starke, Brierly and Hall","Hobbes and Bentham","None of them"],"a":1,"e":"Oppenheim, Starke, Brierly, Hall and Lawrence treat international law as true law because States regard it as binding and observe it in practice, even though it lacks a central legislature and compulsory enforcement."},{"id":"pil-11","t":"Basis","q":"Which theory holds that international law is part of the law of nature?","o":["Positivist theory","Naturalist theory","Consent theory","Auto-limitation theory"],"a":1,"e":"The naturalist school (Grotius, Pufendorf, Vattel) holds that international law derives its binding force from natural law, i.e., reason and the nature of man."},{"id":"pil-12","t":"Basis","q":"According to the positivist theory, the basis of international law is:","o":["Divine will","Natural reason","The consent and practice of States","Morality"],"a":2,"e":"Positivists such as Bynkershoek, Anzilotti and Triepel hold that international law is binding because States have consented to it, expressly through treaties or tacitly through custom."},{"id":"pil-13","t":"Basis","q":"Anzilotti traced the binding force of international law to the principle of:","o":["Jus cogens","Pacta sunt servanda","Rebus sic stantibus","Opinio juris"],"a":1,"e":"Dionisio Anzilotti held that the entire system of international law rests on the fundamental norm pacta sunt servanda: agreements must be kept."},{"id":"pil-14","t":"Basis","q":"The auto-limitation theory, which explains State consent as voluntary self-limitation of sovereignty, is associated with:","o":["Jellinek","Kelsen","Grotius","Lauterpacht"],"a":0,"e":"Georg Jellinek propounded the auto-limitation (self-limitation) theory, under which a sovereign State is bound by international law because it has voluntarily limited its own sovereignty."},{"id":"pil-15","t":"Basis","q":"Hans Kelsen's \"pure theory\" explains the validity of international law through:","o":["The will of the sovereign","A basic norm (Grundnorm) at the apex of a single legal order","Natural justice","Treaties alone"],"a":1,"e":"Kelsen, a monist, places international law and municipal law in one hierarchy deriving validity from a Grundnorm, with international law at the top."},{"id":"pil-16","t":"Sources","q":"The sources of international law are enumerated in:","o":["Article 38 of the UN Charter","Article 38(1) of the Statute of the ICJ","Article 2(4) of the UN Charter","Article 51 of the UN Charter"],"a":1,"e":"Article 38(1) of the Statute of the International Court of Justice lists conventions, custom, general principles, and (as subsidiary means) judicial decisions and teachings of publicists."},{"id":"pil-17","t":"Sources","q":"Under Art. 38(1)(a), international conventions are a source whether:","o":["General or particular, establishing rules expressly recognised by the contesting States","Only multilateral","Only bilateral","Only those registered with the UN"],"a":0,"e":"Art. 38(1)(a) refers to international conventions, whether general or particular, establishing rules expressly recognised by the contesting States."},{"id":"pil-18","t":"Sources","q":"Which of the following is a \"subsidiary means\" for determination of rules of law under Art. 38(1)(d)?","o":["Treaties","Custom","General principles of law","Judicial decisions and teachings of publicists"],"a":3,"e":"Art. 38(1)(d): judicial decisions and the teachings of the most highly qualified publicists of the various nations are subsidiary means, subject to Art. 59."},{"id":"pil-19","t":"Sources","q":"The power of the ICJ to decide a case ex aequo et bono is under:","o":["Art. 36","Art. 38(2)","Art. 59","Art. 65"],"a":1,"e":"Art. 38(2): the provision does not prejudice the power of the Court to decide a case ex aequo et bono (according to what is fair and good) if the parties agree. No case has yet been decided on this basis."},{"id":"pil-20","t":"Sources","q":"The two elements of international custom are:","o":["Treaty and consent","State practice and opinio juris","Equity and justice","Recognition and succession"],"a":1,"e":"A rule of customary international law requires a general and consistent State practice (the material element) and opinio juris sive necessitatis, the belief that the practice is required by law (the psychological element)."},{"id":"pil-21","t":"Sources","q":"\"Opinio juris sive necessitatis\" was emphasised by the ICJ in:","o":["North Sea Continental Shelf Cases","Corfu Channel Case","Chorzow Factory Case","Reparation Case"],"a":0,"e":"North Sea Continental Shelf Cases (Germany v. Denmark and Netherlands, 1969): the ICJ held that the equidistance rule had not become custom because the practice lacked opinio juris, and that a short period of practice is not a bar if it is extensive and uniform."},{"id":"pil-22","t":"Sources","q":"Regional custom was discussed in:","o":["Asylum Case (Colombia v. Peru)","Lotus Case","Island of Palmas Case","Trail Smelter Arbitration"],"a":0,"e":"Asylum Case (1950): Colombia relied on a Latin American regional custom of diplomatic asylum; the ICJ held that a party relying on a regional custom must prove it is established and binding on the other party, which Colombia failed to do."},{"id":"pil-23","t":"Sources","q":"A local custom between two States was recognised in:","o":["Right of Passage Case (Portugal v. India)","Nicaragua Case","Barcelona Traction Case","Eichmann Case"],"a":0,"e":"Right of Passage over Indian Territory (Portugal v. India, 1960): the ICJ recognised a local custom between just two States giving Portugal a right of passage for private persons and goods, but not armed forces, between Daman and the enclaves."},{"id":"pil-24","t":"Sources","q":"The \"persistent objector\" rule, under which a State that consistently objects to a custom during its formation is not bound by it, is associated with:","o":["Anglo-Norwegian Fisheries Case (1951)","Lotus Case","Asylum Case","Corfu Channel Case"],"a":0,"e":"In the Anglo-Norwegian Fisheries Case (UK v. Norway, 1951), the ICJ noted that the ten-mile rule for bays would in any event be inapplicable against Norway, which had always opposed it."},{"id":"pil-25","t":"Sources","q":"In the Lotus Case (1927), the PCIJ held that:","o":["Restrictions upon the independence of States cannot be presumed","Turkey had no jurisdiction","Custom requires 100 years of practice","Treaties override custom"],"a":0,"e":"S.S. Lotus (France v. Turkey, PCIJ 1927): international law leaves States a wide measure of discretion; restrictions on their independence cannot be presumed. Turkey could prosecute the French officer for a collision on the high seas with effects on a Turkish ship."},{"id":"pil-26","t":"Sources","q":"The principle that customary international law is part of the law of the United States was laid down in:","o":["Paquete Habana (1900)","Luther v. Sagor","Mortensen v. Peters","Tinoco Arbitration"],"a":0,"e":"The Paquete Habana (1900): the US Supreme Court held that \"international law is part of our law\" and applied the customary rule exempting coastal fishing vessels from capture as prize of war."},{"id":"pil-27","t":"Sources","q":"The Vienna Convention on the Law of Treaties was adopted in ____ and entered into force in ____:","o":["1945; 1946","1969; 1980","1978; 1996","1961; 1964"],"a":1,"e":"The VCLT was adopted on 23 May 1969 and entered into force on 27 January 1980. India has signed but not ratified it, though it treats most of its provisions as customary law."},{"id":"pil-28","t":"Sources","q":"\"Pacta sunt servanda\" means:","o":["Treaties are void","Treaties must be performed in good faith","Custom overrides treaty","War is unlawful"],"a":1,"e":"Art. 26 VCLT: every treaty in force is binding upon the parties to it and must be performed by them in good faith."},{"id":"pil-29","t":"Sources","q":"Jus cogens (peremptory norms) is dealt with in which Article of the Vienna Convention on the Law of Treaties, 1969?","o":["Art. 2","Art. 26","Art. 53","Art. 62"],"a":2,"e":"Art. 53 VCLT: a treaty is void if it conflicts with a peremptory norm of general international law, i.e., a norm accepted and recognised by the international community as a whole from which no derogation is permitted (e.g., prohibition of genocide, slavery, torture, aggression)."},{"id":"pil-30","t":"Sources","q":"The doctrine of rebus sic stantibus (fundamental change of circumstances) is in which Article of the VCLT?","o":["Art. 26","Art. 53","Art. 62","Art. 31"],"a":2,"e":"Art. 62 VCLT permits termination or withdrawal for a fundamental change of circumstances only in narrow conditions, and never for boundary treaties."},{"id":"pil-31","t":"Sources","q":"Under Art. 2 of the VCLT, a \"treaty\" is an international agreement concluded between:","o":["States and individuals","States in written form and governed by international law","Any persons","States, orally or in writing"],"a":1,"e":"Art. 2(1)(a) VCLT: \"treaty\" means an international agreement concluded between States in written form and governed by international law, whether embodied in a single instrument or in two or more related instruments, and whatever its particular designation."},{"id":"pil-32","t":"Sources","q":"The ICJ recognised obligations \"erga omnes\" (owed to the international community as a whole) in:","o":["Barcelona Traction Case","Island of Palmas Case","Luther v. Sagor","Mortensen v. Peters"],"a":0,"e":"Barcelona Traction, Light and Power Co. (Belgium v. Spain, 1970): the Court distinguished obligations owed to particular States from obligations erga omnes, such as the outlawing of aggression and genocide and protection from slavery and racial discrimination."},{"id":"pil-33","t":"Sources","q":"The principle of estoppel as a general principle of law was applied in:","o":["Temple of Preah Vihear Case (1962)","Lotus Case","Asylum Case","Paquete Habana"],"a":0,"e":"Temple of Preah Vihear (Cambodia v. Thailand, 1962): Thailand, having accepted a map showing the temple in Cambodia for many years, was precluded from denying it."},{"id":"pil-34","t":"Sources","q":"Under Art. 59 of the ICJ Statute, a decision of the Court:","o":["Binds all States","Has no binding force except between the parties and in respect of that case","Is only advisory","Binds the General Assembly"],"a":1,"e":"Art. 59: the decision of the Court has no binding force except between the parties and in respect of that particular case. There is no doctrine of binding precedent, though the Court follows its earlier decisions in practice."},{"id":"pil-35","t":"Sources","q":"Resolutions of the UN General Assembly are generally regarded as:","o":["Binding law","\"Soft law\" or evidence of State practice and opinio juris","Treaties","Jus cogens"],"a":1,"e":"General Assembly resolutions are recommendatory (except on internal matters such as the budget), but may provide evidence of custom or crystallise emerging norms, as in the Nicaragua Case."},{"id":"pil-36","t":"Sources","q":"Equity as a source of international law was applied by Judge Hudson in:","o":["Diversion of Water from the Meuse Case (1937)","Lotus Case","Corfu Channel Case","Eichmann Case"],"a":0,"e":"In the Diversion of Water from the Meuse (Netherlands v. Belgium, PCIJ 1937), Judge Manley Hudson in his individual opinion applied principles of equity as part of international law."},{"id":"pil-37","t":"Relationship","q":"According to Monism:","o":["International law and municipal law are two separate systems","International law and municipal law are parts of one legal system","Municipal law does not exist","Only treaties are law"],"a":1,"e":"Monists (Kelsen, Wright, Duguit) hold that international and municipal law are parts of a single legal order, with international law supreme, so it applies domestically without transformation."},{"id":"pil-38","t":"Relationship","q":"The chief exponents of Dualism are:","o":["Kelsen and Duguit","Triepel and Anzilotti","Grotius and Vattel","Hall and Brierly"],"a":1,"e":"Triepel and Anzilotti hold that international law and municipal law are two distinct systems with different sources, subjects and subject-matter, so international law must be transformed into municipal law before courts can apply it."},{"id":"pil-39","t":"Relationship","q":"The \"transformation\" or \"specific adoption\" theory holds that:","o":["International law automatically applies in municipal courts","International law applies domestically only when specifically adopted or transformed by legislation","Municipal law overrides international law always","Treaties are self-executing"],"a":1,
